<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architektúra Tervezése — Erők és Dokumentáció</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');
:root {
  --bg:#0a0f1e; --surf:#0f1628; --card:#141d35; --brd:#1e2d50; --brd2:#263a68;
  --text:#d8e4ff; --muted:#4a5f8a;
  --forc:#a855f7; --doc:#3b82f6; --code:#10b981; --rev:#f59e0b;
  --func:#22d3ee; --quality:#ef4444; --nontech:#f97316; --freedom:#6366f1;
  --acc:#a855f7;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(168,85,247,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(59,130,246,.04) 0%,transparent 50%);pointer-events:none;z-index:0;}
header{position:relative;z-index:1;padding:1.2rem 1.3rem .85rem;border-bottom:1px solid var(--brd2);background:linear-gradient(180deg,rgba(168,85,247,.06) 0%,transparent 100%);}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;}
h1{font-size:1.4rem;font-weight:800;line-height:1.07;letter-spacing:-.02em;}
h1 span{color:var(--forc);}h1 em{font-style:normal;color:var(--code);}
.tag{font-family:'Inconsolata',monospace;font-size:.56rem;padding:.25rem .55rem;border-radius:4px;background:rgba(168,85,247,.12);color:var(--forc);border:1px solid rgba(168,85,247,.28);white-space:nowrap;margin-top:.2rem;}
header p{font-size:.7rem;color:var(--muted);margin-top:.25rem;font-family:'Inconsolata',monospace;}
.topbar{position:relative;z-index:1;background:var(--surf);border-bottom:1px solid var(--brd2);padding:.75rem 1.3rem .65rem;}
.tb-t{font-family:'Inconsolata',monospace;font-size:.54rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:.5rem;}
.steps{display:flex;align-items:center;gap:0;margin-bottom:.45rem;}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:.18rem;position:relative;}
.st:not(:last-child)::after{content:'';position:absolute;right:0;top:12px;width:50%;height:2px;background:var(--brd);z-index:0;}
.st:not(:first-child)::before{content:'';position:absolute;left:0;top:12px;width:50%;height:2px;background:var(--brd);z-index:0;}
.sd{width:24px;height:24px;border-radius:50%;border:2px solid var(--brd2);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.6rem;z-index:1;transition:all .35s;position:relative;}
.sl{font-family:'Inconsolata',monospace;font-size:.44rem;color:var(--muted);text-align:center;line-height:1.2;}
.st.active .sd{transform:scale(1.25);box-shadow:0 0 10px currentColor;}
.st.done .sd{opacity:.55;}
.st.active .sl{font-weight:700;}
.force-chips{display:flex;gap:4px;flex-wrap:wrap;}
.fc{font-family:'Inconsolata',monospace;font-size:.53rem;font-weight:700;padding:.14rem .4rem;border-radius:3px;border:1px solid;opacity:.25;transition:opacity .3s;}
.fc.on{opacity:1;}
.content{position:relative;z-index:1;padding:.9rem 1.3rem;min-height:275px;}
.shdr{display:flex;align-items:center;gap:.6rem;margin-bottom:.85rem;}
.sico{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem;border:1.5px solid var(--brd2);background:var(--card);}
.stitle{font-size:.95rem;font-weight:800;letter-spacing:-.02em;}
.ssub{font-family:'Inconsolata',monospace;font-size:.56rem;color:var(--muted);margin-top:.03rem;}
.chat{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.7rem;}
.msg{display:flex;gap:.4rem;align-items:flex-start;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;}
.msg.show{opacity:1;transform:translateY(0);}
.msg.r{flex-direction:row-reverse;}
.av{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;border:1px solid var(--brd2);background:var(--card);}
.bub{max-width:82%;padding:.48rem .68rem;border-radius:9px;font-size:.77rem;line-height:1.55;border:1px solid var(--brd2);background:var(--card);}
.bub.l{border-bottom-left-radius:2px;}.bub.r2{border-bottom-right-radius:2px;text-align:right;}
.who{font-family:'Inconsolata',monospace;font-size:.55rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.1rem;}
.ibox{border-radius:8px;padding:.55rem .75rem;font-size:.74rem;line-height:1.55;margin:.45rem 0;border:1px solid var(--brd2);background:var(--card);border-left:3px solid var(--forc);}
.ibox strong{font-weight:700;}
.ibox.ok{border-left-color:var(--code);}.ibox.ok strong{color:var(--code);}
.ibox.warn{border-left-color:var(--rev);}.ibox.warn strong{color:var(--rev);}
.cklist{display:flex;flex-direction:column;gap:.35rem;margin:.45rem 0;}
.cli{display:flex;align-items:flex-start;gap:.5rem;padding:.42rem .65rem;background:var(--card);border:1px solid var(--brd2);border-radius:8px;font-size:.75rem;line-height:1.45;}
.cli-i{flex-shrink:0;font-size:.88rem;}
.cli strong{display:block;font-weight:700;font-size:.76rem;margin-bottom:.03rem;}
.cli span{color:var(--muted);font-size:.68rem;font-family:'Inconsolata',monospace;}

/* ERŐK VISUAL */
.forces-vis{background:var(--card);border:1.5px solid var(--brd2);border-radius:11px;padding:.7rem;margin:.45rem 0;position:relative;}
.fv-title{font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem;text-align:center;}
.fv-center{padding:.6rem;border-radius:10px;background:var(--surf);text-align:center;border:2px solid var(--forc);margin:.4rem auto;max-width:60%;}
.fv-center-icon{font-size:1.4rem;}
.fv-center-name{font-family:'Inconsolata',monospace;font-size:.72rem;color:var(--forc);font-weight:700;margin-top:.15rem;}

/* FORCE CARDS */
.force-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin:.45rem 0;}
.force-card{padding:.6rem .65rem;border-radius:9px;border:1.5px solid;}
.fc-icon{font-size:1.2rem;margin-bottom:.2rem;}
.fc-name{font-size:.78rem;font-weight:800;margin-bottom:.1rem;}
.fc-list{font-family:'Inconsolata',monospace;font-size:.6rem;color:var(--muted);line-height:1.55;}

/* TASK CARDS */
.task-list{display:flex;flex-direction:column;gap:.35rem;margin:.45rem 0;}
.task-row{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--card);border:1.5px solid var(--brd2);border-radius:9px;border-left:3px solid;}
.task-num{font-family:'Inconsolata',monospace;font-size:.7rem;font-weight:800;flex-shrink:0;width:24px;}
.task-name{font-size:.74rem;font-weight:700;}
.task-desc{font-size:.65rem;color:var(--muted);font-family:'Inconsolata',monospace;margin-top:.1rem;}

/* DOC GRID */
.doc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.35rem;margin:.45rem 0;}
.doc-card{background:var(--card);border:1.5px solid;border-radius:9px;padding:.55rem .6rem;text-align:center;}
.doc-q{font-family:'Inconsolata',monospace;font-size:.7rem;font-weight:800;margin-bottom:.2rem;}
.doc-list{font-size:.6rem;line-height:1.55;color:var(--muted);font-family:'Inconsolata',monospace;text-align:left;}

/* CODE BLOCK */
.code{background:#0d1117;border:1px solid var(--brd2);border-radius:8px;padding:.6rem .75rem;margin:.35rem 0;font-family:'Inconsolata',monospace;font-size:.7rem;line-height:1.7;}
.cb-label{font-size:.5rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.25rem;}
.c-bad{background:rgba(239,68,68,.18);border-radius:3px;padding:0 2px;}
.c-good{background:rgba(16,185,129,.15);border-radius:3px;padding:0 2px;}

/* DECISION TABLE */
.dec-table{border-radius:9px;overflow:hidden;border:1.5px solid var(--brd2);margin:.45rem 0;}
.dt-hdr{display:grid;grid-template-columns:90px 1fr 1fr;background:var(--surf);padding:.32rem .65rem;gap:.5rem;font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--brd);}
.dt-row{display:grid;grid-template-columns:90px 1fr 1fr;padding:.38rem .65rem;gap:.5rem;border-bottom:1px solid var(--brd);font-size:.68rem;align-items:start;}
.dt-row:last-child{border-bottom:none;}
.dt-opt{font-weight:700;font-size:.71rem;}

/* SUMGRID */
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.45rem 0;}
.sbox{background:var(--card);border:1px solid var(--brd2);border-radius:8px;padding:.6rem;text-align:center;}
.sbox .ico{font-size:1.2rem;display:block;margin-bottom:.15rem;}
.sbox .val{font-size:.88rem;font-weight:800;}
.sbox .lbl{font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);margin-top:.04rem;}

.nav{position:sticky;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--brd2);padding:.7rem 1.3rem;display:flex;align-items:center;gap:.5rem;}
.btn{font-family:'Inconsolata',monospace;font-size:.63rem;font-weight:600;padding:.52rem 1rem;border-radius:7px;cursor:pointer;transition:all .18s;text-transform:uppercase;letter-spacing:.04em;}
.btnp{background:transparent;color:var(--muted);border:1px solid var(--brd2);}
.btnp:hover{color:var(--text);}
.btnp:disabled{opacity:.2;cursor:not-allowed;}
.btnn{flex:1;background:rgba(168,85,247,.12);color:var(--forc);border:1px solid rgba(168,85,247,.3);}
.btnn:hover{background:rgba(168,85,247,.22);}
.ctr{font-family:'Inconsolata',monospace;font-size:.57rem;color:var(--muted);white-space:nowrap;}
</style>
</head>
<body>
<header>
  <div class="hdr-row">
    <h1><span>Architektúra</span><br>Tervezése<br><em>&amp; Doku</em></h1>
    <div class="tag">Erők · Alternatívák · Dokumentáció</div>
  </div>
  <p>// Domain felbontás · Alternatívák · 4 erő · Dokumentáció · Kódolási szabályok</p>
</header>
<div class="topbar">
  <div class="tb-t">// témakörök</div>
  <div class="steps" id="steps"></div>
  <div class="force-chips" id="forceChips"></div>
</div>
<div class="content" id="content"></div>
<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 13</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>
<script>
const TOPICS=[
  {label:'Folyamat\n2 fázis',color:'var(--forc)',icon:'🔄'},
  {label:'Domain\nfelbontás',color:'var(--func)',icon:'🧩'},
  {label:'Alterna\ntívák',color:'var(--rev)',icon:'🎯'},
  {label:'4 erő\narch-ra',color:'var(--forc)',icon:'⚡'},
  {label:'Dokumen\ntáció',color:'var(--doc)',icon:'📚'},
  {label:'Kódolási\nszabályok',color:'var(--code)',icon:'📐'},
  {label:'Össze.',color:'var(--forc)',icon:'∑'},
];
const FORCES=[
  {label:'Funkcionális',color:'var(--func)'},
  {label:'Minőségi (NFR)',color:'var(--quality)'},
  {label:'Nem-technikai',color:'var(--nontech)'},
  {label:'Szabadság korlát',color:'var(--freedom)'},
];

const STEPS=[
  // 0. 2 FÁZIS
  {t:0,forces:[],render:()=>`
    <div class="shdr"><div class="sico">🔄</div>
      <div><div class="stitle">Az architektúra-tervezés 2 fázisa</div>
      <div class="ssub">// problématér → megoldástér</div></div>
    </div>
    <div class="chat">
      <div class="msg show"><div class="av">👨‍🏫</div><div class="bub l"><div class="who" style="color:var(--forc)">Oktató</div>
        Az architektúra-készítés két nagy fázisra osztható. Az első a probléma megértése — itt nem a megoldásra gondolunk. A második a megoldás kivitelezése.
      </div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:.4rem;align-items:center;margin:.45rem 0">
      <div style="padding:.7rem;border-radius:10px;background:rgba(245,158,11,.08);border:2px solid rgba(245,158,11,.4);text-align:center">
        <div style="font-size:1.4rem;margin-bottom:.2rem">🎯</div>
        <div style="font-family:'Inconsolata',monospace;font-size:.7rem;font-weight:800;color:var(--rev)">PROBLÉMATÉR</div>
        <div style="font-size:.62rem;color:var(--muted);margin-top:.15rem;font-family:'Inconsolata',monospace;line-height:1.5">"Mi a valódi feladat?"<br>Követelmények<br>Megkötések<br>Rizikók</div>
      </div>
      <div style="font-size:1.5rem;color:var(--muted)">→</div>
      <div style="padding:.7rem;border-radius:10px;background:rgba(16,185,129,.08);border:2px solid rgba(16,185,129,.4);text-align:center">
        <div style="font-size:1.4rem;margin-bottom:.2rem">💡</div>
        <div style="font-family:'Inconsolata',monospace;font-size:.7rem;font-weight:800;color:var(--code)">MEGOLDÁSTÉR</div>
        <div style="font-size:.62rem;color:var(--muted);margin-top:.15rem;font-family:'Inconsolata',monospace;line-height:1.5">"Hogyan oldjuk meg?"<br>Komponensek<br>Kapcsolatok<br>Technológiák</div>
      </div>
    </div>
    <div class="ibox warn"><strong>Gyakori hiba:</strong> A fejlesztők szeretik átugorni a problématért, mert a megoldás "izgalmasabb". De ha nem értetted meg pontosan a problémát, a "jó megoldás" sem segít. Először mindig: KÉRDEZZ!</div>
  `},

  // 1. DOMAIN FELBONTÁS
  {t:1,forces:[],render:()=>`
    <div class="shdr"><div class="sico" style="border-color:rgba(34,211,238,.5)">🧩</div>
      <div><div class="stitle">Domain felbontása részekre</div>
      <div class="ssub">// keressük a szakterületeket, szeparáljunk</div></div>
    </div>
    <div class="chat">
      <div class="msg show"><div class="av">👨‍🏫</div><div class="bub l"><div class="who" style="color:var(--func)">Oktató</div>
        A domain modell megalkotásakor először mindig bontsuk RÉSZEKRE a feladatot. Keressük a különböző szakterületeket — és próbáljunk azok szerint szeparálni.
      </div></div>
      <div class="msg show r" style="transition-delay:.15s"><div class="av">🙋</div><div class="bub r2"><div class="who" style="color:var(--quality);text-align:right">Tanuló</div>
        Hogyan ismerem fel a szakterületeket egy nagy rendszerben?
      </div></div>
      <div class="msg show" style="transition-delay:.3s"><div class="av">👨‍🏫</div><div class="bub l"><div class="who" style="color:var(--func)">Oktató</div>
        Példa: egy webshop. Megrendelés, fizetés, készletkezelés, marketing, ügyfélkapcsolat. Mindegyik más szakterület, más szakértő — más domain.
      </div></div>
    </div>
    <div style="background:var(--card);border:1.5px solid var(--brd2);border-radius:10px;padding:.7rem;margin:.45rem 0">
      <div style="font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.45rem;text-align:center">// Webshop domain felbontása</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.35rem">
        <div style="padding:.45rem;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.3);border-radius:7px">
          <div style="font-family:'Inconsolata',monospace;font-size:.62rem;font-weight:700;color:#a855f7;margin-bottom:.15rem">🛒 Megrendelés</div>
          <div style="font-size:.6rem;color:var(--muted);font-family:'Inconsolata',monospace">Cart, Order, Checkout</div>
        </div>
        <div style="padding:.45rem;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:7px">
          <div style="font-family:'Inconsolata',monospace;font-size:.62rem;font-weight:700;color:#f59e0b;margin-bottom:.15rem">💳 Fizetés</div>
          <div style="font-size:.6rem;color:var(--muted);font-family:'Inconsolata',monospace">Payment, Invoice, Refund</div>
        </div>
        <div style="padding:.45rem;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.3);border-radius:7px">
          <div style="font-family:'Inconsolata',monospace;font-size:.62rem;font-weight:700;color:#10b981;margin-bottom:.15rem">📦 Készletkezelés</div>
          <div style="font-size:.6rem;color:var(--muted);font-family:'Inconsolata',monospace">Product, Stock, Warehouse</div>
        </div>
        <div style="padding:.45rem;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.3);border-radius:7px">
          <div style="font-family:'Inconsolata',monospace;font-size:.62rem;font-weight:700;color:#3b82f6;margin-bottom:.15rem">👤 Ügyfél</div>
          <div style="font-size:.6rem;color:var(--muted);font-family:'Inconsolata',monospace">Customer, Account, Address</div>
        </div>
        <div style="padding:.45rem;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:7px">
          <div style="font-family:'Inconsolata',monospace;font-size:.62rem;font-weight:700;color:#ef4444;margin-bottom:.15rem">📧 Marketing</div>
          <div style="font-size:.6rem;color:var(--muted);font-family:'Inconsolata',monospace">Campaign, Email, Coupon</div>
        </div>
        <div style="padding:.45rem;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);border-radius:7px">
          <div style="font-family:'Inconsolata',monospace;font-size:.62rem;font-weight:700;color:#22d3ee;margin-bottom:.15rem">🚚 Szállítás</div>
          <div style="font-size:.6rem;color:var(--muted);font-family:'Inconsolata',monospace">Shipping, Tracking, Carrier</div>
        </div>
      </div>
    </div>
    <div class="ibox ok"><strong>Tipp a házi feladathoz:</strong> A példákon keresztül a legegyszerűbb az entitások, értékelemek és szolgáltatások megtalálása. NEMZETKÖZI környezetben is legyen használható — pl. egy webshop ne csak Magyarországra korlátozódjon (devizák, nyelvek, jogi keretek).</div>
  `},

  // 2. NE TALÁLD FEL ÚJRA A KEREKET
  {t:2,forces:[],render:()=>`
    <div class="shdr"><div class="sico">🛞</div>
      <div><div class="stitle">Ne találd fel újra a kereket — de szabd a feladatra</div>
      <div class="ssub">// bevált minták + apró módosítások = innováció</div></div>
    </div>
    <div class="chat">
      <div class="msg show"><div class="av">👨‍🏫</div><div class="bub l"><div class="who" style="color:var(--forc)">Oktató</div>
        Az új dolgok kitalálása dicsőség — DE mindig nagy rizikót is tartalmaz. Amit már kipróbáltunk, arról sokkal több információnk van.
      </div></div>
      <div class="msg show r" style="transition-delay:.15s"><div class="av">💡</div><div class="bub r2"><div class="who" style="color:var(--code);text-align:right">Architect</div>
        Ezért: használjuk a bevált mintákat — de nézzük meg, milyen apró változtatással szabhatóak a saját feladatra. EZ IS innováció!
      </div></div>
    </div>
    <div class="cklist">
      <div class="cli" style="border-left:3px solid var(--code)">
        <div class="cli-i">✅</div>
        <div><strong>Bevált tervezési minták</strong>
        <span>Pl. Gang of Four (GoF) tervezési minták — Singleton, Factory, Observer. Évtizedek óta működnek. Olyan problémákat oldanak meg, amikkel mindenki találkozik.</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--code)">
        <div class="cli-i">🏗️</div>
        <div><strong>Architektúrális minták</strong>
        <span>MVC, MVVM, Microservices, Event-Driven, CQRS, Onion. Mindegyik egy konkrét problémára adott bevált válasz. Ha a problémád illik — használd!</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--rev)">
        <div class="cli-i">🎨</div>
        <div><strong>De ne másolj vakon!</strong>
        <span>Minden projekt más. A "best practice" csak egy kiindulási pont. Vizsgáld meg: pontosan ILLIK ide? Hol kell módosítani? Mit kell elhagyni?</span></div>
      </div>
    </div>
    <div class="ibox"><strong>"Olcsón, jól, gyorsan dolgozunk — de csak kettőt választhatsz." </strong>Sokat segít a jó minőség elérésében, ha már bevált módszereket alkalmazunk. Ami másnak már működött — nálunk is be fog. Csökkentett kockázat = jobb minőség.</div>
  `},

  // 3. TÖBB MEGOLDÁS — RUBIK

function renderBoard(tIdx,forceIdxs){
  document.getElementById('steps').innerHTML=TOPICS.map((t,i)=>{
    const on=i===tIdx,done=i<tIdx;
    const c=on?t.color:done?t.color:'var(--muted)';
    return `<div class="st ${on?'active':done?'done':''}">
      <div class="sd" style="border-color:${c};color:${c}">${t.icon}</div>
      <div class="sl" style="color:${on?t.color:'var(--muted)'}">${t.label.replace('\n','<br>')}</div>
    </div>`;
  }).join('');
  document.getElementById('forceChips').innerHTML=FORCES.map((f,i)=>{
    const on=forceIdxs.includes(i);
    return `<div class="fc ${on?'on':''}" style="border-color:${f.color};color:${f.color}">${f.label}</div>`;
  }).join('');
}

let cur=0;
function render(){
  const s=STEPS[cur];
  renderBoard(s.t,s.forces);
  const el=document.getElementById('content');
  el.innerHTML=s.render();
  setTimeout(()=>{el.querySelectorAll('.msg:not(.show)').forEach((m,i)=>setTimeout(()=>m.classList.add('show'),i*160));},60);
  document.getElementById('bprev').disabled=cur===0;
  document.getElementById('bnext').textContent=cur===STEPS.length-1?'↺ Újra':'Következő →';
  document.getElementById('ctr').textContent=`${cur+1} / ${STEPS.length}`;
}
function next(){cur=cur===STEPS.length-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
