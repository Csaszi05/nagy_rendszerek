<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDD, Onion Architektúra és CQRS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');
:root {
  --bg:#0a0f1e; --surf:#0f1628; --card:#141d35; --brd:#1e2d50; --brd2:#263a68;
  --text:#d8e4ff; --muted:#4a5f8a;
  --onion:#f97316; --layered:#ef4444;
  --domain:#10b981; --dservice:#f59e0b; --aservice:#a855f7; --ui:#3b82f6; --infra:#6b7280; --test:#22d3ee;
  --crud:#ef4444; --cqrs:#10b981; --cmd:#f59e0b; --query:#3b82f6;
  --acc:#f97316;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(16,185,129,.04) 0%,transparent 50%);pointer-events:none;z-index:0;}
header{position:relative;z-index:1;padding:1.2rem 1.3rem .85rem;border-bottom:1px solid var(--brd2);background:linear-gradient(180deg,rgba(249,115,22,.06) 0%,transparent 100%);}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;}
h1{font-size:1.4rem;font-weight:800;line-height:1.07;letter-spacing:-.02em;}
h1 span{color:var(--onion);}h1 em{font-style:normal;color:var(--cqrs);}
.tag{font-family:'Inconsolata',monospace;font-size:.56rem;padding:.25rem .55rem;border-radius:4px;background:rgba(249,115,22,.12);color:var(--onion);border:1px solid rgba(249,115,22,.28);white-space:nowrap;margin-top:.2rem;}
header p{font-size:.7rem;color:var(--muted);margin-top:.25rem;font-family:'Inconsolata',monospace;}
.topbar{position:relative;z-index:1;background:var(--surf);border-bottom:1px solid var(--brd2);padding:.75rem 1.3rem .65rem;}
.tb-t{font-family:'Inconsolata',monospace;font-size:.54rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:.5rem;}
.steps{display:flex;align-items:center;gap:0;margin-bottom:.45rem;}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:.18rem;position:relative;}
.st:not(:last-child)::after{content:'';position:absolute;right:0;top:12px;width:50%;height:2px;background:var(--brd);z-index:0;}
.st:not(:first-child)::before{content:'';position:absolute;left:0;top:12px;width:50%;height:2px;background:var(--brd);z-index:0;}
.sd{width:24px;height:24px;border-radius:50%;border:2px solid var(--brd2);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.6rem;z-index:1;transition:all .35s;position:relative;}
.sl{font-family:'Inconsolata',monospace;font-size:.44rem;color:var(--muted);text-align:center;line-height:1.2;}
.st.active .sd{transform:scale(1.25);box-shadow:0 0 10px currentColor;}
.st.done .sd{opacity:.55;}
.st.active .sl{font-weight:700;}
.layer-chips{display:flex;gap:4px;flex-wrap:wrap;}
.lc{font-family:'Inconsolata',monospace;font-size:.52rem;font-weight:700;padding:.14rem .4rem;border-radius:3px;border:1px solid;opacity:.25;transition:opacity .3s;}
.lc.on{opacity:1;}
.content{position:relative;z-index:1;padding:.9rem 1.3rem;min-height:275px;}
.shdr{display:flex;align-items:center;gap:.6rem;margin-bottom:.85rem;}
.sico{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem;border:1.5px solid var(--brd2);background:var(--card);}
.stitle{font-size:.95rem;font-weight:800;letter-spacing:-.02em;}
.ssub{font-family:'Inconsolata',monospace;font-size:.56rem;color:var(--muted);margin-top:.03rem;}
.chat{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.7rem;}
.msg{display:flex;gap:.4rem;align-items:flex-start;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;}
.msg.show{opacity:1;transform:translateY(0);}
.msg.r{flex-direction:row-reverse;}
.av{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;border:1px solid var(--brd2);background:var(--card);}
.bub{max-width:82%;padding:.48rem .68rem;border-radius:9px;font-size:.77rem;line-height:1.55;border:1px solid var(--brd2);background:var(--card);}
.bub.l{border-bottom-left-radius:2px;}.bub.r2{border-bottom-right-radius:2px;text-align:right;}
.who{font-family:'Inconsolata',monospace;font-size:.55rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.1rem;}
.ibox{border-radius:8px;padding:.55rem .75rem;font-size:.74rem;line-height:1.55;margin:.45rem 0;border:1px solid var(--brd2);background:var(--card);border-left:3px solid var(--onion);}
.ibox strong{font-weight:700;}
.ibox.dom{border-left-color:var(--domain);}.ibox.dom strong{color:var(--domain);}
.ibox.warn{border-left-color:var(--crud);}.ibox.warn strong{color:var(--crud);}

.cklist{display:flex;flex-direction:column;gap:.35rem;margin:.45rem 0;}
.cli{display:flex;align-items:flex-start;gap:.5rem;padding:.42rem .65rem;background:var(--card);border:1px solid var(--brd2);border-radius:8px;font-size:.75rem;line-height:1.45;}
.cli-i{flex-shrink:0;font-size:.88rem;}
.cli strong{display:block;font-weight:700;font-size:.76rem;margin-bottom:.03rem;}
.cli span{color:var(--muted);font-size:.68rem;font-family:'Inconsolata',monospace;}

/* ONION VISUAL */
.onion-vis{background:var(--card);border:1.5px solid var(--brd2);border-radius:11px;padding:1.2rem .7rem;margin:.45rem 0;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.onion-layer{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Inconsolata',monospace;font-weight:700;text-align:center;}
.ol-test{width:230px;height:230px;border:2px solid var(--test);background:rgba(34,211,238,.04);position:relative;}
.ol-ui{width:200px;height:200px;border:2px solid var(--ui);background:rgba(59,130,246,.06);position:absolute;top:15px;left:15px;}
.ol-infra{width:200px;height:200px;border:2px solid var(--infra);background:rgba(107,114,128,.06);position:absolute;top:15px;right:15px;}
.ol-aservice{width:170px;height:170px;border:2px solid var(--aservice);background:rgba(168,85,247,.06);position:absolute;top:30px;left:30px;}
.ol-dservice{width:130px;height:130px;border:2px solid var(--dservice);background:rgba(245,158,11,.06);position:absolute;top:50px;left:50px;}
.ol-domain{width:80px;height:80px;border:2px solid var(--domain);background:rgba(16,185,129,.1);position:absolute;top:75px;left:75px;font-size:.65rem;color:var(--domain);}

/* SIMPLE ONION */
.onion-simple{display:flex;flex-direction:column;align-items:center;gap:.3rem;margin:.45rem 0;padding:.5rem;background:var(--card);border:1.5px solid var(--brd2);border-radius:10px;}
.os-layer{padding:.4rem 1rem;border-radius:25px;border:1.5px solid;text-align:center;font-family:'Inconsolata',monospace;font-weight:700;width:100%;max-width:340px;display:flex;align-items:center;justify-content:center;gap:.4rem;}
.os-label{font-size:.6rem;}
.os-desc{font-size:.55rem;color:var(--muted);font-weight:400;}

/* LAYERED PROBLEM */
.layered-vis{display:flex;flex-direction:column;gap:0;margin:.45rem 0;border:1.5px solid rgba(239,68,68,.3);border-radius:10px;overflow:hidden;}
.lv-row{padding:.5rem .65rem;border-bottom:1px solid var(--brd);font-family:'Inconsolata',monospace;font-size:.65rem;font-weight:700;display:flex;align-items:center;gap:.5rem;}
.lv-row:last-child{border-bottom:none;}

/* CODE BLOCK */
.code{background:#0d1117;border:1px solid var(--brd2);border-radius:8px;padding:.6rem .75rem;margin:.35rem 0;font-family:'Inconsolata',monospace;font-size:.66rem;line-height:1.7;overflow-x:auto;}
.cb-label{font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.25rem;}
.c-kw{color:#ff7b72;}.c-fn{color:#d2a8ff;}.c-str{color:#a5d6ff;}.c-var{color:#ffa657;}.c-cmt{color:#8b949e;font-style:italic;}.c-good{background:rgba(16,185,129,.15);border-radius:3px;padding:0 2px;}.c-bad{background:rgba(239,68,68,.15);border-radius:3px;padding:0 2px;}

/* COMPARE */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.45rem 0;}

/* CQRS FLOW */
.cqrs-flow{background:var(--card);border:1.5px solid var(--brd2);border-radius:10px;padding:.7rem;margin:.45rem 0;}
.cq-title{font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.45rem;text-align:center;}
.cq-row{display:flex;align-items:center;gap:.35rem;margin:.3rem 0;font-size:.66rem;flex-wrap:wrap;}
.cq-box{padding:.3rem .5rem;border-radius:6px;border:1.5px solid;font-family:'Inconsolata',monospace;font-size:.6rem;font-weight:700;}
.cq-arr{color:var(--muted);font-size:.7rem;}

/* SUMGRID */
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.45rem 0;}
.sbox{background:var(--card);border:1px solid var(--brd2);border-radius:8px;padding:.6rem;text-align:center;}
.sbox .ico{font-size:1.2rem;display:block;margin-bottom:.15rem;}
.sbox .val{font-size:.88rem;font-weight:800;}
.sbox .lbl{font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);margin-top:.04rem;}

/* VO/ENTITY */
.entity-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.45rem 0;}
.entity-card{padding:.65rem .75rem;border-radius:9px;border:1.5px solid;}
.ec-name{font-family:'Inconsolata',monospace;font-size:.62rem;font-weight:700;margin-bottom:.2rem;}
.ec-desc{font-size:.68rem;line-height:1.5;color:rgba(216,228,255,.82);margin-bottom:.35rem;}

.nav{position:sticky;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--brd2);padding:.7rem 1.3rem;display:flex;align-items:center;gap:.5rem;}
.btn{font-family:'Inconsolata',monospace;font-size:.63rem;font-weight:600;padding:.52rem 1rem;border-radius:7px;cursor:pointer;transition:all .18s;text-transform:uppercase;letter-spacing:.04em;}
.btnp{background:transparent;color:var(--muted);border:1px solid var(--brd2);}
.btnp:hover{color:var(--text);}
.btnp:disabled{opacity:.2;cursor:not-allowed;}
.btnn{flex:1;background:rgba(249,115,22,.12);color:var(--onion);border:1px solid rgba(249,115,22,.3);}
.btnn:hover{background:rgba(249,115,22,.22);}
.ctr{font-family:'Inconsolata',monospace;font-size:.57rem;color:var(--muted);white-space:nowrap;}
</style>
</head>
<body>
<header>
  <div class="hdr-row">
    <h1><span>DDD</span> &amp;<br>Onion arch.<br>&amp; <em>CQRS</em></h1>
    <div class="tag">Eric Evans · Martin Fowler</div>
  </div>
  <p>// Domain-Driven Design · Hagyma architektúra · CRUD vs CQRS</p>
</header>
<div class="topbar">
  <div class="tb-t">// témakörök</div>
  <div class="steps" id="steps"></div>
  <div class="layer-chips" id="layerChips"></div>
</div>
<div class="content" id="content"></div>
<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 14</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>
<script>
const TOPICS=[
  {label:'Rétegelt\nproblémái',color:'var(--layered)',icon:'🥞'},
  {label:'Onion\narch.',color:'var(--onion)',icon:'🧅'},
  {label:'Rétegek\nrészletei',color:'var(--domain)',icon:'🎯'},
  {label:'DDD\nEric Evans',color:'var(--aservice)',icon:'📐'},
  {label:'CRUD\nproblémái',color:'var(--crud)',icon:'❌'},
  {label:'CQRS\nmegoldás',color:'var(--cqrs)',icon:'✅'},
  {label:'Össze.',color:'var(--onion)',icon:'∑'},
];
const LAYERS=[
  {label:'Domain',color:'var(--domain)'},
  {label:'Domain Service',color:'var(--dservice)'},
  {label:'App Service',color:'var(--aservice)'},
  {label:'UI',color:'var(--ui)'},
  {label:'Infrastructure',color:'var(--infra)'},
  {label:'Tests',color:'var(--test)'},
];

const STEPS=[
  // 0. RÉTEGELT ARCHITEKTÚRA PROBLÉMÁI
  {t:0,layers:[],render:()=>`
    <div class="shdr"><div class="sico" style="border-color:rgba(239,68,68,.5)">🥞</div>
      <div><div class="stitle">Klasszikus rétegelt architektúra problémái</div>
      <div class="ssub">// minden réteg függ az alatta lévőtől → ki kell rugalmasan</div></div>
    </div>
    <div class="layered-vis">
      <div class="lv-row" style="background:rgba(59,130,246,.08);color:var(--ui)">📱 Presentation Layer (UI)</div>
      <div class="lv-row" style="background:rgba(168,85,247,.08);color:var(--aservice)">⚙️ Business Logic Layer</div>
      <div class="lv-row" style="background:rgba(245,158,11,.08);color:var(--dservice)">💾 Data Access Layer</div>
      <div class="lv-row" style="background:rgba(107,114,128,.1);color:var(--infra)">🗄️ Database / Infrastructure</div>
    </div>
    <div style="text-align:center;font-family:'Inconsolata',monospace;font-size:.62rem;color:var(--layered);margin:.4rem 0">↓ ↓ ↓ minden réteg az alatta lévőtől függ ↓ ↓ ↓</div>
    <div class="cklist">
      <div class="cli" style="border-left:3px solid var(--layered)">
        <div class="cli-i">🔗</div>
        <div><strong>Erős függőség lefelé</strong>
        <span>A Business Logic közvetlenül használja a Data Access-t, ami közvetlenül használja az adatbázist. Ha bármi változik lent → minden megdől felette.</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--layered)">
        <div class="cli-i">🧪</div>
        <div><strong>Nehéz tesztelhetőség</strong>
        <span>Hogyan teszteled a Business Logic-ot adatbázis nélkül? Nehezen — minden a teljes stack-re épül.</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--layered)">
        <div class="cli-i">🔄</div>
        <div><strong>Infrastruktúra-csere katasztrófa</strong>
        <span>Cserélnéd a MySQL-t PostgreSQL-re? Minden Data Access kód módosul → minden Business Logic módosul → minden UI módosul. Több hónap munka.</span></div>
      </div>
    </div>
    <div class="ibox warn"><strong>A fő probléma:</strong> A klasszikus rétegelt architektúra a Database-t és infrastruktúrát teszi a "központba". Minden réteg függ az infrastruktúrától — ha ott valami változik, az az egész alkalmazásra jelentős kihatással jár.</div>
  `},

  // 1. ONION ARCHITEKTÚRA BEVEZETŐ
  {t:1,layers:[0,1,2,3,4,5],render:()=>`
    <div class="shdr"><div class="sico" style="border-color:rgba(249,115,22,.5)">🧅</div>
      <div><div class="stitle">Onion (hagyma) architektúra — megfordított függőség</div>
      <div class="ssub">// Jeffrey Palermo, 2008 — a domain modell a központban</div></div>
    </div>
    <div class="chat">
      <div class="msg show"><div class="av">👨‍🏫</div><div class="bub l"><div class="who" style="color:var(--onion)">Oktató</div>
        Az Onion architektúra MEGFORDÍTJA a függőségeket. A DOMAIN modell a központban — minden más KÖRÜLÖTTE veszi körbe, mint a hagyma rétegei. A belső réteg NEM TUDHAT a külsőkről.
      </div></div>
    </div>
    <div class="onion-simple">
      <div class="os-layer" style="background:rgba(34,211,238,.06);color:var(--test);border-color:rgba(34,211,238,.4);max-width:100%">
        <span class="os-label">🧪 Tests</span><span class="os-desc">— minden réteget tesztel</span>
      </div>
      <div class="os-layer" style="background:rgba(59,130,246,.06);color:var(--ui);border-color:rgba(59,130,246,.4);max-width:90%">
        <span class="os-label">📱 UI</span><span class="os-desc">— Web, Mobile, Desktop</span>
      </div>
      <div class="os-layer" style="background:rgba(107,114,128,.08);color:var(--infra);border-color:rgba(107,114,128,.4);max-width:80%">
        <span class="os-label">🗄️ Infrastructure</span><span class="os-desc">— DB, Email, External</span>
      </div>
      <div class="os-layer" style="background:rgba(168,85,247,.07);color:var(--aservice);border-color:rgba(168,85,247,.4);max-width:70%">
        <span class="os-label">⚙️ App Services</span><span class="os-desc">— use case-ek</span>
      </div>
      <div class="os-layer" style="background:rgba(245,158,11,.07);color:var(--dservice);border-color:rgba(245,158,11,.4);max-width:60%">
        <span class="os-label">💼 Domain Services</span><span class="os-desc">— folyamatok</span>
      </div>
      <div class="os-layer" style="background:rgba(16,185,129,.12);color:var(--domain);border-color:rgba(16,185,129,.5);max-width:50%">
        <span class="os-label">🎯 DOMAIN MODEL</span><span class="os-desc">— a mag</span>
      </div>
    </div>
    <div class="ibox dom"><strong>Az aranyszabály:</strong> A belső réteg NEM HIVATKOZHAT a kívül levőkre — azokról semmit nem tudhat. Így bármely külső réteg megváltoztatható, lecserélhető anélkül, hogy a belső rétegeket módosítani kellene.</div>
  `},

  // 2. DOMAIN MODEL — A KÖZPONT
  {t:2,layers:[0],render:()=>`
    <div class="shdr"><div class="sico" style="border-color:rgba(16,185,129,.5)">🎯</div>
      <div><div class="stitle">A Domain Model — a rendszer magja</div>
      <div class="ssub">// szakterületi alapfogalmak — entitások</div></div>
    </div>
    <div style="background:rgba(16,185,129,.06);border:2px solid rgba(16,185,129,.35);border-radius:11px;padding:.85rem 1rem;margin:.45rem 0">
      <div style="font-family:'Inconsolata',monospace;font-size:.58rem;color:var(--domain);font-weight:700;margin-bottom:.2rem">🎯 DOMAIN MODEL — Belső réteg</div>
      <div style="font-size:.78rem;line-height:1.6">A rendszer MAGJA. Itt találhatók a szakterület alapvető koncepcióit, fogalmait leíró <strong>entitások</strong>. Nem tud semmit az infrastruktúráról, UI-ról, alkalmazás-folyamatokról.</div>
    </div>
    <div class="code">
      <div class="cb-label">// Példa Domain Entity — bankrendszer</div>
      <span class="c-kw">class</span> <span class="c-fn">Account</span> {<br>
      &nbsp;&nbsp;<span class="c-kw">private</span> Money <span class="c-var">balance</span>;<br>
      &nbsp;&nbsp;<span class="c-kw">private</span> AccountId <span class="c-var">id</span>;<br>
      <br>
      &nbsp;&nbsp;<span class="c-cmt">// Üzleti szabály — tisztán a domainben</span><br>
      &nbsp;&nbsp;<span class="c-kw">public void</span> <span class="c-fn">withdraw</span>(Money amount) {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;<span class="c-kw">if</span> (balance.<span class="c-fn">isLessThan</span>(amount))<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="c-kw">throw new</span> InsufficientFundsException();<br>
      &nbsp;&nbsp;&nbsp;&nbsp;balance = balance.<span class="c-fn">subtract</span>(amount);<br>
      &nbsp;&nbsp;}<br>
      }
    </div>
    <div class="cklist">
      <div class="cli" style="border-left:3px solid var(--domain)">
        <div class="cli-i">📦</div>
        <div><strong>Tiszta üzleti logika</strong>
        <span>NINCS itt SQL, HTTP, JSON, fájlrendszer. Csak az üzleti szabályok. Az Account.withdraw() metódus ugyanaz lenne, ha kézzel papírral számolnánk.</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--domain)">
        <div class="cli-i">🚫</div>
        <div><strong>Semmilyen külső függőség</strong>
        <span>Nincs import az adatbázisból, frameworkokból. A domain réteg "tiszta" — bárhol futtatható, bármikor tesztelhető.</span></div>
      </div>
    </div>
  `},

  // 3. VALUE OBJECT VS ENTITY
  {t:2,layers:[0],render:()=>`
    <div class="shdr"><div class="sico" style="border-color:rgba(16,185,129,.5)">🧩</div>
      <div><div class="stitle">Value Object vs Entity</div>
      <div class="ssub">// a Domain Model két alapvető építőeleme</div></div>
    </div>
    <div class="entity-grid">
      <div class="entity-card" style="background:rgba(16,185,129,.06);border-color:rgba(16,185,129,.35)">
        <div class="ec-name" style="color:var(--domain)">🆔 Entity</div>
        <div class="ec-desc">Egyedi azonosítóval rendelkezik. Az állapota változhat, de az azonossága megmarad.</div>
        <div class="code" style="margin:.2rem 0">

function renderBoard(tIdx,layerIdxs){
  document.getElementById('steps').innerHTML=TOPICS.map((t,i)=>{
    const on=i===tIdx,done=i<tIdx;
    const c=on?t.color:done?t.color:'var(--muted)';
    return `<div class="st ${on?'active':done?'done':''}">
      <div class="sd" style="border-color:${c};color:${c}">${t.icon}</div>
      <div class="sl" style="color:${on?t.color:'var(--muted)'}">${t.label.replace('\n','<br>')}</div>
    </div>`;
  }).join('');
  document.getElementById('layerChips').innerHTML=LAYERS.map((l,i)=>{
    const on=layerIdxs.includes(i);
    return `<div class="lc ${on?'on':''}" style="border-color:${l.color};color:${l.color}">${l.label}</div>`;
  }).join('');
}

let cur=0;
function render(){
  const s=STEPS[cur];
  renderBoard(s.t,s.layers);
  const el=document.getElementById('content');
  el.innerHTML=s.render();
  setTimeout(()=>{el.querySelectorAll('.msg:not(.show)').forEach((m,i)=>setTimeout(()=>m.classList.add('show'),i*160));},60);
  document.getElementById('bprev').disabled=cur===0;
  document.getElementById('bnext').textContent=cur===STEPS.length-1?'↺ Újra':'Következő →';
  document.getElementById('ctr').textContent=`${cur+1} / ${STEPS.length}`;
}
function next(){cur=cur===STEPS.length-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
