<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFe — Scaled Agile Framework</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');
:root {
  --bg:#0a0f1e; --surf:#0f1628; --card:#141d35; --brd:#1e2d50; --brd2:#263a68;
  --text:#d8e4ff; --muted:#4a5f8a;
  --port:#a855f7; --ess:#3b82f6; --team:#10b981;
  --ce:#f59e0b; --ci:#6366f1; --cd:#22d3ee;
  --pi:#ef4444; --acc:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(59,130,246,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(168,85,247,.04) 0%,transparent 50%);pointer-events:none;z-index:0;}
header{position:relative;z-index:1;padding:1.2rem 1.3rem .85rem;border-bottom:1px solid var(--brd2);background:linear-gradient(180deg,rgba(59,130,246,.06) 0%,transparent 100%);}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;}
h1{font-size:1.4rem;font-weight:800;line-height:1.07;letter-spacing:-.02em;}
h1 span{color:var(--acc);}h1 em{font-style:normal;color:var(--port);}
.tag{font-family:'Inconsolata',monospace;font-size:.56rem;padding:.25rem .55rem;border-radius:4px;background:rgba(59,130,246,.12);color:var(--acc);border:1px solid rgba(59,130,246,.28);white-space:nowrap;margin-top:.2rem;}
header p{font-size:.7rem;color:var(--muted);margin-top:.25rem;font-family:'Inconsolata',monospace;}
/* TOPBAR */
.topbar{position:relative;z-index:1;background:var(--surf);border-bottom:1px solid var(--brd2);padding:.75rem 1.3rem .65rem;}
.tb-t{font-family:'Inconsolata',monospace;font-size:.54rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:.5rem;}
.level-bar{display:flex;gap:.35rem;margin-bottom:.45rem;}
.lv-btn{flex:1;padding:.35rem .4rem;border-radius:6px;border:1.5px solid;font-family:'Inconsolata',monospace;font-size:.56rem;font-weight:700;text-align:center;opacity:.3;transition:opacity .3s;}
.lv-btn.on{opacity:1;}
.role-chips{display:flex;gap:4px;flex-wrap:wrap;}
.rc{font-family:'Inconsolata',monospace;font-size:.52rem;font-weight:600;padding:.14rem .4rem;border-radius:3px;border:1px solid;opacity:.25;transition:opacity .3s;}
.rc.on{opacity:1;}
/* CONTENT */
.content{position:relative;z-index:1;padding:.9rem 1.3rem;min-height:275px;}
.shdr{display:flex;align-items:center;gap:.6rem;margin-bottom:.85rem;}
.sico{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem;border:1.5px solid var(--brd2);background:var(--card);}
.stitle{font-size:.95rem;font-weight:800;letter-spacing:-.02em;}
.ssub{font-family:'Inconsolata',monospace;font-size:.56rem;color:var(--muted);margin-top:.03rem;}
/* CHAT */
.chat{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.7rem;}
.msg{display:flex;gap:.4rem;align-items:flex-start;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;}
.msg.show{opacity:1;transform:translateY(0);}
.msg.r{flex-direction:row-reverse;}
.av{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;border:1px solid var(--brd2);background:var(--card);}
.bub{max-width:82%;padding:.48rem .68rem;border-radius:9px;font-size:.77rem;line-height:1.55;border:1px solid var(--brd2);background:var(--card);}
.bub.l{border-bottom-left-radius:2px;}.bub.r2{border-bottom-right-radius:2px;text-align:right;}
.who{font-family:'Inconsolata',monospace;font-size:.55rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.1rem;}
/* IBOX */
.ibox{border-radius:8px;padding:.55rem .75rem;font-size:.74rem;line-height:1.55;margin:.45rem 0;border:1px solid var(--brd2);background:var(--card);border-left:3px solid var(--acc);}
.ibox strong{font-weight:700;}
.ibox.p{border-left-color:var(--port);}.ibox.p strong{color:var(--port);}
.ibox.ok{border-left-color:var(--team);}.ibox.ok strong{color:var(--team);}
/* CHECKLIST */
.cklist{display:flex;flex-direction:column;gap:.35rem;margin:.45rem 0;}
.cli{display:flex;align-items:flex-start;gap:.5rem;padding:.42rem .65rem;background:var(--card);border:1px solid var(--brd2);border-radius:8px;font-size:.75rem;line-height:1.45;}
.cli-i{flex-shrink:0;font-size:.88rem;}
.cli strong{display:block;font-weight:700;font-size:.76rem;margin-bottom:.03rem;}
.cli span{color:var(--muted);font-size:.68rem;font-family:'Inconsolata',monospace;}
/* LEVEL CARD */
.level-card{border-radius:11px;padding:.85rem 1rem;margin-bottom:.5rem;border:2px solid;}
.lc-hdr{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem;}
.lc-icon{font-size:1.8rem;}
.lc-badge{font-family:'Inconsolata',monospace;font-size:.57rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.15rem;opacity:.8;}
.lc-name{font-size:.95rem;font-weight:800;letter-spacing:-.02em;}
.lc-desc{font-size:.74rem;line-height:1.6;color:rgba(216,228,255,.85);}
.lc-roles{margin-top:.4rem;display:flex;flex-direction:column;gap:.15rem;}
.lc-role{font-size:.7rem;color:rgba(200,215,255,.75);font-family:'Inconsolata',monospace;}
.lc-role::before{content:'▸ ';opacity:.6;}
/* ROLE CARD */
.role-card{border-radius:9px;padding:.65rem .8rem;margin:.3rem 0;border:1px solid var(--brd2);background:var(--card);display:flex;gap:.5rem;align-items:flex-start;}
.ri-badge{font-family:'Inconsolata',monospace;font-size:.54rem;padding:.12rem .42rem;border-radius:4px;border:1px solid;font-weight:700;flex-shrink:0;margin-top:.05rem;}
.ri-name{font-size:.78rem;font-weight:800;margin-bottom:.06rem;}
.ri-desc{font-size:.68rem;color:var(--muted);line-height:1.45;font-family:'Inconsolata',monospace;}
/* TRAIN VIS */
.train-vis{background:var(--card);border:1.5px solid var(--brd2);border-radius:9px;padding:.65rem .75rem;margin:.45rem 0;font-family:'Inconsolata',monospace;font-size:.68rem;}
.tv-title{font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem;}
.tv-track{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:.2rem;}
.tv-wagon{flex-shrink:0;padding:.3rem .5rem;border:1.5px solid;border-radius:6px;text-align:center;font-size:.58rem;font-weight:700;margin-right:3px;}
.tv-arr{color:var(--muted);font-size:.9rem;flex-shrink:0;}
/* PI TIMELINE */
.pi-timeline{background:var(--card);border:1.5px solid var(--brd2);border-radius:9px;overflow:hidden;margin:.45rem 0;}
.pt-hdr{background:var(--surf);padding:.3rem .7rem;font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--brd);}
.pt-row{display:flex;align-items:center;padding:.38rem .7rem;border-bottom:1px solid var(--brd);gap:.5rem;font-size:.7rem;}
.pt-row:last-child{border-bottom:none;}
.pt-label{font-family:'Inconsolata',monospace;font-size:.6rem;font-weight:700;width:80px;flex-shrink:0;}
.pt-desc{flex:1;color:rgba(216,228,255,.82);}
.pt-dur{font-family:'Inconsolata',monospace;font-size:.56rem;color:var(--muted);}
/* CE/CI/CD */
.ccd-grid{display:grid;grid-template-columns:1fr;gap:.35rem;margin:.45rem 0;}
.ccd-card{border-radius:9px;padding:.65rem .75rem;border:1.5px solid;}
.ccd-hdr{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem;}
.ccd-badge{font-family:'Inconsolata',monospace;font-size:.65rem;font-weight:800;padding:.15rem .5rem;border-radius:5px;border:1px solid;flex-shrink:0;}
.ccd-name{font-size:.85rem;font-weight:800;}
.ccd-desc{font-size:.73rem;line-height:1.55;color:rgba(216,228,255,.82);}
/* BACKLOG LEVELS */
.backlog-vis{display:flex;flex-direction:column;gap:.3rem;margin:.45rem 0;}
.bl-row{display:flex;align-items:center;gap:.4rem;padding:.38rem .65rem;background:var(--card);border-radius:7px;border:1px solid var(--brd2);}
.bl-level{font-family:'Inconsolata',monospace;font-size:.58rem;font-weight:700;width:90px;flex-shrink:0;}
.bl-item{font-size:.7rem;flex:1;}
.bl-owner{font-family:'Inconsolata',monospace;font-size:.55rem;color:var(--muted);}
/* SUMGRID */
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.45rem 0;}
.sbox{background:var(--card);border:1px solid var(--brd2);border-radius:8px;padding:.6rem;text-align:center;}
.sbox .ico{font-size:1.2rem;display:block;margin-bottom:.15rem;}
.sbox .val{font-size:.88rem;font-weight:800;}
.sbox .lbl{font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);margin-top:.04rem;}
/* NAV */
.nav{position:sticky;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--brd2);padding:.7rem 1.3rem;display:flex;align-items:center;gap:.5rem;}
.btn{font-family:'Inconsolata',monospace;font-size:.63rem;font-weight:600;padding:.52rem 1rem;border-radius:7px;cursor:pointer;transition:all .18s;text-transform:uppercase;letter-spacing:.04em;}
.btnp{background:transparent;color:var(--muted);border:1px solid var(--brd2);}
.btnp:hover{color:var(--text);}
.btnp:disabled{opacity:.2;cursor:not-allowed;}
.btnn{flex:1;background:rgba(59,130,246,.12);color:var(--acc);border:1px solid rgba(59,130,246,.3);}
.btnn:hover{background:rgba(59,130,246,.22);}
.ctr{font-family:'Inconsolata',monospace;font-size:.57rem;color:var(--muted);white-space:nowrap;}
</style>
</head>
<body>
<header>
  <div class="hdr-row">
    <h1><span>SAFe</span><br>Scaled<br><em>Agile</em></h1>
    <div class="tag">Scaled Agile Framework</div>
  </div>
  <p>// Portfolió · Essential · Team · PI Planning · CE / CI / CD</p>
</header>
<div class="topbar">
  <div class="tb-t">// SAFe szintek</div>
  <div class="level-bar" id="levelBar"></div>
  <div class="role-chips" id="roleChips"></div>
</div>
<div class="content" id="content"></div>
<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 18</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>
<script>
const LEVELS=[
  {label:'Portfolió szint',color:'var(--port)',icon:'🏛️'},
  {label:'Essential szint',color:'var(--ess)',icon:'🚂'},
  {label:'Team szint',color:'var(--team)',icon:'👥'},
  {label:'CE/CI/CD',color:'var(--ce)',icon:'🔄'},
];
const ROLES_CHIPS=[
  {label:'LPM',color:'var(--port)'},
  {label:'Epic Owner',color:'var(--port)'},
  {label:'Enterprise Architect',color:'var(--port)'},
  {label:'RTE',color:'var(--ess)'},
  {label:'Product Mgmt',color:'var(--ess)'},
  {label:'System Architect',color:'var(--ess)'},
  {label:'Business Owners',color:'var(--ess)'},
  {label:'PO',color:'var(--team)'},
  {label:'SM',color:'var(--team)'},
];

const STEPS=[
  // 0. MI A SAFE?
  {lv:-1,roles:[],render:()=>`
    <div class="shdr"><div class="sico">🚀</div>
      <div><div class="stitle">Mi a SAFe és mikor kell?</div>
      <div class="ssub">// Scaled Agile Framework — amikor 1 Scrum csapat már nem elég</div></div>
    </div>
    <div class="chat">
      <div class="msg show"><div class="av">👨‍🏫</div><div class="bub l"><div class="who" style="color:var(--acc)">Oktató</div>
        A Scrum csapatok a saját dedikált feladataikkal foglalkoznak. De mi van ha nagy méretű szoftverfejlesztésről beszélünk, ahol 50 Scrum csapat dolgozik ugyanazon a terméken?
      </div></div>
      <div class="msg show r" style="transition-delay:.15s"><div class="av">🙋</div><div class="bub r2"><div class="who" style="color:var(--team);text-align:right">Tanuló</div>
        50 Scrum csapat? Azok nem koordinálhatók hagyományos Scrum-mal...
      </div></div>
      <div class="msg show" style="transition-delay:.3s"><div class="av">👨‍🏫</div><div class="bub l"><div class="who" style="color:var(--acc)">Oktató</div>
        Pontosan! Erre ad megoldást a SAFe (Scaled Agile Framework) és a LeSS (Large-Scale Scrum). A SAFe egy több szintű modell — az alsóbb szintek mindig a magasabbtól kapják a feladatokat.
      </div></div>
    </div>
    <div class="ibox"><strong>SAFe alapelv:</strong> Az alsóbb szintek a feladatokat minden esetben a magasabbtól származtatják. A szintek EGYÜTTESEN valósítják az üzleti eredményt — legyen az termék vagy szolgáltatás. Nincs "saját" célkitűzés a szinteken belül, minden a portfolió stratégiából ered.</div>
  `},

  // 1. 3 SZINT ÁTTEKINTŐ
  {lv:-1,roles:[],render:()=>`
    <div class="shdr"><div class="sico">🗺️</div>
      <div><div class="stitle">SAFe — 3 szint áttekintő</div>
      <div class="ssub">// Portfolió → Essential → Team</div></div>
    </div>
    <div class="cklist">
      <div class="cli" style="border-left:3px solid var(--port)">
        <div class="cli-i">🏛️</div>
        <div><strong style="color:var(--port)">Portfolió szint</strong>
        <span>Stratégiai döntések: belép-e a cég egy szektorba? Milyen termékekkel? Erőforrástervezés, KPI-ok, EPIC-ek (magas szintű termékleírások) kezelése.</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--ess)">
        <div class="cli-i">🚂</div>
        <div><strong style="color:var(--ess)">Essential szint</strong>
        <span>A csapatok munkájának összehangolása. Release Train, PI Planning, Feature-ök priorizálása. Teljesen kitesztelt, működőképes produktumot kell szállítani.</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--team)">
        <div class="cli-i">👥</div>
        <div><strong style="color:var(--team)">Team szint</strong>
        <span>Egyedi Scrum/Kanban csapatok — a megszokott sprint-ekkel, PO-val, SM-mel. A Team Backlog az Essential szintből érkezik, szinkronban a többi csapattal.</span></div>
      </div>
    </div>
    <div style="background:var(--card);border:1.5px solid var(--brd2);border-radius:9px;padding:.65rem .75rem;margin:.45rem 0;font-family:'Inconsolata',monospace;font-size:.68rem;line-height:1.8">
      <div style="font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.35rem">// Backlog lánc — stratégiától a kódig</div>
      <div style="color:var(--port)">Portfolió Backlog (EPIC-ek) 🏛️</div>
      <div style="color:var(--muted)">          ↓ lebontja</div>
      <div style="color:var(--ess)">Program Backlog (Feature-ök) 🚂</div>
      <div style="color:var(--muted)">          ↓ lebontja</div>
      <div style="color:var(--team)">Team Backlog (User Story-k) 👥</div>
      <div style="color:var(--muted)">          ↓ implementálja</div>
      <div style="color:var(--ci)">Kész kód / szállítható termék ✅</div>
    </div>
  `},

  // 2. PORTFOLIÓ SZINT
  {lv:0,roles:[0,1,2],render:()=>`
    <div class="shdr"><div class="sico" style="border-color:rgba(168,85,247,.5)">🏛️</div>
      <div><div class="stitle">Portfolió szint</div>
      <div class="ssub">// stratégiai döntések — belép-e a cég egy piacra?</div></div>
    </div>
    <div class="level-card" style="background:rgba(168,85,247,.05);border-color:rgba(168,85,247,.35)">
      <div class="lc-hdr"><div class="lc-icon">🏛️</div>
        <div>
          <div class="lc-badge" style="color:var(--port)">PORTFOLIÓ SZINT</div>
          <div class="lc-name" style="color:var(--port)">Stratégia és erőforrástervezés</div>
        </div>
      </div>
      <div class="lc-desc">Magas szinten a stratégiai döntések születnek. Figyelembe veszi az üzleti igényeket, erőforrásokat, minőségi mutatókat, KPI értékeket és ügyfélelégedettséget.</div>
    </div>
    <div class="role-card">
      <div class="ri-badge" style="background:rgba(168,85,247,.1);color:var(--port);border-color:rgba(168,85,247,.35)">LPM</div>
      <div>
        <div class="ri-name">Lean Portfolio Management</div>
        <div class="ri-desc">Stratégiai- és erőforrástervezés, Lean alapelvek figyelembevételével. Ők döntenek, mibe fektet a cég.</div>
      </div>
    </div>
    <div class="role-card">
      <div class="ri-badge" style="background:rgba(168,85,247,.1);color:var(--port);border-color:rgba(168,85,247,.35)">Epic Owner</div>
      <div>
        <div class="ri-name">Epic Owner</div>
        <div class="ri-desc">Egy-egy piaci termék magas szintű definíciójáért felelős. Meghatározza a minimálisan piac által elfogadható termékszintet (MVP). Költség- és hatásanalízist készít.</div>
      </div>
    </div>
    <div class="role-card">
      <div class="ri-badge" style="background:rgba(168,85,247,.1);color:var(--port);border-color:rgba(168,85,247,.35)">Ent. Arch.</div>
      <div>
        <div class="ri-name">Enterprise Architect</div>
        <div class="ri-desc">Követi és érvényesíti a technológia fejlődéssel járó elvárásokat. Szakmai oldalról támogatja a stratégiai döntéseket — "ez technikailag megvalósítható?"</div>
      </div>
    </div>
    <div class="ibox p"><strong>Value Stream fogalom:</strong> A portfolió szinten nem termékeket, hanem értékteremtő folyamatokat (value stream) definiálnak. Több termék együttesen alkothat egy value stream-et — ezek akár a világ több táján fejleszthetők párhuzamosan.</div>
  `},

  // 3. PORTFOLIÓ ROADMAP
  {lv:0,roles:[0,1],render:()=>`
    <div class="shdr"><div class="sico" style="border-color:rgba(168,85,247,.5)">🗓️</div>
      <div><div class="stitle">Portfolió Roadmap — tervezési bizonytalanság</div>
      <div class="ssub">// minél távolabb az idő, annál bizonytalanabb a terv</div></div>
    </div>
    <div class="chat">
      <div class="msg show"><div class="av">🏛️</div><div class="bub l"><div class="who" style="color:var(--port)">Portfolio Manager</div>
        Meg tudjátok mondani pontosan mit szállítunk 2 év múlva?
      </div></div>
      <div class="msg show r" style="transition-delay:.15s"><div class="av">👨‍🏫</div><div class="bub r2"><div class="who" style="color:var(--acc);text-align:right">Oktató</div>
        Nem — és ez RENDBEN VAN! Ahogy előre nézünk az időben, egyre bizonytalanabbá válik a tervezés. Időközben új változók jelennek meg: piaci változás, versenyző új termék, törvényi változás.
      </div></div>
    </div>
    <div style="background:var(--card);border:1.5px solid var(--brd2);border-radius:9px;padding:.65rem .75rem;margin:.45rem 0">
      <div style="font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem">// Portfolio Roadmap — bizonytalanság növekedése</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:50px;margin-bottom:.3rem">
        <div style="flex:1;background:rgba(168,85,247,.7);border-radius:3px 3px 0 0" title="Q1 - biztos"></div>
        <div style="flex:1;background:rgba(168,85,247,.5);border-radius:3px 3px 0 0;height:75%"></div>
        <div style="flex:1;background:rgba(168,85,247,.35);border-radius:3px 3px 0 0;height:55%"></div>
        <div style="flex:1;background:rgba(168,85,247,.2);border-radius:3px 3px 0 0;height:35%" style="border:1px dashed rgba(168,85,247,.4)"></div>
        <div style="flex:1;background:rgba(168,85,247,.1);border-radius:3px 3px 0 0;height:20%;border:1px dashed rgba(168,85,247,.3)"></div>
      </div>
      <div style="display:flex;gap:4px;font-family:'Inconsolata',monospace;font-size:.48rem;color:var(--muted)">
        <div style="flex:1;text-align:center">Q1 most</div>
        <div style="flex:1;text-align:center">Q2</div>
        <div style="flex:1;text-align:center">Q3</div>
        <div style="flex:1;text-align:center">Q4</div>
        <div style="flex:1;text-align:center">Q5+</div>

      <div style="margin-top:.45rem;font-family:'Inconsolata',monospace;font-size:.56rem;color:var(--muted)">A CD visszacsatol a CE-be: a tesztelési és minőségi adatok befolyásolják a következő iteráció prioritásait.</div>
    </div>
    <div class="ibox ok"><strong>SAFe vs DevOps CE/CI/CD különbség:</strong> DevOps-ban a CI/CD a kód szintjén értendő (automatikus build + deploy). SAFe-ben a CE/CI/CD a PROGRAM szintjén értendő — az összes csapat együttes tervezési, fejlesztési és szállítási ciklusa.</div>
  `},

  // 12. SAFE vs LeSS
  {lv:-1,roles:[],render:()=>`
    <div class="shdr"><div class="sico">⚖️</div>
      <div><div class="stitle">SAFe vs LeSS — melyiket mikor?</div>
      <div class="ssub">// Large-Scale Scrum — az egyszerűbb alternatíva</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.45rem 0">
      <div style="background:rgba(59,130,246,.06);border:1.5px solid rgba(59,130,246,.3);border-radius:10px;padding:.75rem">
        <div style="font-family:'Inconsolata',monospace;font-size:.6rem;color:var(--ess);font-weight:700;margin-bottom:.3rem">🚂 SAFe</div>
        <div style="font-family:'Inconsolata',monospace;font-size:.62rem;color:var(--muted);line-height:1.65">
          ▸ Több szint (Portfolió, Essential, Team)<br>
          ▸ Sok definiált szerepkör<br>
          ▸ Komplex, de részletes<br>
          ▸ Nagy (100+ csapat) szervezeteknek<br>
          ▸ Hosszú bevezetés (1-2 év)<br>
          ▸ Pl. Siemens, Boeing
        </div>
      </div>
      <div style="background:rgba(16,185,129,.06);border:1.5px solid rgba(16,185,129,.3);border-radius:10px;padding:.75rem">
        <div style="font-family:'Inconsolata',monospace;font-size:.6rem;color:var(--team);font-weight:700;margin-bottom:.3rem">🌱 LeSS (Large-Scale Scrum)</div>
        <div style="font-family:'Inconsolata',monospace;font-size:.62rem;color:var(--muted);line-height:1.65">
          ▸ Egyszerűsített — Scrum alapokon<br>
          ▸ Kevés új szerepkör<br>
          ▸ Könnyebben bevezethető<br>
          ▸ Kisebb (2-8 csapat) szervezeteknek<br>
          ▸ Gyorsabban bevezethető<br>
          ▸ Pl. startupok, közepes cégek
        </div>
      </div>
    </div>
    <div class="ibox"><strong>Mikor melyik?</strong> SAFe: ha a szervezet már komplex, sok csapat, sok függőség, szabályozott ipar (repülő, orvosi). LeSS: ha agilis kultúra már megvan, és csak a skálázás a kihívás. A kettő nem keverendő szabadon — választani kell.</div>
  `},

  // 13. ÖSSZEFOGLALÁS
  {lv:-1,roles:[0,1,2,3,4,5,6,7,8],render:()=>`
    <div class="shdr"><div class="sico">∑</div>
      <div><div class="stitle">Összefoglalás — SAFe</div>
      <div class="ssub">// a legfontosabb fogalmak egyben</div></div>
    </div>
    <div class="sumgrid">
      <div class="sbox" style="border-top:2px solid var(--port)"><span class="ico">🏛️</span><div class="val">Portfolió</div><div class="lbl">Stratégia, EPIC, Value Stream</div></div>
      <div class="sbox" style="border-top:2px solid var(--ess)"><span class="ico">🚂</span><div class="val">Essential</div><div class="lbl">Release Train, Feature, PI</div></div>
      <div class="sbox" style="border-top:2px solid var(--team)"><span class="ico">👥</span><div class="val">Team</div><div class="lbl">Scrum sprint, User Story</div></div>
      <div class="sbox" style="border-top:2px solid var(--ce)"><span class="ico">🔄</span><div class="val">CE/CI/CD</div><div class="lbl">Folyamatos értékszállítás</div></div>
    </div>
    <div class="cklist">
      <div class="cli" style="border-left:3px solid var(--port)">
        <div class="cli-i">🏛️</div>
        <div><strong style="color:var(--port)">Portfolió szint</strong>
        <span>LPM (stratégia), Epic Owner (MVP meghatározás), Enterprise Architect (tech irány). EPIC-ek a Portfolió Backlog-ban. Roadmap — bizonytalanság nő távolabb.</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--ess)">
        <div class="cli-i">🚂</div>
        <div><strong style="color:var(--ess)">Essential szint</strong>
        <span>RTE (vonat karmester), Product Mgmt (Feature-ök), System Architect (tech irányelvek), Business Owners (üzleti szemlélet). Release Train = szinkronban szállító csapatok.</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--pi)">
        <div class="cli-i">📅</div>
        <div><strong style="color:var(--pi)">PI Planning</strong>
        <span>2 napos esemény. Függőségek azonosítása és feloldása. Eredmény: minden csapat szinkronizált, függőségmentes Team Backlog-gal indul a következő 4-5 sprintre.</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--ce)">
        <div class="cli-i">🔄</div>
        <div><strong>CE → CI → CD kör</strong>
        <span>CE: mit fejlesszünk (piaci igények). CI: folyamatos integráció, integrációs bumm elkerülése. CD: kész termék tesztelése, szállítás, visszacsatolás a CE-be.</span></div>
      </div>
    </div>
  `},
];

function renderBoard(lvIdx,roleIdxs){
  document.getElementById('levelBar').innerHTML=LEVELS.map((l,i)=>{
    const on=i===lvIdx;
    return `<div class="lv-btn ${on?'on':''}" style="border-color:${l.color};color:${l.color}">${l.icon} ${l.label}</div>`;
  }).join('');
  document.getElementById('roleChips').innerHTML=ROLES_CHIPS.map((r,i)=>{
    const on=roleIdxs.includes(i);
    return `<div class="rc ${on?'on':''}" style="border-color:${r.color};color:${r.color}">${r.label}</div>`;
  }).join('');
}

let cur=0;
function render(){
  const s=STEPS[cur];
  renderBoard(s.lv,s.roles);
  const el=document.getElementById('content');
  el.innerHTML=s.render();
  setTimeout(()=>{el.querySelectorAll('.msg:not(.show)').forEach((m,i)=>setTimeout(()=>m.classList.add('show'),i*160));},60);
  document.getElementById('bprev').disabled=cur===0;
  document.getElementById('bnext').textContent=cur===STEPS.length-1?'↺ Újra':'Következő →';
  document.getElementById('ctr').textContent=`${cur+1} / ${STEPS.length}`;
}
function next(){cur=cur===STEPS.length-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
</body>
</html>
