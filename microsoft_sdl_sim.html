<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microsoft SDL — Biztonságos Fejlesztés</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');

:root {
  --bg:    #0a0f1e;
  --surf:  #0f1628;
  --card:  #141d35;
  --brd:   #1e2d50;
  --brd2:  #263a68;
  --text:  #d8e4ff;
  --muted: #4a5f8a;

  --s0: #6b7280;   /* Oktatás */
  --s1: #3b82f6;   /* Követelmény */
  --s2: #6366f1;   /* Tervezés */
  --s3: #a855f7;   /* Implementáció */
  --s4: #f59e0b;   /* Verifikáció */
  --s5: #10b981;   /* Kiadás */
  --s6: #ef4444;   /* Utóélet */
  --acc: #3b82f6;
  --ok:  #10b981;
  --crit:#ef4444;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Sora',sans-serif; min-height:100vh; overflow-x:hidden; }
body::before {
  content:''; position:fixed; inset:0;
  background: radial-gradient(ellipse at 20% 0%, rgba(59,130,246,0.05) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 100%, rgba(16,185,129,0.04) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

header {
  position:relative; z-index:1; padding:1.2rem 1.3rem 0.85rem;
  border-bottom:1px solid var(--brd2);
  background:linear-gradient(180deg,rgba(59,130,246,0.05) 0%,transparent 100%);
}
.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }
h1 { font-size:1.4rem; font-weight:800; line-height:1.07; letter-spacing:-0.02em; }
h1 span { color:var(--acc); }
h1 em   { font-style:normal; color:var(--ok); }
.tag { font-family:'Inconsolata',monospace; font-size:0.56rem; padding:0.25rem 0.55rem; border-radius:4px; background:rgba(59,130,246,0.12); color:var(--acc); border:1px solid rgba(59,130,246,0.28); white-space:nowrap; margin-top:0.2rem; }
header p { font-size:0.7rem; color:var(--muted); margin-top:0.25rem; font-family:'Inconsolata',monospace; }

/* SDL PHASE BAR */
.sdlbar { position:relative; z-index:1; background:var(--surf); border-bottom:1px solid var(--brd2); padding:0.75rem 1.3rem 0.65rem; }
.sb-title { font-family:'Inconsolata',monospace; font-size:0.54rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.09em; margin-bottom:0.5rem; }
.sdl-steps { display:flex; align-items:center; gap:0; margin-bottom:0.4rem; }
.sdl-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:0.18rem; position:relative; }
.sdl-item:not(:last-child)::after { content:''; position:absolute; right:0; top:13px; width:50%; height:2px; background:var(--brd); z-index:0; }
.sdl-item:not(:first-child)::before { content:''; position:absolute; left:0; top:13px; width:50%; height:2px; background:var(--brd); z-index:0; }
.sdl-dot { width:26px; height:26px; border-radius:50%; border:2px solid var(--brd2); background:var(--card); display:flex; align-items:center; justify-content:center; font-size:0.62rem; z-index:1; transition:all 0.35s; position:relative; }
.sdl-label { font-family:'Inconsolata',monospace; font-size:0.44rem; color:var(--muted); text-align:center; line-height:1.2; }
.sdl-item.active .sdl-dot { transform:scale(1.25); box-shadow:0 0 12px currentColor; }
.sdl-item.done .sdl-dot { opacity:0.55; }
.sdl-item.active .sdl-label { font-weight:700; font-size:0.48rem; }
.concept-chips { display:flex; gap:4px; flex-wrap:wrap; }
.con-chip { font-family:'Inconsolata',monospace; font-size:0.52rem; font-weight:600; padding:0.14rem 0.4rem; border-radius:3px; border:1px solid; opacity:0.25; transition:opacity 0.3s; }
.con-chip.on { opacity:1; }

/* CONTENT */
.content { position:relative; z-index:1; padding:0.9rem 1.3rem; min-height:275px; }
.shdr { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.85rem; }
.sico { width:36px; height:36px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1rem; border:1.5px solid var(--brd2); background:var(--card); }
.stitle { font-size:0.95rem; font-weight:800; letter-spacing:-0.02em; }
.ssub { font-family:'Inconsolata',monospace; font-size:0.56rem; color:var(--muted); margin-top:0.03rem; }

/* CHAT */
.chat { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.7rem; }
.msg { display:flex; gap:0.4rem; align-items:flex-start; opacity:0; transform:translateY(6px); transition:opacity 0.3s, transform 0.3s; }
.msg.show { opacity:1; transform:translateY(0); }
.msg.r { flex-direction:row-reverse; }
.av { width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; flex-shrink:0; border:1px solid var(--brd2); background:var(--card); }
.bub { max-width:82%; padding:0.48rem 0.68rem; border-radius:9px; font-size:0.77rem; line-height:1.55; border:1px solid var(--brd2); background:var(--card); }
.bub.l  { border-bottom-left-radius:2px; }
.bub.r2 { border-bottom-right-radius:2px; text-align:right; }
.who { font-family:'Inconsolata',monospace; font-size:0.55rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.1rem; }

/* SDL PHASE CARD */
.sdl-phase-card { border-radius:12px; padding:0.85rem 1rem; margin-bottom:0.5rem; border:2px solid; }
.spc-hdr { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.45rem; }
.spc-num { font-family:'Inconsolata',monospace; font-size:1.4rem; font-weight:800; flex-shrink:0; line-height:1; }
.spc-title { font-size:0.95rem; font-weight:800; letter-spacing:-0.02em; }
.spc-sub { font-family:'Inconsolata',monospace; font-size:0.56rem; opacity:0.7; margin-top:0.05rem; }
.spc-badge { font-family:'Inconsolata',monospace; font-size:0.52rem; padding:0.12rem 0.45rem; border-radius:3px; border:1px solid; font-weight:700; margin-left:auto; }
.spc-desc { font-size:0.74rem; line-height:1.6; color:rgba(216,228,255,0.85); }

/* CODE BLOCK */
.code-block { background:#0d1117; border:1px solid var(--brd2); border-radius:8px; padding:0.65rem 0.8rem; margin:0.35rem 0; font-family:'Inconsolata',monospace; font-size:0.72rem; line-height:1.7; overflow-x:auto; }
.cb-label { font-family:'Inconsolata',monospace; font-size:0.52rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:0.3rem; display:flex; align-items:center; gap:0.4rem; }
.cb-ok { background:rgba(16,185,129,0.15); color:var(--ok); padding:0.1rem 0.35rem; border-radius:3px; font-weight:700; }
.cb-bad { background:rgba(239,68,68,0.15); color:var(--crit); padding:0.1rem 0.35rem; border-radius:3px; font-weight:700; }
.c-kw { color:#ff7b72; }
.c-fn { color:#d2a8ff; }
.c-str { color:#a5d6ff; }
.c-var { color:#ffa657; }
.c-cmt { color:#8b949e; font-style:italic; }
.c-bad { background:rgba(239,68,68,0.18); border-radius:3px; padding:0 2px; }
.c-good { background:rgba(16,185,129,0.15); border-radius:3px; padding:0 2px; }

/* IBOX */
.ibox { border-radius:8px; padding:0.55rem 0.75rem; font-size:0.74rem; line-height:1.55; margin:0.45rem 0; border:1px solid var(--brd2); background:var(--card); border-left:3px solid var(--acc); }
.ibox strong { font-weight:700; }
.ibox.ok-b { border-left-color:var(--ok); }
.ibox.ok-b strong { color:var(--ok); }
.ibox.warn-b { border-left-color:#f59e0b; }
.ibox.warn-b strong { color:#f59e0b; }

/* CHECKLIST */
.cklist { display:flex; flex-direction:column; gap:0.35rem; margin:0.45rem 0; }
.cli { display:flex; align-items:flex-start; gap:0.5rem; padding:0.42rem 0.65rem; background:var(--card); border:1px solid var(--brd2); border-radius:8px; font-size:0.75rem; line-height:1.45; }
.cli-i { flex-shrink:0; font-size:0.88rem; }
.cli strong { display:block; font-weight:700; font-size:0.76rem; margin-bottom:0.03rem; }
.cli span { color:var(--muted); font-size:0.68rem; font-family:'Inconsolata',monospace; }

/* CONCEPT GRID */
.concept-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.35rem; margin:0.45rem 0; }
.con-card { background:var(--card); border:1px solid var(--brd2); border-radius:8px; padding:0.55rem 0.65rem; border-left:3px solid; }
.cc-title { font-size:0.77rem; font-weight:800; margin-bottom:0.1rem; }
.cc-desc { font-size:0.65rem; color:var(--muted); line-height:1.4; font-family:'Inconsolata',monospace; }

/* SUMGRID */
.sumgrid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }
.sbox { background:var(--card); border:1px solid var(--brd2); border-radius:8px; padding:0.6rem; text-align:center; }
.sbox .ico { font-size:1.2rem; display:block; margin-bottom:0.15rem; }
.sbox .val { font-size:0.88rem; font-weight:800; }
.sbox .lbl { font-family:'Inconsolata',monospace; font-size:0.52rem; color:var(--muted); margin-top:0.04rem; }

/* SDL TIMELINE */
.sdl-timeline { background:var(--card); border:1.5px solid var(--brd2); border-radius:9px; overflow:hidden; margin:0.45rem 0; }
.sdlt-hdr { background:var(--surf); padding:0.3rem 0.7rem; font-family:'Inconsolata',monospace; font-size:0.52rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; border-bottom:1px solid var(--brd); }
.sdlt-row { display:flex; align-items:center; padding:0.38rem 0.7rem; border-bottom:1px solid var(--brd); gap:0.5rem; font-size:0.7rem; }
.sdlt-row:last-child { border-bottom:none; }
.sdlt-num { font-family:'Inconsolata',monospace; font-size:0.65rem; font-weight:800; width:22px; flex-shrink:0; }
.sdlt-name { font-weight:700; flex:1; }
.sdlt-key { font-family:'Inconsolata',monospace; font-size:0.6rem; color:var(--muted); }

/* NAV */
.nav { position:sticky; bottom:0; z-index:10; background:var(--bg); border-top:1px solid var(--brd2); padding:0.7rem 1.3rem; display:flex; align-items:center; gap:0.5rem; }
.btn { font-family:'Inconsolata',monospace; font-size:0.63rem; font-weight:600; padding:0.52rem 1rem; border-radius:7px; cursor:pointer; transition:all 0.18s; text-transform:uppercase; letter-spacing:0.04em; }
.btnp { background:transparent; color:var(--muted); border:1px solid var(--brd2); }
.btnp:hover { color:var(--text); }
.btnp:disabled { opacity:0.2; cursor:not-allowed; }
.btnn { flex:1; background:rgba(59,130,246,0.12); color:var(--acc); border:1px solid rgba(59,130,246,0.3); }
.btnn:hover { background:rgba(59,130,246,0.22); }
.ctr { font-family:'Inconsolata',monospace; font-size:0.57rem; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <h1><span>Microsoft</span><br>SDL<br><em>Módszertan</em></h1>
    <div class="tag">2004 · v5.2 · 7 szakasz</div>
  </div>
  <p>// Security Development Lifecycle — biztonságos kód a tervezéstől a kiadásig</p>
</header>

<div class="sdlbar">
  <div class="sb-title">// SDL szakaszok — aktuális</div>
  <div class="sdl-steps" id="sdlSteps"></div>
  <div class="concept-chips" id="conceptChips"></div>
</div>

<div class="content" id="content"></div>

<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 17</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>

<script>
const SDL_PHASES = [
  { label:'0.\nOktatás',     color:'var(--s0)', icon:'📚' },
  { label:'1.\nKövetelm.',   color:'var(--s1)', icon:'📋' },
  { label:'2.\nTervezés',    color:'var(--s2)', icon:'🏗️' },
  { label:'3.\nImpl.',       color:'var(--s3)', icon:'💻' },
  { label:'4.\nVerifikáció', color:'var(--s4)', icon:'🧪' },
  { label:'5.\nKiadás',      color:'var(--s5)', icon:'📦' },
  { label:'6.\nUtóélet',     color:'var(--s6)', icon:'🔄' },
];

const CONCEPTS = [
  { label:'Tám. felület ↓', color:'var(--s2)' },
  { label:'Mélységi véd.', color:'var(--s3)' },
  { label:'Legkisebb priv.', color:'var(--s2)' },
  { label:'Secure default', color:'var(--s2)' },
  { label:'Threat Model', color:'var(--s1)' },
];

const STEPS = [

  // ── 0. MI AZ SDL? ────────────────────────────────────────────────
  {
    phase:-1, cons:[],
    render:()=>`
      <div class="shdr"><div class="sico" style="border-color:rgba(59,130,246,0.5)">🛡️</div>
        <div><div class="stitle">Mi az a Microsoft SDL?</div>
        <div class="ssub">// Security Development Lifecycle — 2004, Microsoft</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--acc)">Oktató</div>
            A Microsoft SDL egy speciális szoftverfejlesztési folyamat, amelyet a Microsoft fejlesztett ki azután, hogy 2002-ben Bill Gates kiadta a "Trustworthy Computing" memóját.
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--s3);text-align:right">Tanuló</div>
            Mi volt a probléma? A Microsoft kódjában biztonsági hibák voltak?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--acc)">Oktató</div>
            2001-ben a Code Red és Nimda vírusok hónapokon belül követték egymást — mindkettő Windows hibákat használt ki, és dollár milliárdokat okoztak. Microsoft felismerte: a biztonságot a FEJLESZTÉSI FOLYAMATBA kell beépíteni, nem utólag foltozni.
          </div>
        </div>
      </div>
      <div style="background:rgba(59,130,246,0.05);border:2px solid rgba(59,130,246,0.3);border-radius:11px;padding:0.8rem;margin:0.45rem 0">
        <div style="font-family:'Inconsolata',monospace;font-size:0.58rem;color:var(--acc);font-weight:700;margin-bottom:0.3rem">MICROSOFT SDL — ALAPADATOK</div>
        <div class="cklist" style="margin:0">
          <div class="cli" style="border-left:3px solid var(--acc)">
            <div class="cli-i">📅</div>
            <div><strong>2004. január — első verzió</strong>
            <span>Azóta folyamatosan fejlesztik. Jelenlegi verzió: 5.2 (2012-ben adták ki). A legismertebb biztonsági fejlesztési módszertan.</span></div>
          </div>
          <div class="cli" style="border-left:3px solid var(--acc)">
            <div class="cli-i">🎯</div>
            <div><strong>Cél: megbízhatóság növelése</strong>
            <span>Különös tekintettel a biztonsági hibákra. Nem "patchelni kell ha megtalálják" — hanem "már a tervezéskor kizárni a lehetséges hibát".</span></div>
          </div>
          <div class="cli" style="border-left:3px solid var(--ok)">
            <div class="cli-i">📊</div>
            <div><strong>Eredmény: drámai csökkenés</strong>
            <span>Az SDL bevezetése után a Windows kritikus biztonsági hibáinak száma 45%-kal csökkent az első évben. A Internet Explorer biztonsági sebezhetőségei 45%-kal estek vissza.</span></div>
          </div>
        </div>
      </div>
    `
  },

  // ── 1. BIZTONSÁGI KONCEPCIÓK ─────────────────────────────────────
  {
    phase:-1, cons:[0,1,2,3],
    render:()=>`
      <div class="shdr"><div class="sico">💡</div>
        <div><div class="stitle">Alapvető biztonsági koncepciók</div>
        <div class="ssub">// ezekre épül az egész SDL — tanuld meg kívülről</div></div>
      </div>
      <div class="concept-grid">
        <div class="con-card" style="border-color:var(--s2)">
          <div class="cc-title" style="color:var(--s2)">🎯 Támadási felület ↓</div>
          <div class="cc-desc">Minél kevesebb "belépési pont" van a rendszerbe, annál kisebb a kockázat. Pl. egy API-nál: kevesebb publikus endpoint = kisebb támadási felület.</div>
        </div>
        <div class="con-card" style="border-color:var(--s3)">
          <div class="cc-title" style="color:var(--s3)">🏰 Mélységi védekezés</div>
          <div class="cc-desc">Defense in depth — több biztonsági réteg egymás után. Ha az egyik réteg áttörhető, a következő megállítja. Pl. Tűzfal + Auth + Titkosítás + Monitoring.</div>
        </div>
        <div class="con-card" style="border-color:var(--s2)">
          <div class="cc-title" style="color:var(--s2)">🔑 Legkisebb privilégium</div>
          <div class="cc-desc">Least privilege — csak annyi jogosultságot adjunk amennyire szükség van. Pl. az adatbázis user csak SELECT jogot kapjon, ha nem kell írni.</div>
        </div>
        <div class="con-card" style="border-color:var(--s5)">
          <div class="cc-title" style="color:var(--s5)">🔒 Biztonságos default</div>
          <div class="cc-desc">Az alapértelmezett konfiguráció a legszigorúbb legyen. A felhasználók "gyengítik" saját igényeikre — nem "erősítik" utólag. Opt-in, nem opt-out.</div>
        </div>
      </div>
      <div class="concept-grid">
        <div class="con-card" style="border-color:var(--s1)">
          <div class="cc-title" style="color:var(--s1)">🏗️ Biztonságos architektúra</div>
          <div class="cc-desc">A rendszer architektúrális döntései meghatározzák a biztonsági szintet. Pl. microservice vs monolit eltérő biztonsági modellt igényel.</div>
        </div>
        <div class="con-card" style="border-color:var(--s4)">
          <div class="cc-title" style="color:var(--s4)">🚨 Válaszadás incidensre</div>
          <div class="cc-desc">Előre kidolgozott eljárás: ha biztonsági incidens történik, ki mit csinál? Incident Response Plan — nem a tűz közben kell kitalálni.</div>
        </div>
      </div>
      <div class="ibox"><strong>Analógia — Mélységi védekezés:</strong> Egy bank nem csak a széfet zárja be. Van: biztonsági őr az ajtón, kamera, riasztó, páncélüveg, pin kód a belső ajtóhoz, és a széf. Ha valami elmegy — a többi megállítja. Ez a defense in depth.</div>
    `
  },

  // ── 2. SDL ÁTTEKINTŐ ─────────────────────────────────────────────
  {
    phase:-1, cons:[],
    render:()=>`
      <div class="shdr"><div class="sico">🗺️</div>
        <div><div class="stitle">SDL életciklus — 7 szakasz áttekintő</div>
        <div class="ssub">// 0-tól 6-ig — minden fázisban security</div></div>
      </div>
      <div class="sdl-timeline">
        <div class="sdlt-hdr">// Microsoft SDL — teljes folyamat</div>
        <div class="sdlt-row">
          <div class="sdlt-num" style="color:var(--s0)">0.</div>
          <div class="sdlt-name">Oktatás</div>
          <div class="sdlt-key">minden fejlesztő, tesztelő, manager → biztonsági képzés</div>
        </div>
        <div class="sdlt-row">
          <div class="sdlt-num" style="color:var(--s1)">1.</div>
          <div class="sdlt-name">Követelményspecifikáció</div>
          <div class="sdlt-key">biztonsági + bizalmassági követelmények, bug bar meghatározása</div>
        </div>
        <div class="sdlt-row">
          <div class="sdlt-num" style="color:var(--s2)">2.</div>
          <div class="sdlt-name">Tervezés</div>
          <div class="sdlt-key">biztonságos architektúra, támadási felület minimalizálása, threat modelling</div>
        </div>
        <div class="sdlt-row">
          <div class="sdlt-num" style="color:var(--s3)">3.</div>
          <div class="sdlt-name">Implementáció</div>
          <div class="sdlt-key">kód review, tiltott függvények, input validáció, ASLR, biztonságos DB elérés</div>
        </div>
        <div class="sdlt-row">
          <div class="sdlt-num" style="color:var(--s4)">4.</div>
          <div class="sdlt-name">Verifikáció</div>
          <div class="sdlt-key">fuzzing, penetrációs teszt, memória korrupció tesztelés</div>
        </div>
        <div class="sdlt-row">
          <div class="sdlt-num" style="color:var(--s5)">5.</div>
          <div class="sdlt-name">Kiadás</div>
          <div class="sdlt-key">bizalmasság review, debug letiltása, incident response eljárás</div>
        </div>

function renderBoard(phaseIdx, consIdxs) {
  document.getElementById('sdlSteps').innerHTML = SDL_PHASES.map((p,i)=>{
    const on = i === phaseIdx, done = phaseIdx >= 0 && i < phaseIdx;
    const c = on ? p.color : done ? p.color : 'var(--muted)';
    return `<div class="sdl-item ${on?'active':done?'done':''}">
      <div class="sdl-dot" style="border-color:${c};color:${c}">${p.icon}</div>
      <div class="sdl-label" style="color:${on?p.color:'var(--muted)'}">${p.label.replace('\n','<br>')}</div>
    </div>`;
  }).join('');
  document.getElementById('conceptChips').innerHTML = CONCEPTS.map((c,i)=>{
    const on = consIdxs.includes(i);
    return `<div class="con-chip ${on?'on':''}" style="border-color:${c.color};color:${c.color}">${c.label}</div>`;
  }).join('');
}

let cur = 0;
function render() {
  const s = STEPS[cur];
  renderBoard(s.phase, s.cons);
  const el = document.getElementById('content');
  el.innerHTML = s.render();
  setTimeout(()=>{el.querySelectorAll('.msg:not(.show)').forEach((m,i)=>setTimeout(()=>m.classList.add('show'),i*160));},60);
  document.getElementById('bprev').disabled = cur===0;
  document.getElementById('bnext').textContent = cur===STEPS.length-1?'↺ Újra':'Következő →';
  document.getElementById('ctr').textContent = `${cur+1} / ${STEPS.length}`;
}
function next(){cur=cur===STEPS.length-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
