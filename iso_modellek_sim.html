<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szoftverminőség Modellek — McCall, ISO 9126, ISO 25010, ISO 9000</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');

:root {
  --bg:    #0a0f1e;
  --surf:  #0f1628;
  --card:  #141d35;
  --brd:   #1e2d50;
  --brd2:  #263a68;
  --text:  #d8e4ff;
  --muted: #4a5f8a;

  --mcc:  #f59e0b;   /* McCall */
  --iso9: #3b82f6;   /* ISO 9126 */
  --iso25:#10b981;   /* ISO 25010 */
  --iso0: #a855f7;   /* ISO 9000 */
  --acc:  #6366f1;

  /* McCall háromszög */
  --op:  #f59e0b;   /* operation */
  --rev: #3b82f6;   /* revision */
  --tr:  #10b981;   /* transition */

  /* ISO 9126 jellemzők */
  --func: #f59e0b;
  --rel:  #ef4444;
  --usa:  #10b981;
  --eff:  #6366f1;
  --mnt:  #a855f7;
  --por:  #22d3ee;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--bg); color:var(--text);
  font-family:'Sora', sans-serif; min-height:100vh; overflow-x:hidden;
}

body::before {
  content:''; position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(99,102,241,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(16,185,129,0.04) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

header {
  position:relative; z-index:1;
  padding:1.2rem 1.3rem 0.85rem;
  border-bottom:1px solid var(--brd2);
  background:linear-gradient(180deg, rgba(99,102,241,0.05) 0%, transparent 100%);
}
.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }
h1 { font-size:1.4rem; font-weight:800; line-height:1.07; letter-spacing:-0.02em; }
h1 span { color:var(--mcc); }
h1 em   { font-style:normal; color:var(--iso25); }
.tag {
  font-family:'Inconsolata', monospace; font-size:0.56rem;
  padding:0.25rem 0.55rem; border-radius:4px;
  background:rgba(99,102,241,0.12); color:var(--acc);
  border:1px solid rgba(99,102,241,0.28); white-space:nowrap; margin-top:0.2rem;
}
header p { font-size:0.7rem; color:var(--muted); margin-top:0.25rem; font-family:'Inconsolata', monospace; }

/* MODEL SELECTOR */
.modelbar {
  position:relative; z-index:1;
  background:var(--surf); border-bottom:1px solid var(--brd2);
  padding:0.75rem 1.3rem 0.65rem;
}
.mb-title {
  font-family:'Inconsolata', monospace; font-size:0.54rem;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.09em; margin-bottom:0.5rem;
}
.model-steps {
  display:flex; align-items:center; gap:0; margin-bottom:0.45rem;
}
.ms-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:0.2rem; position:relative;
}
.ms-item:not(:last-child)::after {
  content:''; position:absolute; right:0; top:13px;
  width:50%; height:2px; background:var(--brd); z-index:0;
}
.ms-item:not(:first-child)::before {
  content:''; position:absolute; left:0; top:13px;
  width:50%; height:2px; background:var(--brd); z-index:0;
}
.ms-dot {
  width:26px; height:26px; border-radius:50%;
  border:2px solid var(--brd2); background:var(--card);
  display:flex; align-items:center; justify-content:center;
  font-size:0.62rem; z-index:1; transition:all 0.35s; position:relative;
}
.ms-label {
  font-family:'Inconsolata', monospace; font-size:0.47rem;
  color:var(--muted); text-align:center; line-height:1.2;
}
.ms-item.active .ms-dot { transform:scale(1.25); box-shadow:0 0 12px currentColor; }
.ms-item.done   .ms-dot { opacity:0.55; }
.ms-item.active .ms-label { font-weight:700; font-size:0.5rem; }

.char-pills { display:flex; gap:4px; flex-wrap:wrap; }
.char-pill {
  font-family:'Inconsolata', monospace; font-size:0.52rem; font-weight:600;
  padding:0.15rem 0.42rem; border-radius:3px; border:1px solid;
  opacity:0.25; transition:opacity 0.3s;
}
.char-pill.on { opacity:1; }

/* CONTENT */
.content { position:relative; z-index:1; padding:0.9rem 1.3rem; min-height:275px; }

.shdr { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.85rem; }
.sico {
  width:36px; height:36px; border-radius:9px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:1rem;
  border:1.5px solid var(--brd2); background:var(--card);
}
.stitle { font-size:0.95rem; font-weight:800; letter-spacing:-0.02em; }
.ssub   { font-family:'Inconsolata', monospace; font-size:0.56rem; color:var(--muted); margin-top:0.03rem; }

/* CHAT */
.chat { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.7rem; }
.msg { display:flex; gap:0.4rem; align-items:flex-start; opacity:0; transform:translateY(6px); transition:opacity 0.3s, transform 0.3s; }
.msg.show { opacity:1; transform:translateY(0); }
.msg.r { flex-direction:row-reverse; }
.av { width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; flex-shrink:0; border:1px solid var(--brd2); background:var(--card); }
.bub { max-width:82%; padding:0.48rem 0.68rem; border-radius:9px; font-size:0.77rem; line-height:1.55; border:1px solid var(--brd2); background:var(--card); }
.bub.l  { border-bottom-left-radius:2px; }
.bub.r2 { border-bottom-right-radius:2px; text-align:right; }
.who { font-family:'Inconsolata', monospace; font-size:0.55rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.1rem; }

/* IBOX */
.ibox {
  border-radius:8px; padding:0.55rem 0.75rem; font-size:0.74rem; line-height:1.55;
  margin:0.45rem 0; border:1px solid var(--brd2); background:var(--card);
  border-left:3px solid var(--acc);
}
.ibox strong { font-weight:700; }

/* CHECKLIST */
.cklist { display:flex; flex-direction:column; gap:0.35rem; margin:0.45rem 0; }
.cli {
  display:flex; align-items:flex-start; gap:0.5rem;
  padding:0.42rem 0.65rem; background:var(--card);
  border:1px solid var(--brd2); border-radius:8px; font-size:0.75rem; line-height:1.45;
}
.cli-i { flex-shrink:0; font-size:0.88rem; }
.cli strong { display:block; font-weight:700; font-size:0.76rem; margin-bottom:0.03rem; }
.cli span   { color:var(--muted); font-size:0.68rem; font-family:'Inconsolata', monospace; }

/* MCALL HÁROMSZÖG VISUAL */
.triangle-vis {
  background:var(--card); border:1.5px solid var(--brd2); border-radius:9px;
  overflow:hidden; margin:0.45rem 0;
}
.tv-hdr {
  background:var(--surf); padding:0.3rem 0.7rem; border-bottom:1px solid var(--brd);
  font-family:'Inconsolata', monospace; font-size:0.52rem; color:var(--muted);
  text-transform:uppercase; letter-spacing:0.07em;
}
.tv-row {
  display:flex; gap:0; border-bottom:1px solid var(--brd);
}
.tv-row:last-child { border-bottom:none; }
.tv-side {
  width:70px; flex-shrink:0; padding:0.5rem 0.6rem;
  display:flex; align-items:center; justify-content:center;
  font-family:'Inconsolata', monospace; font-size:0.6rem; font-weight:700;
  text-align:center; line-height:1.2; border-right:1px solid var(--brd);
}
.tv-factors { flex:1; padding:0.45rem 0.6rem; display:flex; flex-wrap:wrap; gap:0.25rem; }
.tv-factor {
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  padding:0.12rem 0.4rem; border-radius:3px; border:1px solid; font-weight:600;
}

/* ISO JELLEMZŐK KÁRTYÁK */
.iso-char-card {
  border-radius:10px; padding:0.7rem 0.85rem; margin:0.35rem 0; border:1.5px solid;
}
.ic-hdr { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem; }
.ic-icon { font-size:1.1rem; }
.ic-name { font-size:0.85rem; font-weight:800; letter-spacing:-0.01em; }
.ic-badge { font-family:'Inconsolata', monospace; font-size:0.53rem; padding:0.1rem 0.4rem; border-radius:3px; border:1px solid; font-weight:600; margin-left:auto; }
.ic-desc { font-size:0.73rem; line-height:1.55; color:rgba(216,228,255,0.82); }
.ic-example {
  margin-top:0.3rem; background:var(--surf); border-radius:6px;
  padding:0.35rem 0.55rem; font-size:0.7rem; line-height:1.45;
  border-left:2px solid; color:rgba(216,228,255,0.75);
}
.ex-label { font-family:'Inconsolata', monospace; font-size:0.5rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; margin-bottom:0.1rem; }

/* ISO 9000 ELVEK */
.elv-card {
  border-radius:9px; padding:0.6rem 0.75rem; margin:0.3rem 0;
  border:1px solid var(--brd2); background:var(--card);
  display:flex; gap:0.5rem; align-items:flex-start;
}
.elv-num {
  font-family:'Inconsolata', monospace; font-size:0.7rem; font-weight:800;
  flex-shrink:0; width:20px; text-align:center; margin-top:0.05rem;
}
.elv-title { font-size:0.77rem; font-weight:800; margin-bottom:0.08rem; }
.elv-desc { font-size:0.68rem; color:var(--muted); line-height:1.45; font-family:'Inconsolata', monospace; }
.elv-ex { font-size:0.67rem; margin-top:0.1rem; color:rgba(216,228,255,0.6); }

/* COMPARISON */
.comp2 { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }

/* SUMGRID */
.sumgrid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }
.sbox { background:var(--card); border:1px solid var(--brd2); border-radius:8px; padding:0.6rem; text-align:center; }
.sbox .ico { font-size:1.2rem; display:block; margin-bottom:0.15rem; }
.sbox .val { font-size:0.88rem; font-weight:800; }
.sbox .lbl { font-family:'Inconsolata', monospace; font-size:0.52rem; color:var(--muted); margin-top:0.04rem; }

/* NAV */
.nav {
  position:sticky; bottom:0; z-index:10;
  background:var(--bg); border-top:1px solid var(--brd2);
  padding:0.7rem 1.3rem; display:flex; align-items:center; gap:0.5rem;
}
.btn {
  font-family:'Inconsolata', monospace; font-size:0.63rem; font-weight:600;
  padding:0.52rem 1rem; border-radius:7px; cursor:pointer;
  transition:all 0.18s; text-transform:uppercase; letter-spacing:0.04em;
}
.btnp { background:transparent; color:var(--muted); border:1px solid var(--brd2); }
.btnp:hover { color:var(--text); }
.btnp:disabled { opacity:0.2; cursor:not-allowed; }
.btnn { flex:1; background:rgba(99,102,241,0.12); color:var(--acc); border:1px solid rgba(99,102,241,0.3); }
.btnn:hover { background:rgba(99,102,241,0.22); }
.ctr { font-family:'Inconsolata', monospace; font-size:0.57rem; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <h1><span>McCall</span> · ISO<br>9126 · 25010<br><em>· 9000</em></h1>
    <div class="tag">Termék + Folyamat // modellek</div>
  </div>
  <p>// McCall háromszög · ISO 9126 · ISO 25010 · ISO 9000 elvek</p>
</header>

<div class="modelbar">
  <div class="mb-title">// minőségmodellek — aktuális</div>
  <div class="model-steps" id="modelSteps"></div>
  <div class="char-pills" id="charPills"></div>
</div>

<div class="content" id="content"></div>

<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 25</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>

<script>
const MODELS = [
  { label:'Termék vs\nFolyamat', color:'var(--acc)',  icon:'⚖️' },
  { label:'McCall\n3 szint',    color:'var(--mcc)',  icon:'△' },
  { label:'ISO\n9126',          color:'var(--iso9)', icon:'6' },
  { label:'ISO\n25010',         color:'var(--iso25)',icon:'✚' },
  { label:'ISO\n9000',          color:'var(--iso0)', icon:'9' },
  { label:'Össze\nfoglalás',    color:'#ec4899',     icon:'∑' },
];

const CHARS_9126 = [
  { label:'Funkcionalitás', color:'var(--func)' },
  { label:'Megbízhatóság',  color:'var(--rel)' },
  { label:'Használhatóság', color:'var(--usa)' },
  { label:'Hatékonyság',    color:'var(--eff)' },
  { label:'Karbantarthat.', color:'var(--mnt)' },
  { label:'Hordozhatóság',  color:'var(--por)' },
];

const STEPS = [

  // ── 0. TERMÉK VS FOLYAMAT ────────────────────────────────────────
  {
    model:0, chars:[],
    render:()=>`
      <div class="shdr"><div class="sico">⚖️</div>
        <div><div class="stitle">Termék-alapú vs Folyamat-alapú</div>
        <div class="ssub">// két teljesen különböző megközelítés</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--acc)">Oktató</div>
            A szoftverminőség mérésére két fő iskolát különböztetünk meg. Melyikre gondolnátok előbb?
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--mcc);text-align:right">Tanuló</div>
            Hát a terméket nézzük — végül is az a fontos, hogy a szoftver jó legyen?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--acc)">Oktató</div>
            Igaz! De a folyamat is számít — ha jó a gyártási folyamat, akkor a termék is jó lesz. Mint a hamburger: ha jó receptből és jó alapanyagokból készítik, a végeredmény is jó lesz.
          </div>
        </div>
      </div>
      <div class="comp2">
        <div style="background:rgba(245,158,11,0.07);border:1.5px solid rgba(245,158,11,0.3);border-radius:10px;padding:0.75rem">
          <div style="font-family:'Inconsolata',monospace;font-size:0.6rem;color:var(--mcc);font-weight:700;margin-bottom:0.35rem">📦 TERMÉK-ALAPÚ</div>
          <div class="cklist" style="margin:0">
            <div style="font-size:0.7rem;margin-bottom:0.1rem">Magát a szoftvert vizsgálja</div>
            <div style="font-size:0.68rem;color:var(--muted);font-family:'Inconsolata',monospace">▸ McCall féle modell</div>
            <div style="font-size:0.68rem;color:var(--muted);font-family:'Inconsolata',monospace">▸ Boehm féle modell</div>
            <div style="font-size:0.68rem;color:var(--muted);font-family:'Inconsolata',monospace">▸ ISO 9126</div>
            <div style="font-size:0.68rem;color:var(--muted);font-family:'Inconsolata',monospace">▸ ISO 25010</div>
          </div>
        </div>
        <div style="background:rgba(168,85,247,0.07);border:1.5px solid rgba(168,85,247,0.3);border-radius:10px;padding:0.75rem">
          <div style="font-family:'Inconsolata',monospace;font-size:0.6rem;color:var(--iso0);font-weight:700;margin-bottom:0.35rem">⚙️ FOLYAMAT-ALAPÚ</div>
          <div class="cklist" style="margin:0">
            <div style="font-size:0.7rem;margin-bottom:0.1rem">A fejlesztési folyamatot vizsgálja</div>
            <div style="font-size:0.68rem;color:var(--muted);font-family:'Inconsolata',monospace">▸ ISO 9000</div>
            <div style="font-size:0.68rem;color:var(--muted);font-family:'Inconsolata',monospace">▸ ISO 9000-3 (szoftver)</div>
            <div style="font-size:0.68rem;color:var(--muted);font-family:'Inconsolata',monospace">▸ CMM/CMMI</div>
          </div>
        </div>
      </div>
      <div class="ibox"><strong>Különbség egy példán:</strong> Ha egy webshop lassan tölt be → ez TERMÉK minőségi probléma (ISO 25010 Efficiency). Ha a fejlesztési folyamatban nincs performance testing → ez FOLYAMAT minőségi probléma (ISO 9000 hiány). Mindkettő kell!</div>
    `
  },

  // ── 1. MCCALL BEVEZETŐ ───────────────────────────────────────────
  {
    model:1, chars:[],
    render:()=>`
      <div class="shdr"><div class="sico" style="border-color:rgba(245,158,11,0.5)">△</div>
        <div><div class="stitle">McCall féle minőségmodell</div>
        <div class="ssub">// General Electric, DoD, AirForce — 1977</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--mcc)">Oktató</div>
            A McCall modell a végterméket veszi alapul — nem a folyamatot. A General Electric fejlesztette a US Defense Department számára. Három szintet azonosít hierarchikusan.
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--iso25);text-align:right">Tanuló</div>
            Mi az a három szint?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--mcc)">Oktató</div>
            Három nézőpontból vizsgálja a szoftvert: hogyan MŰKÖDIK (operation), hogyan MÓDOSÍTHATÓ (revision), és hogyan VIHETŐ ÁT máshova (transition). Ez a McCall-háromszög.
          </div>
        </div>
      </div>
      <div class="triangle-vis">
        <div class="tv-hdr">// McCall minőségi háromszög — 3 nézőpont</div>
        <div class="tv-row">
          <div class="tv-side" style="color:var(--op);border-color:rgba(245,158,11,0.3)">OPERATION<br>Működés</div>
          <div class="tv-factors">
            <div class="tv-factor" style="background:rgba(245,158,11,0.1);color:var(--op);border-color:rgba(245,158,11,0.3)">Korrektség</div>
            <div class="tv-factor" style="background:rgba(245,158,11,0.1);color:var(--op);border-color:rgba(245,158,11,0.3)">Megbízhatóság</div>
            <div class="tv-factor" style="background:rgba(245,158,11,0.1);color:var(--op);border-color:rgba(245,158,11,0.3)">Hatékonyság</div>
            <div class="tv-factor" style="background:rgba(245,158,11,0.1);color:var(--op);border-color:rgba(245,158,11,0.3)">Biztonság</div>
            <div class="tv-factor" style="background:rgba(245,158,11,0.1);color:var(--op);border-color:rgba(245,158,11,0.3)">Használhatóság</div>
          </div>
        </div>
        <div class="tv-row">
          <div class="tv-side" style="color:var(--rev);border-color:rgba(59,130,246,0.3)">REVISION<br>Módosítás</div>
          <div class="tv-factors">
            <div class="tv-factor" style="background:rgba(59,130,246,0.1);color:var(--rev);border-color:rgba(59,130,246,0.3)">Karbantarthatóság</div>
            <div class="tv-factor" style="background:rgba(59,130,246,0.1);color:var(--rev);border-color:rgba(59,130,246,0.3)">Rugalmasság</div>
            <div class="tv-factor" style="background:rgba(59,130,246,0.1);color:var(--rev);border-color:rgba(59,130,246,0.3)">Tesztelhetőség</div>
          </div>
        </div>
        <div class="tv-row">
          <div class="tv-side" style="color:var(--tr);border-color:rgba(16,185,129,0.3)">TRANSITION<br>Átvitel</div>
          <div class="tv-factors">
            <div class="tv-factor" style="background:rgba(16,185,129,0.1);color:var(--tr);border-color:rgba(16,185,129,0.3)">Hordozhatóság</div>
            <div class="tv-factor" style="background:rgba(16,185,129,0.1);color:var(--tr);border-color:rgba(16,185,129,0.3)">Újrafelhasználhatóság</div>
            <div class="tv-factor" style="background:rgba(16,185,129,0.1);color:var(--tr);border-color:rgba(16,185,129,0.3)">Együttműkőd-képesség</div>
          </div>
        </div>
      </div>
      <div class="ibox" style="border-left-color:var(--mcc)"><strong>3 szint összefoglalva:</strong> Operation = a szoftver napjában 10x fut, stabilan? · Revision = ha bugot találnak, könnyen javítható? · Transition = átvihető más platformra vagy integrálható más rendszerrel?</div>

        <div style="display:grid;grid-template-columns:80px 1fr 1fr 60px;padding:0.4rem 0.65rem;gap:0.5rem;border-bottom:1px solid var(--brd);font-size:0.68rem;align-items:center">

          <div>Termék-alapú, 3 nézőpont</div>
          <div style="color:var(--muted);font-size:0.63rem">Operation / Revision / Transition</div>
          <div style="font-family:'Inconsolata',monospace;font-size:0.6rem;color:var(--muted)">1977</div>
        </div>
        <div style="display:grid;grid-template-columns:80px 1fr 1fr 60px;padding:0.4rem 0.65rem;gap:0.5rem;border-bottom:1px solid var(--brd);font-size:0.68rem;align-items:center">
          <div style="font-weight:700;color:var(--iso9)">ISO 9126</div>
          <div>Termék-alapú, részletes</div>
          <div style="color:var(--muted);font-size:0.63rem">6 jellemző + al-jellemzők + metrikák</div>
          <div style="font-family:'Inconsolata',monospace;font-size:0.6rem;color:var(--muted)">2001</div>
        </div>
        <div style="display:grid;grid-template-columns:80px 1fr 1fr 60px;padding:0.4rem 0.65rem;gap:0.5rem;border-bottom:1px solid var(--brd);font-size:0.68rem;align-items:center">
          <div style="font-weight:700;color:var(--iso25)">ISO 25010</div>
          <div>Termék-alapú, modern</div>
          <div style="color:var(--muted);font-size:0.63rem">8 jellemző (+Security, +Compatibility)</div>
          <div style="font-family:'Inconsolata',monospace;font-size:0.6rem;color:var(--muted)">2011</div>

          <div class="cli-i">6️⃣</div>
          <div><strong style="color:var(--iso9)">ISO 9126:</strong>
          <span>Funkcionalitás · Megbízhatóság · Használhatóság · Hatékonyság · Karbantarthatóság · Hordozhatóság</span></div>

    `
  },
];

function renderBoard(modelIdx, aktCharIdxs) {
  document.getElementById('modelSteps').innerHTML = MODELS.map((m,i) => {
    const on = i === modelIdx;
    const done = i < modelIdx;
    const cls = on ? 'active' : done ? 'done' : '';
    const c = on ? m.color : done ? m.color : 'var(--muted)';
    return `<div class="ms-item ${cls}">
      <div class="ms-dot" style="border-color:${c};color:${c}">${m.icon}</div>
      <div class="ms-label" style="color:${on?m.color:'var(--muted)'}">${m.label.replace('\n','<br>')}</div>
    </div>`;
  }).join('');

  document.getElementById('charPills').innerHTML = CHARS_9126.map((ch,i) => {
    const on = aktCharIdxs.includes(i);
    return `<div class="char-pill ${on?'on':''}" style="border-color:${ch.color};color:${ch.color}">${ch.label}</div>`;
  }).join('');
}

let cur = 0;

function render() {
  const s = STEPS[cur];
  renderBoard(s.model, s.chars);
  const el = document.getElementById('content');
  el.innerHTML = s.render();
  setTimeout(() => {
    el.querySelectorAll('.msg:not(.show)').forEach((m,i) => setTimeout(() => m.classList.add('show'), i*160));
  }, 60);
  document.getElementById('bprev').disabled = cur === 0;
  const bn = document.getElementById('bnext');
  bn.textContent = cur === STEPS.length-1 ? '↺ Újra' : 'Következő →';
  document.getElementById('ctr').textContent = `${cur+1} / ${STEPS.length}`;
}

function next() { cur = cur === STEPS.length-1 ? 0 : cur+1; render(); }
function prev() { if(cur>0){cur--;render();} }

render();
</script>
