<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCRUM Szimuláció</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');

:root {
  --bg:    #0a0f1e;
  --surf:  #0f1628;
  --card:  #141d35;
  --brd:   #1e2d50;
  --brd2:  #263a68;
  --text:  #d8e4ff;
  --muted: #4a5f8a;
  --dim:   #111830;

  /* Szerepkörök */
  --sm:   #f59e0b;   /* Scrum Master */
  --po:   #10b981;   /* Product Owner */
  --team: #3b82f6;   /* Team */
  --sh:   #8b5cf6;   /* Stakeholders */
  --mgr:  #6b7280;   /* Manager */

  /* Lépések */
  --spm:  #f59e0b;   /* Sprint Planning */
  --spr:  #3b82f6;   /* Sprint */
  --dm:   #10b981;   /* Daily Meeting */
  --rev:  #a855f7;   /* Sprint Review */
  --ret:  #ef4444;   /* Retrospective */

  /* Elemek */
  --pb:   #22d3ee;   /* Product Backlog */
  --sb:   #f97316;   /* Sprint Backlog */
  --bd:   #84cc16;   /* Burndown */
  --fw:   #10b981;   /* Finished Work */
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:'Sora', sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(245,158,11,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(59,130,246,0.05) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

/* ── HEADER ── */
header {
  position:relative; z-index:1;
  padding:1.2rem 1.3rem 0.85rem;
  border-bottom:1px solid var(--brd2);
  background:linear-gradient(180deg, rgba(245,158,11,0.05) 0%, transparent 100%);
}

.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }

h1 { font-size:1.4rem; font-weight:800; line-height:1.07; letter-spacing:-0.02em; }
h1 span { color:var(--sm); }
h1 em   { font-style:normal; color:var(--team); }

.tag {
  font-family:'Inconsolata', monospace; font-size:0.56rem;
  padding:0.25rem 0.55rem; border-radius:4px;
  background:rgba(245,158,11,0.12); color:var(--sm);
  border:1px solid rgba(245,158,11,0.28); white-space:nowrap; margin-top:0.2rem;
}

header p { font-size:0.7rem; color:var(--muted); margin-top:0.25rem; font-family:'Inconsolata', monospace; }

/* ── SCRUM BOARD (top visualizer) ── */
.sboard {
  position:relative; z-index:1;
  background:var(--surf);
  border-bottom:1px solid var(--brd2);
  padding:0.75rem 1.3rem 0.65rem;
}

.sb-title {
  font-family:'Inconsolata', monospace; font-size:0.54rem;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.09em;
  margin-bottom:0.55rem;
}

/* Sprint progress row */
.sprint-steps {
  display:flex; align-items:center; gap:0; margin-bottom:0.5rem;
}

.ss-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:0.2rem;
  position:relative;
}

.ss-item:not(:last-child)::after {
  content:'';
  position:absolute; right:0; top:12px;
  width:50%; height:2px;
  background:var(--brd);
  z-index:0;
}

.ss-item:not(:first-child)::before {
  content:'';
  position:absolute; left:0; top:12px;
  width:50%; height:2px;
  background:var(--brd);
  z-index:0;
}

.ss-dot {
  width:24px; height:24px; border-radius:50%;
  border:2px solid var(--brd2); background:var(--card);
  display:flex; align-items:center; justify-content:center;
  font-size:0.65rem; z-index:1; transition:all 0.4s;
  position:relative;
}

.ss-label {
  font-family:'Inconsolata', monospace; font-size:0.5rem;
  color:var(--muted); text-align:center; line-height:1.2;
}

.ss-item.active .ss-dot { transform:scale(1.2); box-shadow:0 0 10px currentColor; }
.ss-item.done   .ss-dot { opacity:0.7; }
.ss-item.active .ss-label { font-weight:600; }

/* Roles mini display */
.roles-mini {
  display:flex; gap:4px; flex-wrap:wrap;
}

.role-chip {
  display:flex; align-items:center; gap:0.25rem;
  padding:0.18rem 0.5rem; border-radius:20px;
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  font-weight:600; border:1px solid; transition:all 0.35s;
  opacity:0.28;
}
.role-chip.on { opacity:1; }

/* ── CONTENT ── */
.content {
  position:relative; z-index:1;
  padding:0.9rem 1.3rem;
  min-height:275px;
}

.shdr { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.85rem; }

.sico {
  width:36px; height:36px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:1rem; flex-shrink:0;
  border:1.5px solid var(--brd2); background:var(--card);
}

.stitle { font-size:0.95rem; font-weight:800; letter-spacing:-0.02em; }
.ssub   { font-family:'Inconsolata', monospace; font-size:0.56rem; color:var(--muted); margin-top:0.03rem; }

/* CHAT */
.chat { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.7rem; }

.msg {
  display:flex; gap:0.4rem; align-items:flex-start;
  opacity:0; transform:translateY(6px);
  transition:opacity 0.3s, transform 0.3s;
}
.msg.show { opacity:1; transform:translateY(0); }
.msg.r { flex-direction:row-reverse; }

.av {
  width:30px; height:30px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  font-size:0.9rem; flex-shrink:0;
  border:1px solid var(--brd2); background:var(--card);
}

.bub {
  max-width:82%; padding:0.48rem 0.68rem;
  border-radius:9px; font-size:0.77rem; line-height:1.55;
  border:1px solid var(--brd2); background:var(--card);
}
.bub.l  { border-bottom-left-radius:2px; }
.bub.r2 { border-bottom-right-radius:2px; text-align:right; }

.who {
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  font-weight:600; text-transform:uppercase; letter-spacing:0.05em;
  margin-bottom:0.1rem;
}

/* ROLE CARD — big */
.role-card {
  border-radius:11px; padding:0.85rem 1rem;
  margin-bottom:0.7rem; border:2px solid;
  display:flex; gap:0.7rem; align-items:flex-start;
}

.rc-icon { font-size:1.8rem; flex-shrink:0; }
.rc-badge {
  font-family:'Inconsolata', monospace; font-size:0.57rem;
  font-weight:600; text-transform:uppercase; letter-spacing:0.06em;
  margin-bottom:0.25rem; opacity:0.8;
}
.rc-name  { font-size:0.98rem; font-weight:800; margin-bottom:0.3rem; letter-spacing:-0.02em; }
.rc-desc  { font-size:0.75rem; line-height:1.6; color:rgba(216,228,255,0.85); }
.rc-list  { margin-top:0.4rem; display:flex; flex-direction:column; gap:0.15rem; }
.rc-item  { font-size:0.7rem; color:rgba(200,215,255,0.75); font-family:'Inconsolata', monospace; }
.rc-item::before { content:'▸ '; opacity:0.6; }

/* ELEMENT CARD */
.elem-card {
  border-radius:10px; padding:0.75rem 0.85rem;
  margin:0.45rem 0; border:1.5px solid;
}
.ec-hdr { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem; }
.ec-icon { font-size:1.1rem; }
.ec-name { font-size:0.85rem; font-weight:800; letter-spacing:-0.01em; }
.ec-badge { font-family:'Inconsolata', monospace; font-size:0.53rem; padding:0.1rem 0.4rem; border-radius:3px; border:1px solid; font-weight:600; }
.ec-desc { font-size:0.74rem; line-height:1.55; color:rgba(216,228,255,0.82); }

/* BACKLOG VISUAL */
.backlog-vis {
  background:var(--card); border:1.5px solid var(--brd2);
  border-radius:9px; overflow:hidden; margin:0.45rem 0;
}

.bv-hdr {
  font-family:'Inconsolata', monospace; font-size:0.56rem; color:var(--muted);
  padding:0.3rem 0.7rem; border-bottom:1px solid var(--brd);
  background:var(--surf); display:flex; align-items:center; gap:0.4rem;
  text-transform:uppercase; letter-spacing:0.07em;
}
.bv-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }

.bv-item {
  display:flex; align-items:center; gap:0.5rem;
  padding:0.38rem 0.7rem; border-bottom:1px solid var(--brd);
  font-size:0.72rem; transition:all 0.3s;
}
.bv-item:last-child { border-bottom:none; }

.bv-pri {
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  width:22px; flex-shrink:0; text-align:center; font-weight:700;
}

.bv-name { flex:1; }

.bv-pts {
  font-family:'Inconsolata', monospace; font-size:0.58rem;
  padding:0.1rem 0.4rem; border-radius:3px;
  background:rgba(255,255,255,0.06); color:var(--muted);
  border:1px solid var(--brd);
}

.bv-item.selected { background:rgba(59,130,246,0.08); }
.bv-item.done { opacity:0.4; }
.bv-item.done .bv-name { text-decoration:line-through; }

/* BURNDOWN */
.burndown {
  background:var(--card); border:1.5px solid var(--brd2);
  border-radius:9px; padding:0.7rem; margin:0.45rem 0;
}

.bd-title {
  font-family:'Inconsolata', monospace; font-size:0.56rem;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.07em;
  margin-bottom:0.5rem;
}

.bd-chart {
  display:flex; align-items:flex-end; gap:4px; height:55px;
}

.bd-bar-group { display:flex; align-items:flex-end; gap:2px; flex:1; }

.bd-bar-ideal { flex:1; border-radius:2px 2px 0 0; background:rgba(59,130,246,0.25); border:1px solid rgba(59,130,246,0.4); }
.bd-bar-actual { flex:1; border-radius:2px 2px 0 0; background:rgba(34,197,94,0.3); border:1px solid rgba(34,197,94,0.5); }

.bd-labels {
  display:flex; gap:4px; margin-top:4px;
}
.bd-lbl { flex:1; font-family:'Inconsolata', monospace; font-size:0.45rem; color:var(--muted); text-align:center; }

/* DAILY 3 QUESTIONS */
.daily-q {
  background:var(--card); border:1.5px solid var(--brd2);
  border-radius:9px; padding:0.65rem 0.75rem; margin:0.45rem 0;
}
.dq-hdr { font-family:'Inconsolata', monospace; font-size:0.57rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:0.45rem; }

.dq-item {
  display:flex; gap:0.5rem; padding:0.38rem 0;
  border-bottom:1px solid var(--brd); font-size:0.75rem;
}
.dq-item:last-child { border-bottom:none; }
.dq-num { font-family:'Inconsolata', monospace; font-size:0.6rem; font-weight:700; flex-shrink:0; margin-top:0.05rem; width:18px; }
.dq-q   { font-weight:700; margin-bottom:0.08rem; font-size:0.76rem; }
.dq-a   { font-size:0.69rem; color:var(--muted); font-family:'Inconsolata', monospace; }

/* INFO BOX */
.ibox {
  border-radius:8px; padding:0.55rem 0.75rem;
  font-size:0.74rem; line-height:1.55; margin:0.45rem 0;
  border:1px solid var(--brd2); background:var(--card);
  border-left:3px solid var(--sm);
}
.ibox strong { font-weight:700; }
.ibox.po-b  { border-left-color:var(--po); }
.ibox.po-b strong  { color:var(--po); }
.ibox.tm-b  { border-left-color:var(--team); }
.ibox.tm-b strong  { color:var(--team); }
.ibox.sh-b  { border-left-color:var(--sh); }
.ibox.sh-b strong  { color:var(--sh); }
.ibox.ret-b { border-left-color:var(--ret); }
.ibox.ret-b strong { color:var(--ret); }

/* CHECKLIST */
.cklist { display:flex; flex-direction:column; gap:0.35rem; margin:0.45rem 0; }
.cli {
  display:flex; align-items:flex-start; gap:0.5rem;
  padding:0.42rem 0.65rem; background:var(--card);
  border:1px solid var(--brd2); border-radius:8px;
  font-size:0.75rem; line-height:1.45;
}
.cli-i { flex-shrink:0; font-size:0.88rem; }
.cli strong { display:block; font-weight:700; font-size:0.76rem; margin-bottom:0.03rem; }
.cli span   { color:var(--muted); font-size:0.68rem; font-family:'Inconsolata', monospace; }

/* SUMGRID */
.sumgrid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }
.sbox { background:var(--card); border:1px solid var(--brd2); border-radius:8px; padding:0.6rem; text-align:center; }
.sbox .ico { font-size:1.2rem; display:block; margin-bottom:0.15rem; }
.sbox .val { font-size:0.88rem; font-weight:800; }
.sbox .lbl { font-family:'Inconsolata', monospace; font-size:0.52rem; color:var(--muted); margin-top:0.04rem; }

/* PIG/CHICKEN visual */
.pc-row { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }
.pc-box { border-radius:9px; padding:0.65rem; border:1.5px solid; }
.pc-title { font-size:0.8rem; font-weight:800; margin-bottom:0.15rem; }
.pc-sub { font-family:'Inconsolata', monospace; font-size:0.58rem; margin-bottom:0.25rem; opacity:0.75; }
.pc-members { display:flex; flex-direction:column; gap:0.15rem; }
.pc-m { font-size:0.7rem; display:flex; align-items:center; gap:0.3rem; }

/* NAV */
.nav {
  position:sticky; bottom:0; z-index:10;
  background:var(--bg); border-top:1px solid var(--brd2);
  padding:0.7rem 1.3rem; display:flex; align-items:center; gap:0.5rem;
}
.btn {
  font-family:'Inconsolata', monospace; font-size:0.63rem; font-weight:600;
  padding:0.52rem 1rem; border-radius:7px; cursor:pointer;
  transition:all 0.18s; text-transform:uppercase; letter-spacing:0.04em;
}
.btnp { background:transparent; color:var(--muted); border:1px solid var(--brd2); }
.btnp:hover { color:var(--text); }
.btnp:disabled { opacity:0.2; cursor:not-allowed; }
.btnn { flex:1; background:rgba(245,158,11,0.12); color:var(--sm); border:1px solid rgba(245,158,11,0.3); }
.btnn:hover { background:rgba(245,158,11,0.22); }
.ctr { font-family:'Inconsolata', monospace; font-size:0.57rem; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <h1><span>SCRUM</span><br>Szimuláció<br><em>2.7.2</em></h1>
    <div class="tag">1986 // Takeuchi &amp; Nonaka</div>
  </div>
  <p>// Szerepkörök · Elemek · Lépések</p>
</header>

<!-- SCRUM BOARD -->
<div class="sboard">
  <div class="sb-title">// SCRUM sprint folyamat — aktuális fázis</div>

  <div class="sprint-steps" id="sprintSteps"></div>

  <div class="roles-mini" id="rolesMini"></div>
</div>

<div class="content" id="content"></div>

<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 18</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>

<script>
const SPRINT_STEPS = [
  { label:'Sprint\nPlanning', color:'var(--spm)', icon:'📋' },
  { label:'Sprint\n(1-4 hét)', color:'var(--spr)', icon:'🏃' },
  { label:'Daily\nMeeting', color:'var(--dm)', icon:'☀️' },
  { label:'Sprint\nReview', color:'var(--rev)', icon:'🎯' },
  { label:'Sprint\nRetro', color:'var(--ret)', icon:'🪞' },
];

const ROLES = [
  { label:'Scrum Master', color:'var(--sm)', icon:'🦁' },
  { label:'Product Owner', color:'var(--po)', icon:'💼' },
  { label:'Team', color:'var(--team)', icon:'👥' },
  { label:'Stakeholders', color:'var(--sh)', icon:'🏢' },
  { label:'Manager', color:'var(--mgr)', icon:'📊' },
];

// Backlog stories
const STORIES = [
  { pri:1, name:'Felhasználói bejelentkezés', pts:5, st:'todo' },
  { pri:2, name:'Termék lista oldal', pts:8, st:'todo' },
  { pri:3, name:'Kosár funkció', pts:13, st:'todo' },
  { pri:4, name:'Fizetési folyamat', pts:8, st:'todo' },
  { pri:5, name:'Rendelés követés', pts:5, st:'todo' },
  { pri:6, name:'Admin felület', pts:13, st:'todo' },
];

function backlogHtml(selectedIdxs, doneIdxs) {
  return `<div class="backlog-vis">
    <div class="bv-hdr"><div class="bv-dot" style="background:var(--pb)"></div>Product Backlog — priorizált lista</div>
    ${STORIES.map((s,i) => {
      const isDone = doneIdxs && doneIdxs.includes(i);
      const isSel  = selectedIdxs && selectedIdxs.includes(i);
      return `<div class="bv-item ${isDone?'done':''} ${isSel&&!isDone?'selected':''}">
        <div class="bv-pri" style="color:${isDone?'var(--muted)':'var(--po)'}">P${s.pri}</div>
        <div class="bv-name">${isDone?'✓ ':''} ${s.name}</div>
        <div class="bv-pts">${s.pts}sp</div>
      </div>`;
    }).join('')}
  </div>`;
}

function burndownHtml(day) {
  // ideal: 26→22→18→14→10→6→2→0, actual varies
  const ideal  = [26,22,18,14,10, 6, 2, 0];
  const actual = [26,24,19,16,11, 7, 3, 0];
  const maxH = 48;
  const bars = ideal.map((v,i) => {
    if (i > day) return `<div class="bd-bar-group" style="opacity:0.2"><div class="bd-bar-ideal" style="height:${v/26*maxH}px"></div><div class="bd-bar-actual" style="height:${actual[i]/26*maxH}px"></div></div>`;
    return `<div class="bd-bar-group"><div class="bd-bar-ideal" style="height:${v/26*maxH}px"></div><div class="bd-bar-actual" style="height:${actual[i]/26*maxH}px"></div></div>`;
  }).join('');
  const labels = ['H','K','Sz','Cs','P','Sz','V','V+'].map(l=>`<div class="bd-lbl">${l}</div>`).join('');
  return `<div class="burndown">
    <div class="bd-title">// Burndown chart — hátralévő story pointok naponta</div>
    <div class="bd-chart">${bars}</div>
    <div class="bd-labels">
      <div style="width:36px;flex-shrink:0"></div>
      ${labels}
    </div>
    <div style="display:flex;gap:0.8rem;margin-top:0.35rem;font-family:'Inconsolata',monospace;font-size:0.52rem;color:var(--muted)">
      <span><span style="color:rgba(59,130,246,0.7)">■</span> Ideális ütem</span>
      <span><span style="color:rgba(34,197,94,0.7)">■</span> Tényleges haladás</span>
    </div>
  </div>`;
}

const STEPS = [
  // ── 0. BEVEZETŐ ─────────────────────────────────────────────────
  {
    step:-1, roles:[],
    render:()=>`
      <div class="shdr"><div class="sico">🏉</div>
        <div><div class="stitle">Mi a SCRUM?</div>
        <div class="ssub">// 1986, Takeuchi & Nonaka — rugbyből merítve</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--sm)">Oktató</div>
            Két japán professzor tanulmányozta, hogy bizonyos cégek miért fejlesztenek annyival gyorsabban és jobb minőségben mint a többiek. 1986-ban publikálták az eredményt — ez lett a SCRUM.
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--team);text-align:right">Tanuló</div>
            Miért hívják SCRUM-nak?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--sm)">Oktató</div>
            A rugby-ból! A "scrum" a dulakodást jelenti — ahol az egész csapat összezárul és együtt nyomul előre. Pontosan ilyen a SCRUM csapatmunkája is.
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.45s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--team);text-align:right">Tanuló</div>
            Miben más mint a hagyományos fejlesztés?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.6s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--sm)">Oktató</div>
            3 dolog: rövid sprint ciklusok, napi kommunikáció, és az ügyfél folyamatosan bevonva. Eredmény: iteratív, inkrementális, adaptív fejlesztés.
          </div>
        </div>
      </div>

// ── RENDER BOARD ─────────────────────────────────────────────────────
function renderBoard(activeStep, activeRoles) {
  // Sprint steps
  document.getElementById('sprintSteps').innerHTML = SPRINT_STEPS.map((s,i) => {
    const cls = i === activeStep ? 'active' : activeStep > i ? 'done' : '';
    const c = i === activeStep ? s.color : activeStep > i ? s.color : 'var(--muted)';
    return `<div class="ss-item ${cls}">
      <div class="ss-dot" style="border-color:${c};color:${c};${i===activeStep?'color:'+s.color:''}">${s.icon}</div>
      <div class="ss-label" style="color:${i===activeStep?s.color:'var(--muted)'}">${s.label.replace('\n','<br>')}</div>
    </div>`;
  }).join('');

  // Roles mini
  document.getElementById('rolesMini').innerHTML = ROLES.map((r,i) => {
    const on = activeRoles.includes(i);
    return `<div class="role-chip ${on?'on':''}" style="border-color:${r.color};color:${r.color}">
      ${r.icon} ${r.label}
    </div>`;
  }).join('');
}

let cur = 0;

function render() {
  const s = STEPS[cur];
  renderBoard(s.step, s.roles);

  const el = document.getElementById('content');
  el.innerHTML = s.render();

  setTimeout(() => {
    el.querySelectorAll('.msg:not(.show)').forEach((m, i) => {
      setTimeout(() => m.classList.add('show'), i * 160);
    });
  }, 60);

  document.getElementById('bprev').disabled = cur === 0;
  const bn = document.getElementById('bnext');
  bn.textContent = cur === STEPS.length - 1 ? '↺ Újra' : 'Következő →';
  document.getElementById('ctr').textContent = `${cur + 1} / ${STEPS.length}`;
}

function next() { cur = cur === STEPS.length - 1 ? 0 : cur + 1; render(); }
function prev() { if (cur > 0) { cur--; render(); } }

render();
</script>
