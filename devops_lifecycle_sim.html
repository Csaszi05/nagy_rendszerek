<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Életciklus Szimuláció</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');

:root {
  --bg:    #0a0f1e;
  --surf:  #0f1628;
  --card:  #141d35;
  --brd:   #1e2d50;
  --brd2:  #263a68;
  --text:  #d8e4ff;
  --muted: #4a5f8a;

  --plan:    #f59e0b;
  --code:    #3b82f6;
  --build:   #6366f1;
  --test:    #a855f7;
  --release: #10b981;
  --deploy:  #22d3ee;
  --operate: #f97316;
  --monitor: #ef4444;

  --dev: #3b82f6;
  --ops: #10b981;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:'Sora', sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(16,185,129,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(59,130,246,0.05) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

header {
  position:relative; z-index:1;
  padding:1.2rem 1.3rem 0.85rem;
  border-bottom:1px solid var(--brd2);
  background:linear-gradient(180deg, rgba(16,185,129,0.05) 0%, transparent 100%);
}

.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }
h1 { font-size:1.4rem; font-weight:800; line-height:1.07; letter-spacing:-0.02em; }
h1 span { color:var(--release); }
h1 em   { font-style:normal; color:var(--deploy); }
.tag {
  font-family:'Inconsolata', monospace; font-size:0.56rem;
  padding:0.25rem 0.55rem; border-radius:4px;
  background:rgba(16,185,129,0.12); color:var(--release);
  border:1px solid rgba(16,185,129,0.28); white-space:nowrap; margin-top:0.2rem;
}
header p { font-size:0.7rem; color:var(--muted); margin-top:0.25rem; font-family:'Inconsolata', monospace; }

/* PIPELINE TOP BAR */
.pboard {
  position:relative; z-index:1;
  background:var(--surf);
  border-bottom:1px solid var(--brd2);
  padding:0.75rem 1.3rem 0.65rem;
}
.pb-title {
  font-family:'Inconsolata', monospace; font-size:0.54rem;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.09em;
  margin-bottom:0.55rem;
}

.pipeline {
  display:flex; align-items:center; gap:0;
}

.pl-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:0.2rem;
  position:relative;
}
.pl-item:not(:last-child)::after {
  content:''; position:absolute; right:0; top:14px;
  width:50%; height:2px; background:var(--brd); z-index:0;
}
.pl-item:not(:first-child)::before {
  content:''; position:absolute; left:0; top:14px;
  width:50%; height:2px; background:var(--brd); z-index:0;
}
.pl-dot {
  width:28px; height:28px; border-radius:50%;
  border:2px solid var(--brd2); background:var(--card);
  display:flex; align-items:center; justify-content:center;
  font-size:0.65rem; z-index:1; transition:all 0.4s; position:relative;
}
.pl-label {
  font-family:'Inconsolata', monospace; font-size:0.46rem;
  color:var(--muted); text-align:center; line-height:1.2;
}
.pl-item.active .pl-dot { transform:scale(1.3); box-shadow:0 0 14px currentColor; }
.pl-item.done   .pl-dot { opacity:0.55; }
.pl-item.active .pl-label { font-weight:700; font-size:0.5rem; }

/* DEV/OPS divider */
.devops-divider {
  display:flex; gap:0.3rem; align-items:center; margin-top:0.45rem;
}
.dv-bar { height:4px; border-radius:2px; flex:4; }
.dv-label { font-family:'Inconsolata', monospace; font-size:0.5rem; font-weight:700; }

/* CONTENT */
.content {
  position:relative; z-index:1;
  padding:0.9rem 1.3rem;
  min-height:280px;
}

.shdr { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.85rem; }
.sico {
  width:36px; height:36px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:1rem; flex-shrink:0;
  border:1.5px solid var(--brd2); background:var(--card);
}
.stitle { font-size:0.95rem; font-weight:800; letter-spacing:-0.02em; }
.ssub   { font-family:'Inconsolata', monospace; font-size:0.56rem; color:var(--muted); margin-top:0.03rem; }

/* CHAT */
.chat { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.7rem; }
.msg {
  display:flex; gap:0.4rem; align-items:flex-start;
  opacity:0; transform:translateY(6px);
  transition:opacity 0.3s, transform 0.3s;
}
.msg.show { opacity:1; transform:translateY(0); }
.msg.r { flex-direction:row-reverse; }
.av {
  width:30px; height:30px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  font-size:0.9rem; flex-shrink:0;
  border:1px solid var(--brd2); background:var(--card);
}
.bub {
  max-width:82%; padding:0.48rem 0.68rem;
  border-radius:9px; font-size:0.77rem; line-height:1.55;
  border:1px solid var(--brd2); background:var(--card);
}
.bub.l  { border-bottom-left-radius:2px; }
.bub.r2 { border-bottom-right-radius:2px; text-align:right; }
.who {
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  font-weight:600; text-transform:uppercase; letter-spacing:0.05em;
  margin-bottom:0.1rem;
}

/* PHASE DETAIL CARD */
.phase-detail {
  border-radius:12px; padding:0.85rem 1rem;
  margin-bottom:0.6rem; border:2px solid;
}
.pd-header { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.5rem; }
.pd-icon { font-size:2rem; }
.pd-num {
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  font-weight:700; opacity:0.6; letter-spacing:0.06em;
}
.pd-name { font-size:1rem; font-weight:800; letter-spacing:-0.02em; }
.pd-side {
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  padding:0.12rem 0.5rem; border-radius:3px; border:1px solid; font-weight:700;
  margin-left:auto;
}
.pd-desc { font-size:0.75rem; line-height:1.6; color:rgba(216,228,255,0.85); margin-bottom:0.4rem; }

/* TOOL PILLS */
.tool-pills { display:flex; flex-wrap:wrap; gap:0.3rem; margin-top:0.3rem; }
.tp {
  font-family:'Inconsolata', monospace; font-size:0.56rem;
  padding:0.18rem 0.5rem; border-radius:4px; border:1px solid;
  font-weight:600;
}

/* CHECKLIST */
.cklist { display:flex; flex-direction:column; gap:0.35rem; margin:0.45rem 0; }
.cli {
  display:flex; align-items:flex-start; gap:0.5rem;
  padding:0.42rem 0.65rem; background:var(--card);
  border:1px solid var(--brd2); border-radius:8px;
  font-size:0.75rem; line-height:1.45;
}
.cli-i { flex-shrink:0; font-size:0.88rem; }
.cli strong { display:block; font-weight:700; font-size:0.76rem; margin-bottom:0.03rem; }
.cli span   { color:var(--muted); font-size:0.68rem; font-family:'Inconsolata', monospace; }

/* INFO BOX */
.ibox {
  border-radius:8px; padding:0.55rem 0.75rem;
  font-size:0.74rem; line-height:1.55; margin:0.45rem 0;
  border:1px solid var(--brd2); background:var(--card);
  border-left:3px solid var(--release);
}
.ibox strong { font-weight:700; }

/* PIPELINE FLOW VISUAL */
.flow-vis {
  background:var(--card); border:1.5px solid var(--brd2);
  border-radius:9px; padding:0.7rem; margin:0.45rem 0;
}
.fv-title {
  font-family:'Inconsolata', monospace; font-size:0.54rem;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.07em;
  margin-bottom:0.5rem;
}
.fv-row { display:flex; align-items:center; gap:0.3rem; margin:0.3rem 0; font-size:0.7rem; }
.fv-step {
  padding:0.3rem 0.5rem; border-radius:6px; font-family:'Inconsolata', monospace;
  font-size:0.58rem; font-weight:700; border:1px solid; flex-shrink:0;
}
.fv-arrow { color:var(--muted); font-size:0.7rem; flex-shrink:0; }
.fv-desc { font-size:0.68rem; color:var(--muted); }
.fv-ok { color:#22c55e; font-weight:700; margin-left:auto; font-family:'Inconsolata', monospace; font-size:0.6rem; flex-shrink:0; }

/* SUMGRID */
.sumgrid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }
.sbox { background:var(--card); border:1px solid var(--brd2); border-radius:8px; padding:0.6rem; text-align:center; }
.sbox .ico { font-size:1.2rem; display:block; margin-bottom:0.15rem; }
.sbox .val { font-size:0.88rem; font-weight:800; }
.sbox .lbl { font-family:'Inconsolata', monospace; font-size:0.52rem; color:var(--muted); margin-top:0.04rem; }

/* VS GRID */
.vs-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }

/* NAV */
.nav {
  position:sticky; bottom:0; z-index:10;
  background:var(--bg); border-top:1px solid var(--brd2);
  padding:0.7rem 1.3rem; display:flex; align-items:center; gap:0.5rem;
}
.btn {
  font-family:'Inconsolata', monospace; font-size:0.63rem; font-weight:600;
  padding:0.52rem 1rem; border-radius:7px; cursor:pointer;
  transition:all 0.18s; text-transform:uppercase; letter-spacing:0.04em;
}
.btnp { background:transparent; color:var(--muted); border:1px solid var(--brd2); }
.btnp:hover { color:var(--text); }
.btnp:disabled { opacity:0.2; cursor:not-allowed; }
.btnn { flex:1; background:rgba(16,185,129,0.12); color:var(--release); border:1px solid rgba(16,185,129,0.3); }
.btnn:hover { background:rgba(16,185,129,0.22); }
.ctr { font-family:'Inconsolata', monospace; font-size:0.57rem; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <h1><span>DevOps</span><br>Életciklus<br><em>Pipeline</em></h1>
    <div class="tag">8 fázis // Plan → Monitor</div>
  </div>
  <p>// Plan · Code · Build · Test · Release · Deploy · Operate · Monitor</p>
</header>

<div class="pboard">
  <div class="pb-title">// DevOps életciklus — aktuális fázis</div>
  <div class="pipeline" id="pipeline"></div>
  <div class="devops-divider" id="devopsDivider"></div>
</div>

<div class="content" id="content"></div>

<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 14</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>

<script>
const PHASES = [
  { label:'Plan',    color:'var(--plan)',    icon:'📋', side:'Dev' },
  { label:'Code',    color:'var(--code)',    icon:'💻', side:'Dev' },
  { label:'Build',   color:'var(--build)',   icon:'🔨', side:'Dev' },
  { label:'Test',    color:'var(--test)',    icon:'🧪', side:'Dev' },
  { label:'Release', color:'var(--release)', icon:'📦', side:'Ops' },
  { label:'Deploy',  color:'var(--deploy)',  icon:'🚀', side:'Ops' },
  { label:'Operate', color:'var(--operate)', icon:'⚙️', side:'Ops' },
  { label:'Monitor', color:'var(--monitor)', icon:'📊', side:'Ops' },
];

const STEPS = [

  // ── 0. BEVEZETŐ ──────────────────────────────────────────────────
  {
    active:-1,
    render:()=>`
      <div class="shdr"><div class="sico">♾️</div>
        <div><div class="stitle">A DevOps életciklus</div>
        <div class="ssub">// ciklikusan ismétlődő — 8 fázis, 2 oldal</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--release)">Oktató</div>
            A DevOps életciklus alapvetően egy ciklikusan ismétlődő szekvenciális modell. Két részből áll: Dev (fejlesztési) oldal és Ops (üzemeltetési) oldal — és 8 fázisból.
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--dev);text-align:right">Tanuló</div>
            Mitől más, mint a hagyományos fejlesztési modell?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--release)">Oktató</div>
            Nincs külön analízis fázis! A tervezés mellett külön van az építés. A kódolásnak kiemeltebb szerepe van. Nincs külön integráció — azt a CI kezeli automatikusan. Áthelyeződnek a hangsúlyok.
          </div>
        </div>
      </div>
      <div class="flow-vis">
        <div class="fv-title">// A teljes ciklus — Dev → Ops → visszacsatolás</div>
        <div class="fv-row">
          <div class="fv-step" style="background:rgba(59,130,246,0.1);color:var(--dev);border-color:rgba(59,130,246,0.3)">DEV OLDAL</div>
          <div class="fv-arrow">→</div>
          <div style="font-size:0.65rem;color:var(--muted)">Plan → Code → Build → Test</div>
        </div>
        <div class="fv-row">
          <div class="fv-step" style="background:rgba(16,185,129,0.1);color:var(--ops);border-color:rgba(16,185,129,0.3)">OPS OLDAL</div>
          <div class="fv-arrow">→</div>
          <div style="font-size:0.65rem;color:var(--muted)">Release → Deploy → Operate → Monitor</div>
        </div>
        <div class="fv-row">
          <div class="fv-step" style="background:rgba(249,115,22,0.1);color:var(--operate);border-color:rgba(249,115,22,0.3)">VISSZACSATOLÁS</div>
          <div class="fv-arrow">→</div>
          <div style="font-size:0.65rem;color:var(--muted)">Monitor → Plan (a kör bezárul)</div>
        </div>
      </div>
      <div class="ibox"><strong>Eltérések a hagyományostól:</strong> Nincs külön analízis. Nincs külön integráció (CI). A kódolás kiemelkedő szerepű. A monitoring visszavezet a tervezéshez — folyamatos javulás.</div>
    `
  },

  // ── 1. PLAN ──────────────────────────────────────────────────────
  {
    active:0,
    render:()=>`
      <div class="shdr">
        <div class="sico" style="border-color:rgba(245,158,11,0.5)">📋</div>
        <div><div class="stitle">1. Plan — Tervezés</div>
        <div class="ssub">// fázis 1/8 · Dev oldal · az alapok lerakása</div></div>
      </div>
      <div class="phase-detail" style="background:rgba(245,158,11,0.05);border-color:rgba(245,158,11,0.35)">
        <div class="pd-header">
          <div class="pd-icon">📋</div>
          <div>
            <div class="pd-num">FÁZIS 01/08 — DEV</div>
            <div class="pd-name" style="color:var(--plan)">Plan — Tervezés</div>
          </div>
          <div class="pd-side" style="background:rgba(59,130,246,0.1);color:var(--dev);border-color:rgba(59,130,246,0.3)">Dev</div>
        </div>
        <div class="pd-desc">Az egész fejlesztési ciklus kezdőpontja. Ez az a fázis, ahol meghatározzuk, mit fogunk fejleszteni, milyen sorrendben, milyen erőforrásokkal. Az agilis csapatoknál ez sprint tervezést is jelent.</div>
        <div class="cklist" style="margin:0">
          <div class="cli" style="border-left:3px solid var(--plan)">
            <div class="cli-i">📝</div>
            <div><strong>Követelmény elemzés</strong>
            <span>Üzleti igények, user story-k összegyűjtése. Mit akar az ügyfél? Mi a prioritás?</span></div>
          </div>
          <div class="cli" style="border-left:3px solid var(--plan)">
            <div class="cli-i">🗓️</div>
            <div><strong>Sprint / iteráció tervezés</strong>
            <span>Sprint backlog összeállítása. Feladatok kiosztása csapattagoknak. Kapacitás becslés.</span></div>
          </div>
          <div class="cli" style="border-left:3px solid var(--plan)">
            <div class="cli-i">🎯</div>
            <div><strong>Sprint cél meghatározása</strong>
            <span>Mi az adott sprint egyértelmű, mérhető célja? Mi lesz "done" a sprint végén?</span></div>
          </div>
        </div>
        <div class="tool-pills">
          <div class="tp" style="background:rgba(245,158,11,0.1);color:var(--plan);border-color:rgba(245,158,11,0.3)">Jira</div>
          <div class="tp" style="background:rgba(245,158,11,0.1);color:var(--plan);border-color:rgba(245,158,11,0.3)">Confluence</div>
          <div class="tp" style="background:rgba(245,158,11,0.1);color:var(--plan);border-color:rgba(245,158,11,0.3)">Linear</div>
          <div class="tp" style="background:rgba(245,158,11,0.1);color:var(--plan);border-color:rgba(245,158,11,0.3)">Trello</div>
          <div class="tp" style="background:rgba(245,158,11,0.1);color:var(--plan);border-color:rgba(245,158,11,0.3)">ServiceNow</div>
        </div>
      </div>
      <div class="ibox" style="border-left-color:var(--plan)"><strong>DevSecOps kiegészítés:</strong> A Plan fázisban a biztonsági architekt is részt vesz — Threat Modelling-et végez. Még mielőtt egy sor kód születne, azonosítják a lehetséges biztonsági kockázatokat.</div>
    `
  },

  // ── 2. CODE ──────────────────────────────────────────────────────
  {
    active:1,
    render:()=>`
      <div class="shdr">
        <div class="sico" style="border-color:rgba(59,130,246,0.5)">💻</div>
        <div><div class="stitle">2. Code — Kódolás</div>
        <div class="ssub">// fázis 2/8 · Dev oldal · kód születik</div></div>
      </div>
      <div class="phase-detail" style="background:rgba(59,130,246,0.05);border-color:rgba(59,130,246,0.35)">
        <div class="pd-header">
          <div class="pd-icon">💻</div>
          <div>
            <div class="pd-num">FÁZIS 02/08 — DEV</div>
            <div class="pd-name" style="color:var(--code)">Code — Kódolás</div>
          </div>
          <div class="pd-side" style="background:rgba(59,130,246,0.1);color:var(--dev);border-color:rgba(59,130,246,0.3)">Dev</div>
        </div>
        <div class="pd-desc">A fejlesztők megírják a kódot. A DevOps-ban a kódolás szorosan összefonódik a verziókezeléssel — minden változtatás azonnal nyomon követhető és visszaállítható.</div>
        <div class="cklist" style="margin:0">
          <div class="cli" style="border-left:3px solid var(--code)">
            <div class="cli-i">🌿</div>
            <div><strong>Feature branch fejlesztés</strong>
            <span>Minden új funkció saját Git branch-en készül. Elkülönítés biztosítja, hogy a főág mindig stabil marad.</span></div>
          </div>
          <div class="cli" style="border-left:3px solid var(--code)">
            <div class="cli-i">👀</div>
            <div><strong>Code review — Pull Request</strong>
            <span>Merge előtt legalább egy másik fejlesztő átnézi a kódot. Hibák, biztonsági problémák korán kiderülnek.</span></div>
          </div>
          <div class="cli" style="border-left:3px solid var(--code)">
            <div class="cli-i">🔒</div>
            <div><strong>DevSecOps: SAST a kódírás közben</strong>
            <span>Statikus biztonsági elemző (SonarQube, Checkmarx) IDE-be integrálva — real-time figyelmeztet biztonsági hibákra még mentés előtt.</span></div>
          </div>
        </div>
        <div class="tool-pills">
          <div class="tp" style="background:rgba(59,130,246,0.1);color:var(--code);border-color:rgba(59,130,246,0.3)">Git</div>
          <div class="tp" style="background:rgba(59,130,246,0.1);color:var(--code);border-color:rgba(59,130,246,0.3)">GitHub</div>
          <div class="tp" style="background:rgba(59,130,246,0.1);color:var(--code);border-color:rgba(59,130,246,0.3)">GitLab</div>
          <div class="tp" style="background:rgba(59,130,246,0.1);color:var(--code);border-color:rgba(59,130,246,0.3)">Bitbucket</div>
          <div class="tp" style="background:rgba(59,130,246,0.1);color:var(--code);border-color:rgba(59,130,246,0.3)">SVN</div>
        </div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">💻</div>
          <div class="bub l"><div class="who" style="color:var(--dev)">Fejlesztő Anna</div>
            git checkout -b feature/user-auth · Kész a login funkció — PR nyitva.

function renderBoard(activeIdx) {
  const pl = document.getElementById('pipeline');
  pl.innerHTML = PHASES.map((p,i) => {
    const on = i === activeIdx;
    const done = activeIdx >= 0 && i < activeIdx;
    const cls = on ? 'active' : done ? 'done' : '';
    const c = on ? p.color : done ? p.color : 'var(--muted)';
    return `<div class="pl-item ${cls}">
      <div class="pl-dot" style="border-color:${c};color:${c}">${p.icon}</div>
      <div class="pl-label" style="color:${on?p.color:'var(--muted)'}">${p.label}</div>
    </div>`;
  }).join('');

  const div = document.getElementById('devopsDivider');
  div.innerHTML = `
    <div class="dv-label" style="color:var(--dev)">Dev</div>
    <div class="dv-bar" style="background:linear-gradient(90deg,rgba(59,130,246,0.5),rgba(99,102,241,0.3))"></div>
    <div class="dv-label" style="color:var(--muted)">|</div>
    <div class="dv-bar" style="background:linear-gradient(90deg,rgba(16,185,129,0.3),rgba(239,68,68,0.5))"></div>
    <div class="dv-label" style="color:var(--ops)">Ops</div>
  `;
}

let cur = 0;

function render() {
  const s = STEPS[cur];
  renderBoard(s.active);

  const el = document.getElementById('content');
  el.innerHTML = s.render();
  setTimeout(() => {
    el.querySelectorAll('.msg:not(.show)').forEach((m,i) => {
      setTimeout(() => m.classList.add('show'), i*160);
    });
  }, 60);

  document.getElementById('bprev').disabled = cur === 0;
  const bn = document.getElementById('bnext');
  bn.textContent = cur === STEPS.length - 1 ? '↺ Újra' : 'Következő →';
  document.getElementById('ctr').textContent = `${cur+1} / ${STEPS.length}`;
}

function next() { cur = cur === STEPS.length-1 ? 0 : cur+1; render(); }
function prev() { if(cur>0){cur--;render();} }

render();
</script>
