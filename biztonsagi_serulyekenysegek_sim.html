<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biztonsági Sérülékenységek</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');

:root {
  --bg:    #0a0f1e;
  --surf:  #0f1628;
  --card:  #141d35;
  --brd:   #1e2d50;
  --brd2:  #263a68;
  --text:  #d8e4ff;
  --muted: #4a5f8a;

  --crit:  #ef4444;
  --high:  #f97316;
  --med:   #f59e0b;
  --low:   #3b82f6;
  --none:  #6b7280;
  --ok:    #10b981;
  --acc:   #ef4444;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Sora',sans-serif; min-height:100vh; overflow-x:hidden; }
body::before {
  content:''; position:fixed; inset:0;
  background: radial-gradient(ellipse at 20% 0%, rgba(239,68,68,0.06) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 100%, rgba(249,115,22,0.04) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

header {
  position:relative; z-index:1; padding:1.2rem 1.3rem 0.85rem;
  border-bottom:1px solid var(--brd2);
  background:linear-gradient(180deg, rgba(239,68,68,0.06) 0%, transparent 100%);
}
.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }
h1 { font-size:1.4rem; font-weight:800; line-height:1.07; letter-spacing:-0.02em; }
h1 span { color:var(--crit); }
h1 em   { font-style:normal; color:var(--med); }
.tag { font-family:'Inconsolata',monospace; font-size:0.56rem; padding:0.25rem 0.55rem; border-radius:4px; background:rgba(239,68,68,0.12); color:var(--crit); border:1px solid rgba(239,68,68,0.28); white-space:nowrap; margin-top:0.2rem; }
header p { font-size:0.7rem; color:var(--muted); margin-top:0.25rem; font-family:'Inconsolata',monospace; }

/* TOP BAR */
.topbar { position:relative; z-index:1; background:var(--surf); border-bottom:1px solid var(--brd2); padding:0.75rem 1.3rem 0.65rem; }
.tb-title { font-family:'Inconsolata',monospace; font-size:0.54rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.09em; margin-bottom:0.5rem; }
.vuln-steps { display:flex; align-items:center; gap:0; margin-bottom:0.45rem; }
.vs-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:0.18rem; position:relative; }
.vs-item:not(:last-child)::after { content:''; position:absolute; right:0; top:11px; width:50%; height:2px; background:var(--brd); z-index:0; }
.vs-item:not(:first-child)::before { content:''; position:absolute; left:0; top:11px; width:50%; height:2px; background:var(--brd); z-index:0; }
.vs-dot { width:22px; height:22px; border-radius:50%; border:2px solid var(--brd2); background:var(--card); display:flex; align-items:center; justify-content:center; font-size:0.58rem; z-index:1; transition:all 0.35s; position:relative; }
.vs-label { font-family:'Inconsolata',monospace; font-size:0.44rem; color:var(--muted); text-align:center; line-height:1.2; }
.vs-item.active .vs-dot { transform:scale(1.25); box-shadow:0 0 10px currentColor; }
.vs-item.done .vs-dot { opacity:0.55; }
.vs-item.active .vs-label { font-weight:700; font-size:0.48rem; }
.sev-chips { display:flex; gap:4px; flex-wrap:wrap; }
.sev-chip { font-family:'Inconsolata',monospace; font-size:0.54rem; font-weight:700; padding:0.16rem 0.45rem; border-radius:3px; border:1px solid; opacity:0.3; transition:opacity 0.3s; }
.sev-chip.on { opacity:1; }

/* CONTENT */
.content { position:relative; z-index:1; padding:0.9rem 1.3rem; min-height:275px; }
.shdr { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.85rem; }
.sico { width:36px; height:36px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1rem; border:1.5px solid var(--brd2); background:var(--card); }
.stitle { font-size:0.95rem; font-weight:800; letter-spacing:-0.02em; }
.ssub { font-family:'Inconsolata',monospace; font-size:0.56rem; color:var(--muted); margin-top:0.03rem; }

/* CHAT */
.chat { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.7rem; }
.msg { display:flex; gap:0.4rem; align-items:flex-start; opacity:0; transform:translateY(6px); transition:opacity 0.3s, transform 0.3s; }
.msg.show { opacity:1; transform:translateY(0); }
.msg.r { flex-direction:row-reverse; }
.av { width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; flex-shrink:0; border:1px solid var(--brd2); background:var(--card); }
.bub { max-width:82%; padding:0.48rem 0.68rem; border-radius:9px; font-size:0.77rem; line-height:1.55; border:1px solid var(--brd2); background:var(--card); }
.bub.l { border-bottom-left-radius:2px; }
.bub.r2 { border-bottom-right-radius:2px; text-align:right; }
.who { font-family:'Inconsolata',monospace; font-size:0.55rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.1rem; }

/* CODE BLOCK */
.code-block {
  background:#0d1117; border:1px solid var(--brd2); border-radius:8px;
  padding:0.65rem 0.8rem; margin:0.45rem 0; font-family:'Inconsolata',monospace;
  font-size:0.72rem; line-height:1.7; overflow-x:auto;
}
.cb-label { font-family:'Inconsolata',monospace; font-size:0.52rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:0.3rem; display:flex; align-items:center; gap:0.4rem; }
.cb-lang { background:rgba(239,68,68,0.15); color:var(--crit); padding:0.1rem 0.35rem; border-radius:3px; font-weight:700; }
.cb-ok { background:rgba(16,185,129,0.15); color:var(--ok); padding:0.1rem 0.35rem; border-radius:3px; font-weight:700; }
.c-kw { color:#ff7b72; }
.c-fn { color:#d2a8ff; }
.c-str { color:#a5d6ff; }
.c-var { color:#ffa657; }
.c-cmt { color:#8b949e; font-style:italic; }
.c-bad { background:rgba(239,68,68,0.18); border-radius:3px; padding:0 2px; }
.c-good { background:rgba(16,185,129,0.15); border-radius:3px; padding:0 2px; }
.c-num { color:#79c0ff; }

/* SEVERITY BADGE */
.sev-badge { display:inline-flex; align-items:center; gap:0.3rem; font-family:'Inconsolata',monospace; font-size:0.6rem; font-weight:700; padding:0.2rem 0.55rem; border-radius:4px; border:1px solid; margin-bottom:0.45rem; }

/* ATTACK FLOW */
.attack-flow { background:var(--card); border:1.5px solid rgba(239,68,68,0.3); border-radius:9px; padding:0.65rem 0.75rem; margin:0.45rem 0; }
.af-title { font-family:'Inconsolata',monospace; font-size:0.54rem; color:var(--crit); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:0.45rem; }
.af-step { display:flex; align-items:center; gap:0.5rem; margin:0.28rem 0; font-size:0.72rem; }
.af-num { font-family:'Inconsolata',monospace; font-size:0.62rem; font-weight:700; color:var(--crit); width:18px; flex-shrink:0; }
.af-arr { color:var(--muted); font-size:0.6rem; }

/* FIX BOX */
.fix-box { background:rgba(16,185,129,0.06); border:1.5px solid rgba(16,185,129,0.3); border-radius:9px; padding:0.65rem 0.75rem; margin:0.45rem 0; }
.fx-title { font-family:'Inconsolata',monospace; font-size:0.54rem; color:var(--ok); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:0.35rem; }
.fx-item { display:flex; align-items:flex-start; gap:0.4rem; font-size:0.72rem; margin:0.22rem 0; }

/* IBOX */
.ibox { border-radius:8px; padding:0.55rem 0.75rem; font-size:0.74rem; line-height:1.55; margin:0.45rem 0; border:1px solid var(--brd2); background:var(--card); border-left:3px solid var(--crit); }
.ibox strong { font-weight:700; }
.ibox.ok-b { border-left-color:var(--ok); }
.ibox.ok-b strong { color:var(--ok); }
.ibox.warn-b { border-left-color:var(--med); }
.ibox.warn-b strong { color:var(--med); }

/* HIBA SZINTEK */
.hiba-grid { display:flex; flex-direction:column; gap:0.3rem; margin:0.45rem 0; }
.hiba-row { display:flex; align-items:center; gap:0.6rem; padding:0.42rem 0.65rem; background:var(--card); border-radius:8px; border:1px solid var(--brd2); font-size:0.74rem; }
.hiba-sev { font-family:'Inconsolata',monospace; font-size:0.6rem; font-weight:700; width:70px; flex-shrink:0; }
.hiba-desc { flex:1; }
.hiba-ex { font-size:0.65rem; color:var(--muted); font-family:'Inconsolata',monospace; margin-top:0.05rem; }

/* STAT */
.stat-table { background:var(--card); border:1.5px solid var(--brd2); border-radius:9px; overflow:hidden; margin:0.45rem 0; }
.st-hdr { background:var(--surf); padding:0.3rem 0.7rem; font-family:'Inconsolata',monospace; font-size:0.52rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; border-bottom:1px solid var(--brd); }
.st-row { display:flex; align-items:center; padding:0.38rem 0.7rem; border-bottom:1px solid var(--brd); gap:0.6rem; }
.st-row:last-child { border-bottom:none; }
.st-name { font-size:0.72rem; flex:1; }
.st-bar { height:10px; border-radius:3px; }
.st-val { font-family:'Inconsolata',monospace; font-size:0.62rem; font-weight:700; width:80px; text-align:right; flex-shrink:0; }

/* CHECKLIST */
.cklist { display:flex; flex-direction:column; gap:0.35rem; margin:0.45rem 0; }
.cli { display:flex; align-items:flex-start; gap:0.5rem; padding:0.42rem 0.65rem; background:var(--card); border:1px solid var(--brd2); border-radius:8px; font-size:0.75rem; line-height:1.45; }
.cli-i { flex-shrink:0; font-size:0.88rem; }
.cli strong { display:block; font-weight:700; font-size:0.76rem; margin-bottom:0.03rem; }
.cli span { color:var(--muted); font-size:0.68rem; font-family:'Inconsolata',monospace; }

/* SUMGRID */
.sumgrid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }
.sbox { background:var(--card); border:1px solid var(--brd2); border-radius:8px; padding:0.6rem; text-align:center; }
.sbox .ico { font-size:1.2rem; display:block; margin-bottom:0.15rem; }
.sbox .val { font-size:0.88rem; font-weight:800; }
.sbox .lbl { font-family:'Inconsolata',monospace; font-size:0.52rem; color:var(--muted); margin-top:0.04rem; }

/* VULN PILLS */
.vuln-types { display:flex; flex-wrap:wrap; gap:0.3rem; margin:0.45rem 0; }
.vt { font-family:'Inconsolata',monospace; font-size:0.58rem; font-weight:700; padding:0.2rem 0.5rem; border-radius:4px; border:1px solid; cursor:default; }

/* NAV */
.nav { position:sticky; bottom:0; z-index:10; background:var(--bg); border-top:1px solid var(--brd2); padding:0.7rem 1.3rem; display:flex; align-items:center; gap:0.5rem; }
.btn { font-family:'Inconsolata',monospace; font-size:0.63rem; font-weight:600; padding:0.52rem 1rem; border-radius:7px; cursor:pointer; transition:all 0.18s; text-transform:uppercase; letter-spacing:0.04em; }
.btnp { background:transparent; color:var(--muted); border:1px solid var(--brd2); }
.btnp:hover { color:var(--text); }
.btnp:disabled { opacity:0.2; cursor:not-allowed; }
.btnn { flex:1; background:rgba(239,68,68,0.12); color:var(--crit); border:1px solid rgba(239,68,68,0.3); }
.btnn:hover { background:rgba(239,68,68,0.22); }
.ctr { font-family:'Inconsolata',monospace; font-size:0.57rem; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <h1><span>Biztonsági</span><br>Sérülékeny<br><em>ségek</em></h1>
    <div class="tag">5. előadás // CVE</div>
  </div>
  <p>// XSS · SQL Injection · Buffer Overflow · CSRF · Path Traversal</p>
</header>

<div class="topbar">
  <div class="tb-title">// témakörök</div>
  <div class="vuln-steps" id="vulnSteps"></div>
  <div class="sev-chips" id="sevChips"></div>
</div>

<div class="content" id="content"></div>

<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 18</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>

<script>
const TOPICS = [
  { label:'Bevezető\nStuxnet',   color:'var(--crit)',  icon:'⚠️' },
  { label:'Hibák\nosztályoz.',   color:'var(--high)',  icon:'📊' },
  { label:'Info\nszivárgás',     color:'var(--med)',   icon:'👁️' },
  { label:'XSS\nCSRF',          color:'var(--med)',   icon:'💉' },
  { label:'SQL\nInject.',        color:'var(--crit)',  icon:'🗄️' },
  { label:'Buffer\nOverflow',    color:'var(--crit)',  icon:'💥' },
  { label:'Egyéb\nfajták',       color:'var(--high)',  icon:'🔓' },
  { label:'Össze\nfoglalás',     color:'var(--ok)',    icon:'∑' },
];

const SEV_CHIPS = [
  { label:'5. KRITIKUS', color:'var(--crit)' },
  { label:'4. MAGAS',    color:'var(--high)' },
  { label:'3. KÖZEPES',  color:'var(--med)'  },
  { label:'2. ALACSONY', color:'var(--low)'  },
  { label:'1. NINCS',    color:'var(--none)' },
];

const STEPS = [

  // ── 0. BEVEZETŐ ─────────────────────────────────────────────────
  {
    topic:0, sev:[],
    render:()=>`
      <div class="shdr"><div class="sico">🌐</div>
        <div><div class="stitle">Miért lett kritikus a biztonság?</div>
        <div class="ssub">// standalone → hálózat → internet — exponenciális kockázat</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--crit)">Oktató</div>
            Régen egy szoftverhiba "stand alone" gépen helyi hatású volt — max a gép tulajdonosa szenvedett. Ma egy hiba az interneten terjed. Mennyi embert érint?
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--low);text-align:right">Tanuló</div>
            Hát ha mindenki az internetet használja... akár milliárdokat?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--crit)">Oktató</div>
            Pontosan. A Log4Shell (2021) sérülékenység 3 milliárd eszközt érintett. Egy hibás sor Java kódban — és a világ összes szervere potenciálisan kompromittált volt. Ez az internetesítés következménye.
          </div>
        </div>
      </div>
      <div style="background:var(--card);border:1.5px solid var(--brd2);border-radius:9px;overflow:hidden;margin:0.45rem 0">
        <div style="background:var(--surf);padding:0.3rem 0.7rem;font-family:'Inconsolata',monospace;font-size:0.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid var(--brd)">// kockázat növekedése</div>
        <div style="display:flex;align-items:center;padding:0.4rem 0.7rem;border-bottom:1px solid var(--brd);gap:0.6rem">
          <div style="font-size:0.7rem;flex:1">🖥️ Stand-alone szoftver hibája</div>
          <div style="height:10px;width:40px;background:rgba(107,114,128,0.5);border-radius:2px"></div>
          <div style="font-family:'Inconsolata',monospace;font-size:0.62rem;color:var(--none);width:60px;text-align:right">1 gép</div>
        </div>
        <div style="display:flex;align-items:center;padding:0.4rem 0.7rem;border-bottom:1px solid var(--brd);gap:0.6rem">
          <div style="font-size:0.7rem;flex:1">🔗 Hálózatban lévő szoftver hibája</div>
          <div style="height:10px;width:120px;background:rgba(245,158,11,0.5);border-radius:2px"></div>
          <div style="font-family:'Inconsolata',monospace;font-size:0.62rem;color:var(--med);width:60px;text-align:right">100s gép</div>
        </div>
        <div style="display:flex;align-items:center;padding:0.4rem 0.7rem;gap:0.6rem">
          <div style="font-size:0.7rem;flex:1">🌍 Internetes szoftver hibája</div>
          <div style="height:10px;flex:1;background:linear-gradient(90deg,rgba(239,68,68,0.8),rgba(239,68,68,0.3));border-radius:2px"></div>
          <div style="font-family:'Inconsolata',monospace;font-size:0.62rem;color:var(--crit);width:60px;text-align:right">milliárdok</div>
        </div>
      </div>
      <div class="ibox warn-b"><strong>A KGB visszahozta az írógépeket</strong> — ez nem vicc. Olyan titkos dokumentumok kezelésénél, ahol nem kockáztathatnak digitális lehallgatást, valóban visszatértek az analóg eszközökhöz. Az internetesítés kockázata valós.</div>
    `
  },

  // ── 1. STUXNET ──────────────────────────────────────────────────
  {
    topic:0, sev:[0],
    render:()=>`
      <div class="shdr"><div class="sico" style="border-color:rgba(239,68,68,0.5)">☢️</div>
        <div><div class="stitle">Stuxnet — az első kiberfegyver</div>
        <div class="ssub">// 2010, Irán, urándúsítók — valódi pusztítás kóddal</div></div>
      </div>
      <div style="background:rgba(239,68,68,0.05);border:2px solid rgba(239,68,68,0.3);border-radius:11px;padding:0.8rem;margin-bottom:0.45rem">
        <div style="font-family:'Inconsolata',monospace;font-size:0.56rem;color:var(--crit);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.35rem">KRITIKUS ESET — 2010, Iráni nukleáris program</div>
        <div class="cklist" style="margin:0">
          <div class="cli" style="border-left:3px solid var(--crit)">
            <div class="cli-i">🐛</div>
            <div><strong>3 rétegen áthaló komplex vírus</strong>
            <span>Windows OS → Siemens Simatic SCADA rendszer → PLC programok. Mindhárom rétegen külön "0-day" exploit-ot használt.</span></div>
          </div>
          <div class="cli" style="border-left:3px solid var(--crit)">
            <div class="cli-i">🎯</div>
            <div><strong>Precíz célzás: iráni urándúsítók</strong>
            <span>Kifejezetten Siemens inverteres motormeghajtókat támadott — azokat, amik iráni urándúsító centrifugákon futottak. Más gépeken inaktív maradt.</span></div>
          </div>
          <div class="cli" style="border-left:3px solid var(--crit)">
            <div class="cli-i">💥</div>
            <div><strong>2010 nov. 16: Irán leállítja az urándúsítókat</strong>
            <span>A centrifugák több mint 20%-a fizikailag megsemmisült. A kártevő elérte a célját. Becslések szerint 1-2 évvel visszavetette az iráni nukleáris programot.</span></div>
          </div>
          <div class="cli" style="border-left:3px solid var(--med)">
            <div class="cli-i">❓</div>
            <div><strong>Ma sem tudni, ki írta</strong>
            <span>Nagy team, komoly pénz, állami szintű erőforrások kelltek hozzá. Az USA és Izrael neve merül fel — de sosem ismerték el. Az első ismert kiberfegyver.</span></div>
          </div>
        </div>
      </div>
      <div class="ibox"><strong>Tanulság:</strong> A szoftverbiztonsági rések nem csak adatlopásra használhatók — fizikai pusztítást is okozhatnak. Az ipari vezérlőrendszerek (SCADA) biztonsága nemzeti biztonsági kérdés. Szoftver = fizikai valóság.</div>
    `
  },

  // ── 2. MI LEHET TÁMADÁS TÁRGYA ──────────────────────────────────
  {
    topic:0, sev:[],
    render:()=>`
      <div class="shdr"><div class="sico">🎯</div>
        <div><div class="stitle">Mi lehet a támadás tárgya?</div>
        <div class="ssub">// 4 fő kategória — szándékostól a véletlenig</div></div>
      </div>
      <div class="cklist">
        <div class="cli" style="border-left:3px solid var(--none)">
          <div class="cli-i">🐛</div>
          <div><strong>1. Szoftverhiba — ténylegesen hibásan működő kód</strong>
          <span>A komplexitás miatt előfordul. Pl. az integer overflow — ha egy szám "körbeér" és negatív lesz, ahol pozitívnak kellene lennie. Boeing 787: minden 248 nap repülés után nullázódnia kellett a rendszernek egy 32-bit overflow miatt.</span></div>
        </div>
        <div class="cli" style="border-left:3px solid var(--med)">

function renderBoard(topicIdx, sevIdxs) {
  document.getElementById('vulnSteps').innerHTML = TOPICS.map((t,i)=>{
    const on = i === topicIdx, done = i < topicIdx;
    const c = on ? t.color : done ? t.color : 'var(--muted)';
    return `<div class="vs-item ${on?'active':done?'done':''}">
      <div class="vs-dot" style="border-color:${c};color:${c}">${t.icon}</div>
      <div class="vs-label" style="color:${on?t.color:'var(--muted)'}">${t.label.replace('\n','<br>')}</div>
    </div>`;
  }).join('');
  document.getElementById('sevChips').innerHTML = SEV_CHIPS.map((s,i)=>{
    const on = sevIdxs.includes(i);
    return `<div class="sev-chip ${on?'on':''}" style="border-color:${s.color};color:${s.color}">${s.label}</div>`;
  }).join('');
}

let cur = 0;
function render() {
  const s = STEPS[cur];
  renderBoard(s.topic, s.sev);
  const el = document.getElementById('content');
  el.innerHTML = s.render();
  setTimeout(()=>{el.querySelectorAll('.msg:not(.show)').forEach((m,i)=>setTimeout(()=>m.classList.add('show'),i*160));},60);
  document.getElementById('bprev').disabled = cur===0;
  document.getElementById('bnext').textContent = cur===STEPS.length-1?'↺ Újra':'Következő →';
  document.getElementById('ctr').textContent = `${cur+1} / ${STEPS.length}`;
}
function next(){cur=cur===STEPS.length-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
