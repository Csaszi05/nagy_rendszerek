<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komponens Alapú Fejlesztés</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg:      #faf7f2;
  --surface: #f2ede4;
  --card:    #ffffff;
  --border:  #e0d8cc;
  --dark:    #1c1a17;
  --text:    #2d2a25;
  --muted:   #8a8070;
  --dim:     #c8bfb0;

  --new:    #16a34a;
  --used:   #2563eb;
  --mod:    #d97706;
  --miss:   #dc2626;
  --built:  #7c3aed;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

/* subtle paper texture */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(0,0,0,0.025) 31px, rgba(0,0,0,0.025) 32px);
  pointer-events:none;
  z-index:0;
}

/* ── HEADER ── */
header {
  position:relative; z-index:1;
  padding: 1.4rem 1.3rem 1rem;
  border-bottom: 2px solid var(--dark);
  display:flex; flex-direction:column; gap:0.3rem;
}

.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }

h1 {
  font-family:'Fraunces', serif;
  font-size:1.55rem;
  font-weight:900;
  line-height:1.05;
  letter-spacing:-0.02em;
}

h1 em { font-style:normal; color:var(--used); }

.tag {
  font-family:'DM Mono', monospace;
  font-size:0.57rem;
  padding:0.25rem 0.55rem;
  border-radius:4px;
  background:var(--dark);
  color:var(--bg);
  white-space:nowrap;
  margin-top:0.3rem;
}

header p {
  font-size:0.75rem;
  color:var(--muted);
}

/* ── COMPONENT WAREHOUSE ── */
.warehouse {
  position:relative; z-index:1;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0.8rem 1.3rem;
}

.wh-title {
  font-family:'DM Mono', monospace;
  font-size:0.58rem;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.08em;
  margin-bottom:0.55rem;
}

.comp-grid {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:0.35rem;
}

.comp-tile {
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:8px;
  padding:0.45rem 0.5rem;
  display:flex;
  flex-direction:column;
  gap:0.12rem;
  transition: border-color 0.35s, background 0.35s, transform 0.25s;
  position:relative;
  overflow:hidden;
}

.comp-tile::after {
  content:'';
  position:absolute;
  inset:0;
  border-radius:7px;
  opacity:0;
  transition:opacity 0.3s;
}

.comp-tile.highlight::after { opacity:1; }

.comp-tile.st-used    { border-color:rgba(37,99,235,0.5); background:rgba(37,99,235,0.04); }
.comp-tile.st-new     { border-color:rgba(22,163,74,0.5); background:rgba(22,163,74,0.04); }
.comp-tile.st-mod     { border-color:rgba(217,119,6,0.5); background:rgba(217,119,6,0.04); }
.comp-tile.st-miss    { border-color:rgba(220,38,38,0.5); background:rgba(220,38,38,0.04); }
.comp-tile.st-built   { border-color:rgba(124,58,237,0.5); background:rgba(124,58,237,0.04); }
.comp-tile.st-idle    { border-color:var(--border); background:var(--card); }

.ct-name {
  font-size:0.68rem;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.ct-badge {
  font-family:'DM Mono', monospace;
  font-size:0.52rem;
  padding:0.1rem 0.35rem;
  border-radius:3px;
  align-self:flex-start;
  font-weight:500;
}

.b-used  { background:rgba(37,99,235,0.1);  color:var(--used); }
.b-new   { background:rgba(22,163,74,0.1);  color:var(--new); }
.b-mod   { background:rgba(217,119,6,0.1);  color:var(--mod); }
.b-miss  { background:rgba(220,38,38,0.1);  color:var(--miss); }
.b-built { background:rgba(124,58,237,0.1); color:var(--built); }
.b-idle  { background:var(--surface); color:var(--muted); }

/* ── CONTENT ── */
.content {
  position:relative; z-index:1;
  padding:1rem 1.3rem;
  min-height:270px;
}

/* step header */
.shdr {
  display:flex; align-items:center; gap:0.6rem;
  margin-bottom:0.85rem;
}

.sico {
  width:34px; height:34px;
  border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:0.95rem;
  flex-shrink:0;
  border:1.5px solid var(--border);
  background:var(--card);
}

.stitle { font-family:'Fraunces',serif; font-size:1rem; font-weight:700; letter-spacing:-0.02em; }
.ssub   { font-family:'DM Mono',monospace; font-size:0.58rem; color:var(--muted); margin-top:0.05rem; }

/* chat */
.chat { display:flex; flex-direction:column; gap:0.55rem; margin-bottom:0.75rem; }

.msg {
  display:flex; gap:0.45rem; align-items:flex-end;
  opacity:0; transform:translateY(7px);
  transition:opacity 0.3s, transform 0.3s;
}
.msg.show { opacity:1; transform:translateY(0); }
.msg.r { flex-direction:row-reverse; }

.av {
  width:30px; height:30px;
  border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  font-size:0.88rem;
  flex-shrink:0;
  border:1.5px solid var(--border);
  background:var(--card);
}

.bub {
  max-width:80%;
  padding:0.5rem 0.7rem;
  border-radius:9px;
  font-size:0.77rem;
  line-height:1.5;
  border:1.5px solid var(--border);
  background:var(--card);
}
.bub.l  { border-bottom-left-radius:2px; }
.bub.r2 { border-bottom-right-radius:2px; text-align:right; }

.who {
  font-family:'DM Mono',monospace;
  font-size:0.56rem;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:0.04em;
  margin-bottom:0.1rem;
}

/* info box */
.ibox {
  border-radius:8px;
  padding:0.6rem 0.8rem;
  font-size:0.75rem;
  line-height:1.55;
  margin:0.5rem 0;
  border:1.5px solid var(--border);
  background:var(--card);
  border-left:3px solid var(--dark);
}
.ibox strong { font-weight:600; }
.ibox.blue   { border-left-color:var(--used); }
.ibox.blue strong { color:var(--used); }
.ibox.green  { border-left-color:var(--new); }
.ibox.green strong { color:var(--new); }
.ibox.orange { border-left-color:var(--mod); }
.ibox.orange strong { color:var(--mod); }
.ibox.purple { border-left-color:var(--built); }
.ibox.purple strong { color:var(--built); }
.ibox.red    { border-left-color:var(--miss); }
.ibox.red strong { color:var(--miss); }

/* step list */
.slist { display:flex; flex-direction:column; gap:0.38rem; margin:0.5rem 0; }

.sli {
  display:flex; align-items:flex-start; gap:0.55rem;
  padding:0.45rem 0.65rem;
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:8px;
  font-size:0.76rem;
  line-height:1.45;
}

.sli-ico { flex-shrink:0; font-size:0.9rem; }
.sli-body strong { font-weight:600; display:block; margin-bottom:0.05rem; font-size:0.77rem; }
.sli-body span   { color:var(--muted); font-size:0.7rem; }

/* assembly visual */
.assembly {
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:0.8rem;
  margin:0.5rem 0;
  position:relative;
}

.asm-label {
  font-family:'DM Mono',monospace;
  font-size:0.56rem;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.07em;
  margin-bottom:0.6rem;
}

.asm-row {
  display:flex;
  gap:0.35rem;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:0.3rem;
}

.asm-block {
  padding:0.3rem 0.55rem;
  border-radius:6px;
  font-size:0.65rem;
  font-weight:600;
  border:1.5px solid;
  white-space:nowrap;
}

.asm-arrow {
  font-size:0.8rem;
  color:var(--dim);
}

.asm-result {
  margin-top:0.5rem;
  padding:0.4rem 0.65rem;
  border-radius:7px;
  font-size:0.7rem;
  font-weight:600;
  text-align:center;
  border:2px dashed;
}

/* comparison */
.cmp {
  display:flex;
  flex-direction:column;
  gap:0.4rem;
  margin:0.5rem 0;
}

.cmp-item {
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:8px;
  padding:0.5rem 0.7rem;
}

.cmp-lbl {
  font-family:'DM Mono',monospace;
  font-size:0.6rem;
  color:var(--muted);
  margin-bottom:0.25rem;
}

.cmp-bar-wrap {
  height:8px;
  background:var(--surface);
  border-radius:4px;
  overflow:hidden;
}

.cmp-bar {
  height:100%;
  border-radius:4px;
  transition:width 0.7s ease;
}

/* summary boxes */
.sumgrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0.4rem;
  margin:0.5rem 0;
}

.sumbox {
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:8px;
  padding:0.6rem 0.65rem;
  text-align:center;
}
.sumbox .ico { font-size:1.2rem; display:block; margin-bottom:0.2rem; }
.sumbox .val { font-size:0.92rem; font-weight:700; }
.sumbox .lbl { font-family:'DM Mono',monospace; font-size:0.55rem; color:var(--muted); margin-top:0.05rem; }

/* legend */
.legend {
  display:flex; flex-wrap:wrap; gap:0.35rem;
  margin:0.4rem 0;
}
.leg-item {
  display:flex; align-items:center; gap:0.3rem;
  font-family:'DM Mono',monospace;
  font-size:0.57rem;
}
.leg-dot {
  width:8px; height:8px;
  border-radius:2px;
  flex-shrink:0;
}

/* ── NAV ── */
.nav {
  position:sticky; bottom:0; z-index:10;
  background:var(--bg);
  border-top:2px solid var(--dark);
  padding:0.75rem 1.3rem;
  display:flex; align-items:center; gap:0.55rem;
}

.btn {
  font-family:'DM Mono',monospace;
  font-size:0.63rem;
  font-weight:500;
  padding:0.55rem 1rem;
  border-radius:7px;
  cursor:pointer;
  transition:all 0.18s;
  text-transform:uppercase;
  letter-spacing:0.04em;
}

.btnp {
  background:transparent;
  color:var(--muted);
  border:1.5px solid var(--border);
}
.btnp:hover { border-color:var(--dark); color:var(--dark); }
.btnp:disabled { opacity:0.2; cursor:not-allowed; }

.btnn {
  flex:1;
  background:var(--dark);
  color:var(--bg);
  border:1.5px solid var(--dark);
}
.btnn:hover { background:#333; }
.btnn:disabled { opacity:0.3; cursor:not-allowed; }

.ctr {
  font-family:'DM Mono',monospace;
  font-size:0.58rem;
  color:var(--muted);
  white-space:nowrap;
}
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <h1>Komponens<br><em>alapú</em><br>fejlesztés</h1>
    <div class="tag">PROJEKT: Utazási App</div>
  </div>
  <p>Kész részekből rakjuk össze a szoftvert — mint LEGO</p>
</header>

<!-- WAREHOUSE -->
<div class="warehouse">
  <div class="wh-title">// Komponens raktár — aktuális állapot</div>
  <div class="comp-grid" id="warehouse"></div>
  <div class="legend" style="margin-top:0.5rem">
    <div class="leg-item"><div class="leg-dot" style="background:rgba(37,99,235,0.5)"></div>újrahasznált</div>
    <div class="leg-item"><div class="leg-dot" style="background:rgba(22,163,74,0.5)"></div>új</div>
    <div class="leg-item"><div class="leg-dot" style="background:rgba(217,119,6,0.5)"></div>módosított</div>
    <div class="leg-item"><div class="leg-dot" style="background:rgba(220,38,38,0.5)"></div>hiányzó</div>
    <div class="leg-item"><div class="leg-dot" style="background:rgba(124,58,237,0.5)"></div>beépítve</div>
  </div>
</div>

<div class="content" id="content"></div>

<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 12</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>

<script>
// Components in the warehouse — state evolves per step
const COMPS = [
  { id:'auth',    name:'🔐 Bejelentkezés', },
  { id:'search',  name:'🔍 Keresés',       },
  { id:'map',     name:'🗺️ Térkép',        },
  { id:'pay',     name:'💳 Fizetés',       },
  { id:'notify',  name:'🔔 Értesítés',     },
  { id:'review',  name:'⭐ Értékelés',     },
  { id:'booking', name:'📅 Foglalás',      },
  { id:'profile', name:'👤 Profil',        },
  { id:'weather', name:'🌤️ Időjárás',      },
];

// state: idle | used | new | mod | miss | built
const STEPS = [
  // ─── 1. MI EZ? ───────────────────────────────────────────────────
  {
    wh: { auth:'idle', search:'idle', map:'idle', pay:'idle', notify:'idle', review:'idle', booking:'idle', profile:'idle', weather:'idle' },
    render: () => `
      <div class="shdr">
        <div class="sico">🧩</div>
        <div><div class="stitle">Mi az a komponens alapú fejlesztés?</div><div class="ssub">// Az alapgondolat — LEGO elv</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--used)">Oktató</div>
            Képzelj el egy LEGO készletet. Vannak kész kockák — ezekből rakod össze, amit akarsz. Nem kell minden kockát nulláról megcsinálni.
          </div>
        </div>
        <div class="msg show" style="transition-delay:.15s">
          <div class="av">🙋</div>
          <div class="bub l"><div class="who" style="color:var(--new)">Tanuló</div>
            És a szoftverfejlesztésben ez hogyan néz ki?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--used)">Oktató</div>
            Ugyanígy! Vannak kész <strong>szoftver komponensek</strong> — bejelentkezés, térkép, fizetés... Ezeket összedugod, és kész az alkalmazás. Nem írsz mindent nulláról.
          </div>
        </div>
      </div>
      <div class="ibox blue"><strong>Kulcsgondolat:</strong> A kód újrafelhasználása. Ha egyszer megírtunk egy bejelentkezés komponenst, azt minden új projektben használhatjuk — nem kell újra megírni.</div>
    `
  },

  // ─── 2. KÖVETELMÉNY ELEMZÉS ───────────────────────────────────────
  {
    wh: { auth:'idle', search:'idle', map:'idle', pay:'idle', notify:'idle', review:'idle', booking:'idle', profile:'idle', weather:'idle' },
    render: () => `
      <div class="shdr">
        <div class="sico">📋</div>
        <div><div class="stitle">1. lépés — Mit kell megcsinálni?</div><div class="ssub">// Követelmény elemzés</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">✈️</div>
          <div class="bub l"><div class="who" style="color:var(--mod)">Ügyfél</div>
            Szeretnék egy utazástervező appot. Lehessen repülőt, szállást foglalni, térképen nézni, fizetni, értékelni...
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">
          <div class="av">👨‍💻</div>
          <div class="bub r2"><div class="who" style="color:var(--used);text-align:right">Fejlesztő</div>
            Rendben! Először nézzük meg, mit kell nulláról megírni és mit lehet kész komponensként használni.
          </div>
        </div>
      </div>
      <div class="slist">
        <div class="sli"><div class="sli-ico">📝</div><div class="sli-body"><strong>Funkciók listázása</strong><span>Foglalás, térkép, fizetés, bejelentkezés, értékelés, értesítés, profil, időjárás, keresés</span></div></div>
        <div class="sli"><div class="sli-ico">🔍</div><div class="sli-body"><strong>Komponens keresés</strong><span>Melyik funkció létezik már kész komponensként?</span></div></div>
        <div class="sli"><div class="sli-ico">📊</div><div class="sli-body"><strong>Elemzés</strong><span>Pontosan illeszkedik? Módosítani kell? Vagy nulláról kell írni?</span></div></div>
      </div>
    `
  },

  // ─── 3. KOMPONENS KERESÉS ─────────────────────────────────────────
  {
    wh: { auth:'used', search:'used', map:'used', pay:'used', notify:'used', review:'miss', booking:'miss', profile:'new', weather:'used' },
    render: () => `
      <div class="shdr">
        <div class="sico">🔍</div>
        <div><div class="stitle">2. lépés — Komponens keresés</div><div class="ssub">// Mit találunk a "raktárban"?</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍💻</div>
          <div class="bub l"><div class="who" style="color:var(--used)">Fejlesztő</div>
            Megnéztem a belső komponens könyvtárunkat és a piaci megoldásokat. Íme az eredmény:
          </div>
        </div>
      </div>
      <div class="slist">
        <div class="sli" style="border-color:rgba(37,99,235,0.3)"><div class="sli-ico">✅</div><div class="sli-body"><strong style="color:var(--used)">Újrahasználható (5 db)</strong><span>Bejelentkezés, Keresés, Térkép (Google Maps API), Fizetés (Stripe), Időjárás API — pontosan illeszkednek</span></div></div>
        <div class="sli" style="border-color:rgba(220,38,38,0.3)"><div class="sli-ico">❌</div><div class="sli-body"><strong style="color:var(--miss)">Hiányzik, nulláról kell (2 db)</strong><span>Értékelés rendszer, Foglalás logika — ilyen specifikus komponens nincs kész</span></div></div>
        <div class="sli" style="border-color:rgba(22,163,74,0.3)"><div class="sli-ico">🆕</div><div class="sli-body"><strong style="color:var(--new)">Új, de egyszerű (1 db)</strong><span>Profil oldal — gyorsan megírható</span></div></div>
      </div>
      <div class="ibox green"><strong>Eredmény:</strong> A 9 funkcióból 5-öt nem kell megírni! Ez hatalmas időmegtakarítás.</div>
    `
  },

  // ─── 4. ILLESZKEDÉS VIZSGÁLAT ─────────────────────────────────────
  {
    wh: { auth:'used', search:'mod', map:'used', pay:'used', notify:'mod', review:'miss', booking:'miss', profile:'new', weather:'used' },
    render: () => `
      <div class="shdr">
        <div class="sico">🔬</div>
        <div><div class="stitle">3. lépés — Pontosan illeszkednek?</div><div class="ssub">// Néhány komponenst módosítani kell</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍💻</div>
          <div class="bub l"><div class="who" style="color:var(--used)">Fejlesztő</div>
            A Keresés komponens megvan, de az általános webshop keresőre van optimalizálva. Nekünk repülőjegy + szálláskereső kell.
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">
          <div class="av">✈️</div>
          <div class="bub r2"><div class="who" style="color:var(--mod);text-align:right">Ügyfél</div>
            Módosítható?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">👨‍💻</div>
          <div class="bub l"><div class="who" style="color:var(--used)">Fejlesztő</div>
            Igen! Az alap logika marad, csak a szűrőket és a megjelenítést írjuk át. Ez sokkal gyorsabb, mintha nulláról csinálnánk.
          </div>
        </div>
      </div>
      <div class="slist">

// ── WAREHOUSE RENDER ─────────────────────────────────────────────────
const STATE_MAP = {
  idle:  { cls:'st-idle',  badge:'b-idle',  label:'—' },
  used:  { cls:'st-used',  badge:'b-used',  label:'újrahasznált' },
  new:   { cls:'st-new',   badge:'b-new',   label:'új' },
  mod:   { cls:'st-mod',   badge:'b-mod',   label:'módosított' },
  miss:  { cls:'st-miss',  badge:'b-miss',  label:'hiányzó' },
  built: { cls:'st-built', badge:'b-built', label:'beépítve ✓' },
};

function renderWarehouse(wh) {
  document.getElementById('warehouse').innerHTML = COMPS.map(c => {
    const st = STATE_MAP[wh[c.id]];
    return `
      <div class="comp-tile ${st.cls}">
        <div class="ct-name">${c.name}</div>
        <div class="ct-badge ${st.badge}">${st.label}</div>
      </div>`;
  }).join('');
}

let cur = 0;

function render() {
  const s = STEPS[cur];
  renderWarehouse(s.wh);

  const el = document.getElementById('content');
  el.innerHTML = s.render();

  setTimeout(() => {
    el.querySelectorAll('.msg:not(.show)').forEach((m, i) => {
      setTimeout(() => m.classList.add('show'), i * 160);
    });
  }, 60);

  document.getElementById('bprev').disabled = cur === 0;
  const bn = document.getElementById('bnext');
  bn.textContent = cur === STEPS.length - 1 ? '↺ Újra' : 'Következő →';
  document.getElementById('ctr').textContent = `${cur + 1} / ${STEPS.length}`;
}

function next() { cur = cur === STEPS.length - 1 ? 0 : cur + 1; render(); }
function prev() { if (cur > 0) { cur--; render(); } }

render();
</script>
