<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Modell és Modellezés</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');
:root {
  --bg:#0a0f1e; --surf:#0f1628; --card:#141d35; --brd:#1e2d50; --brd2:#263a68;
  --text:#d8e4ff; --muted:#4a5f8a;
  --domain:#10b981; --plan:#3b82f6; --noplan:#ef4444; --golden:#f59e0b;
  --model:#a855f7; --lang:#22d3ee; --acc:#10b981;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(16,185,129,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(168,85,247,.04) 0%,transparent 50%);pointer-events:none;z-index:0;}
header{position:relative;z-index:1;padding:1.2rem 1.3rem .85rem;border-bottom:1px solid var(--brd2);background:linear-gradient(180deg,rgba(16,185,129,.06) 0%,transparent 100%);}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;}
h1{font-size:1.4rem;font-weight:800;line-height:1.07;letter-spacing:-.02em;}
h1 span{color:var(--domain);}h1 em{font-style:normal;color:var(--lang);}
.tag{font-family:'Inconsolata',monospace;font-size:.56rem;padding:.25rem .55rem;border-radius:4px;background:rgba(16,185,129,.12);color:var(--domain);border:1px solid rgba(16,185,129,.28);white-space:nowrap;margin-top:.2rem;}
header p{font-size:.7rem;color:var(--muted);margin-top:.25rem;font-family:'Inconsolata',monospace;}
.topbar{position:relative;z-index:1;background:var(--surf);border-bottom:1px solid var(--brd2);padding:.75rem 1.3rem .65rem;}
.tb-t{font-family:'Inconsolata',monospace;font-size:.54rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:.5rem;}
.steps{display:flex;align-items:center;gap:0;margin-bottom:.45rem;}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:.18rem;position:relative;}
.st:not(:last-child)::after{content:'';position:absolute;right:0;top:12px;width:50%;height:2px;background:var(--brd);z-index:0;}
.st:not(:first-child)::before{content:'';position:absolute;left:0;top:12px;width:50%;height:2px;background:var(--brd);z-index:0;}
.sd{width:24px;height:24px;border-radius:50%;border:2px solid var(--brd2);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.6rem;z-index:1;transition:all .35s;position:relative;}
.sl{font-family:'Inconsolata',monospace;font-size:.44rem;color:var(--muted);text-align:center;line-height:1.2;}
.st.active .sd{transform:scale(1.25);box-shadow:0 0 10px currentColor;}
.st.done .sd{opacity:.55;}
.st.active .sl{font-weight:700;}
.tag-row{display:flex;gap:4px;flex-wrap:wrap;}
.tg{font-family:'Inconsolata',monospace;font-size:.53rem;font-weight:600;padding:.14rem .4rem;border-radius:3px;border:1px solid;opacity:.25;transition:opacity .3s;}
.tg.on{opacity:1;}
.content{position:relative;z-index:1;padding:.9rem 1.3rem;min-height:275px;}
.shdr{display:flex;align-items:center;gap:.6rem;margin-bottom:.85rem;}
.sico{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem;border:1.5px solid var(--brd2);background:var(--card);}
.stitle{font-size:.95rem;font-weight:800;letter-spacing:-.02em;}
.ssub{font-family:'Inconsolata',monospace;font-size:.56rem;color:var(--muted);margin-top:.03rem;}
.chat{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.7rem;}
.msg{display:flex;gap:.4rem;align-items:flex-start;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;}
.msg.show{opacity:1;transform:translateY(0);}
.msg.r{flex-direction:row-reverse;}
.av{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;border:1px solid var(--brd2);background:var(--card);}
.bub{max-width:82%;padding:.48rem .68rem;border-radius:9px;font-size:.77rem;line-height:1.55;border:1px solid var(--brd2);background:var(--card);}
.bub.l{border-bottom-left-radius:2px;}.bub.r2{border-bottom-right-radius:2px;text-align:right;}
.who{font-family:'Inconsolata',monospace;font-size:.55rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.1rem;}
.ibox{border-radius:8px;padding:.55rem .75rem;font-size:.74rem;line-height:1.55;margin:.45rem 0;border:1px solid var(--brd2);background:var(--card);border-left:3px solid var(--domain);}
.ibox strong{font-weight:700;}
.ibox.warn{border-left-color:var(--noplan);}
.ibox.warn strong{color:var(--noplan);}
.ibox.lang{border-left-color:var(--lang);}
.ibox.lang strong{color:var(--lang);}
.cklist{display:flex;flex-direction:column;gap:.35rem;margin:.45rem 0;}
.cli{display:flex;align-items:flex-start;gap:.5rem;padding:.42rem .65rem;background:var(--card);border:1px solid var(--brd2);border-radius:8px;font-size:.75rem;line-height:1.45;}
.cli-i{flex-shrink:0;font-size:.88rem;}
.cli strong{display:block;font-weight:700;font-size:.76rem;margin-bottom:.03rem;}
.cli span{color:var(--muted);font-size:.68rem;font-family:'Inconsolata',monospace;}

/* 6 VAK EMBER VIEW */
.elephant-view{background:var(--card);border:1.5px solid var(--brd2);border-radius:9px;padding:.65rem .75rem;margin:.45rem 0;}
.ev-title{font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem;text-align:center;}
.ev-elephant{font-size:2rem;text-align:center;margin:.3rem 0;}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;}
.ev-item{padding:.35rem .5rem;border-radius:6px;background:var(--surf);border-left:2px solid;font-size:.66rem;line-height:1.4;}

/* COMPARE 3-WAY */
.comp3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.35rem;margin:.45rem 0;}
.comp3-card{padding:.6rem .65rem;border-radius:9px;border:1.5px solid;text-align:center;}
.c3-icon{font-size:1.4rem;margin-bottom:.2rem;}
.c3-name{font-size:.78rem;font-weight:800;margin-bottom:.15rem;}
.c3-desc{font-size:.62rem;line-height:1.5;color:rgba(216,228,255,.8);text-align:left;}

/* QUOTE */
.quote{border-radius:11px;padding:.9rem 1rem;margin:.45rem 0;border:2px solid;position:relative;}
.q-mark{font-size:3rem;line-height:.8;opacity:.2;font-family:Georgia,serif;position:absolute;top:.4rem;left:.6rem;}
.q-text{font-size:.82rem;line-height:1.6;font-style:italic;padding-left:1.2rem;color:rgba(216,228,255,.9);}
.q-author{font-family:'Inconsolata',monospace;font-size:.58rem;font-weight:700;margin-top:.4rem;padding-left:1.2rem;}

/* MAP COMPARE */
.map-cmp{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.45rem 0;}
.map-card{padding:.65rem .75rem;border-radius:9px;border:1.5px solid;}
.map-title{font-family:'Inconsolata',monospace;font-size:.6rem;font-weight:700;margin-bottom:.25rem;}
.map-vis{background:var(--surf);border-radius:6px;padding:.5rem;text-align:center;font-family:'Inconsolata',monospace;font-size:.62rem;margin:.3rem 0;color:var(--muted);}

/* KÖNIGSBERG */
.bridge-vis{background:var(--card);border:1.5px solid var(--brd2);border-radius:9px;padding:.7rem;margin:.45rem 0;}
.bv-title{font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem;text-align:center;}
.bv-content{font-family:'Inconsolata',monospace;font-size:.78rem;line-height:2;text-align:center;}

/* MODEL FEATURES */
.feat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.35rem;margin:.45rem 0;}
.feat-card{background:var(--card);border:1px solid var(--brd2);border-radius:8px;padding:.55rem .55rem;text-align:center;border-top:3px solid;}
.feat-icon{font-size:1.3rem;margin-bottom:.15rem;}
.feat-name{font-size:.72rem;font-weight:800;margin-bottom:.1rem;}
.feat-desc{font-size:.6rem;color:var(--muted);line-height:1.4;font-family:'Inconsolata',monospace;}

/* MONOPOLY */
.mono-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin:.45rem 0;}
.mono-card{padding:.5rem .6rem;border-radius:7px;border:1.5px solid;background:var(--card);}
.mono-name{font-size:.7rem;font-weight:800;margin-bottom:.08rem;}
.mono-attrs{font-family:'Inconsolata',monospace;font-size:.58rem;color:var(--muted);line-height:1.45;}

/* SUMGRID */
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.45rem 0;}
.sbox{background:var(--card);border:1px solid var(--brd2);border-radius:8px;padding:.6rem;text-align:center;}
.sbox .ico{font-size:1.2rem;display:block;margin-bottom:.15rem;}
.sbox .val{font-size:.88rem;font-weight:800;}
.sbox .lbl{font-family:'Inconsolata',monospace;font-size:.52rem;color:var(--muted);margin-top:.04rem;}

.nav{position:sticky;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--brd2);padding:.7rem 1.3rem;display:flex;align-items:center;gap:.5rem;}
.btn{font-family:'Inconsolata',monospace;font-size:.63rem;font-weight:600;padding:.52rem 1rem;border-radius:7px;cursor:pointer;transition:all .18s;text-transform:uppercase;letter-spacing:.04em;}
.btnp{background:transparent;color:var(--muted);border:1px solid var(--brd2);}
.btnp:hover{color:var(--text);}
.btnp:disabled{opacity:.2;cursor:not-allowed;}
.btnn{flex:1;background:rgba(16,185,129,.12);color:var(--domain);border:1px solid rgba(16,185,129,.3);}
.btnn:hover{background:rgba(16,185,129,.22);}
.ctr{font-family:'Inconsolata',monospace;font-size:.57rem;color:var(--muted);white-space:nowrap;}
</style>
</head>
<body>
<header>
  <div class="hdr-row">
    <h1><span>Domain</span><br>Modell &amp;<br><em>Modellezés</em></h1>
    <div class="tag">DDD alapok</div>
  </div>
  <p>// 6 vak ember · Modellek · Közös nyelv · Monopoly</p>
</header>
<div class="topbar">
  <div class="tb-t">// témakörök</div>
  <div class="steps" id="steps"></div>
  <div class="tag-row" id="tagRow"></div>
</div>
<div class="content" id="content"></div>
<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 14</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>
<script>
const TOPICS=[
  {label:'6 vak\nember',color:'var(--noplan)',icon:'🐘'},
  {label:'2 véglet\nproblémái',color:'var(--plan)',icon:'⚖️'},
  {label:'Arany\nközépút',color:'var(--golden)',icon:'⚖️'},
  {label:'Modell\nfogalma',color:'var(--model)',icon:'🗺️'},
  {label:'Domain\nModell',color:'var(--domain)',icon:'🌐'},
  {label:'Közös\nnyelv',color:'var(--lang)',icon:'💬'},
  {label:'Összefog.',color:'var(--domain)',icon:'∑'},
];
const TAGS=[
  {label:'Túltervezés',color:'var(--plan)'},
  {label:'Tervmentes',color:'var(--noplan)'},
  {label:'Agile',color:'var(--golden)'},
  {label:'Domain',color:'var(--domain)'},
  {label:'Ubiquitous Lang.',color:'var(--lang)'},
];

const STEPS=[
  // 0. BEVEZETŐ — 6 VAK EMBER
  {t:0,tags:[],render:()=>`
    <div class="shdr"><div class="sico">🐘</div>
      <div><div class="stitle">A 6 vak ember és az elefánt</div>
      <div class="ssub">// indiai történet — miért kell egységes nézőpont?</div></div>
    </div>
    <div class="chat">
      <div class="msg show"><div class="av">👨‍🏫</div><div class="bub l"><div class="who" style="color:var(--noplan)">Oktató</div>

      </div></div>
    </div>
    <div class="elephant-view">
      <div class="ev-title">// 6 különböző nézőpont — ugyanaz az elefánt</div>

      <div class="ev-grid">
        <div class="ev-item" style="border-color:#3b82f6">🦷 <strong>Vak 1 — agyar:</strong> "Vastag faág."</div>
        <div class="ev-item" style="border-color:#10b981">🫧 <strong>Vak 2 — ormány:</strong> "Egy cső."</div>
        <div class="ev-item" style="border-color:#f59e0b">📐 <strong>Vak 3 — fül:</strong> "Hatalmas legyező."</div>
        <div class="ev-item" style="border-color:#a855f7">🧱 <strong>Vak 4 — oldal:</strong> "Nagy fal."</div>
        <div class="ev-item" style="border-color:#ef4444">🏛️ <strong>Vak 5 — láb:</strong> "Egy oszlop."</div>
        <div class="ev-item" style="border-color:#22d3ee">🪢 <strong>Vak 6 — farok:</strong> "Egy kötél."</div>
      </div>
    </div>
    <div class="ibox"><strong>A tanulság szoftverfejlesztésre:</strong> Nagy szoftverrendszerek fejlesztésében sokan vesznek részt — fejlesztők, üzleti szakértők, tesztelők, dizájnerek, üzemeltetők. Mind másfajta nézőponttal, képességekkel rendelkeznek. <strong>Ezeket EGYSÉGES EGÉSSZÉ kell alakítani.</strong> Ez a domain modell célja.</div>
  `},

  // 1. KLASSZIKUS FEJLESZTÉS PROBLÉMÁI
  {t:1,tags:[0],render:()=>`
    <div class="shdr"><div class="sico" style="border-color:rgba(59,130,246,.5)">📐</div>
      <div><div class="stitle">A klasszikus, túltervezett megközelítés</div>
      <div class="ssub">// minden részletet előre megtervezünk — és mi a baj vele?</div></div>
    </div>
    <div class="chat">
      <div class="msg show"><div class="av">📋</div><div class="bub l"><div class="who" style="color:var(--plan)">Senior architect (2005)</div>

      </div></div>
    </div>
    <div class="cklist">
      <div class="cli" style="border-left:3px solid var(--plan)">
        <div class="cli-i">🧠</div>
        <div><strong>Analízis paralízis</strong>
        <span>A tervezők nem tudnak továbblépni, mert a modell "nem elég jó". Hónapok telnek el — közben veszteség, piacvesztés, az igények változnak. Mire kész, már nem aktuális.</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--plan)">
        <div class="cli-i">🏗️</div>
        <div><strong>Rugalmatlan, merev rendszer</strong>
        <span>A részletes terv miatt minden szorosan összekapcsolódik. Egy változtatás → minden megdől. Az elkerülhetetlen változások katasztrófát okoznak.</span></div>
      </div>
      <div class="cli" style="border-left:3px solid var(--plan)">

        <span>A sok terv miatt a végeredmény túl bonyolult. Nehéz átlátni, nehéz bővíteni, nehéz módosítani, nehéz karbantartani.</span></div>

    <div class="ibox warn"><strong>Valós példa — Las Vegas hotel:</strong> A parabolikus üveg architektúra tervezésekor NEM gondoltak arra, hogy az ablakok a szomszéd hotel medencéjére fókuszálnak a napfényt. A vendégek megégtek! A megoldás — nem tükröződő fólia minden ablakra — nagyon költséges volt. Még a legrészletesebb terv sem fed le mindent.</div>
  `},

  // 2. TERVMENTES FEJLESZTÉS PROBLÉMÁI
  {t:1,tags:[1],render:()=>`
    <div class="shdr"><div class="sico" style="border-color:rgba(239,68,68,.5)">🚀</div>
      <div><div class="stitle">A "tervmentes" megközelítés</div>
      <div class="ssub">// startup módra — ugorjunk neki, majd kitaláljuk</div></div>
    </div>
    <div class="quote" style="background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.3)">
      <div class="q-mark" style="color:rgba(239,68,68,.3)">"</div>
      <div class="q-text">Flappy Bird — semmilyen design, megvalósíthatósági tanulmány, architektúra spec, dinamikus modell. A fejlesztő pár nap alatt készítette el — mégis óriási sikere lett. De ilyen siker több millióból egyszer fordul elő.</div>

    </div>
    <div class="chat">

        Csapjunk bele! Pár hét alatt MVP-t adunk az ügyfélnek, aztán átalakítjuk ha kell. Refaktorálni majd később lehet.
      </div></div>
      <div class="msg show r" style="transition-delay:.15s"><div class="av">😩</div><div class="bub r2"><div class="who" style="color:var(--plan);text-align:right">6 hónap múlva</div>
        A kód kaotikus. Minden új feature 2 másik dolgot tör el. Refaktorálni egyre nehezebb. Vagy újraírjuk az egészet, vagy belehalunk.
      </div></div>
    </div>
    <div class="cklist">
      <div class="cli" style="border-left:3px solid var(--noplan)">
        <div class="cli-i">😨</div>
        <div><strong>Félelem a tervezéstől</strong>

    </div>

  // 3. AZ ARANY KÖZÉPÚT
  {t:2,tags:[2],render:()=>`

      <div><div class="stitle">Az arany középút — agilis tervezés</div>

        <div class="c3-desc">Tervezünk, de csak amennyi épp szükséges. Agilis — működőképes érték minden iterációban.</div>
      </div>
      <div class="comp3-card" style="background:rgba(239,68,68,.06);border-color:rgba(239,68,68,.35)">
        <div class="c3-icon">🚀</div>

function renderBoard(tIdx,tagIdxs){
  document.getElementById('steps').innerHTML=TOPICS.map((t,i)=>{
    const on=i===tIdx,done=i<tIdx;
    const c=on?t.color:done?t.color:'var(--muted)';
    return `<div class="st ${on?'active':done?'done':''}">
      <div class="sd" style="border-color:${c};color:${c}">${t.icon}</div>
      <div class="sl" style="color:${on?t.color:'var(--muted)'}">${t.label.replace('\n','<br>')}</div>
    </div>`;
  }).join('');
  document.getElementById('tagRow').innerHTML=TAGS.map((tg,i)=>{
    const on=tagIdxs.includes(i);
    return `<div class="tg ${on?'on':''}" style="border-color:${tg.color};color:${tg.color}">${tg.label}</div>`;
  }).join('');
}

let cur=0;
function render(){
  const s=STEPS[cur];
  renderBoard(s.t,s.tags);
  const el=document.getElementById('content');
  el.innerHTML=s.render();
  setTimeout(()=>{el.querySelectorAll('.msg:not(.show)').forEach((m,i)=>setTimeout(()=>m.classList.add('show'),i*160));},60);
  document.getElementById('bprev').disabled=cur===0;
  document.getElementById('bnext').textContent=cur===STEPS.length-1?'↺ Újra':'Következő →';
  document.getElementById('ctr').textContent=`${cur+1} / ${STEPS.length}`;
}
function next(){cur=cur===STEPS.length-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
