<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevSecOps &amp; STRIDE Szimuláció</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');

:root {
  --bg:    #0a0f1e;
  --surf:  #0f1628;
  --card:  #141d35;
  --brd:   #1e2d50;
  --brd2:  #263a68;
  --text:  #d8e4ff;
  --muted: #4a5f8a;

  --sec:   #ef4444;
  --sec2:  #f87171;
  --dev:   #3b82f6;
  --ops:   #10b981;
  --warn:  #f59e0b;
  --info:  #6366f1;

  /* STRIDE colors */
  --s: #f59e0b;   /* Spoofing */
  --t: #ef4444;   /* Tampering */
  --r: #a855f7;   /* Repudiation */
  --i: #3b82f6;   /* Info Disclosure */
  --d: #10b981;   /* DoS */
  --e: #f97316;   /* Elevation */

  /* Security tools */
  --sast: #6366f1;
  --dast: #ef4444;
  --iast: #a855f7;
  --sca:  #10b981;
  --siem: #f97316;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:'Sora', sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(239,68,68,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(168,85,247,0.05) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

header {
  position:relative; z-index:1;
  padding:1.2rem 1.3rem 0.85rem;
  border-bottom:1px solid var(--brd2);
  background:linear-gradient(180deg, rgba(239,68,68,0.06) 0%, transparent 100%);
}
.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }
h1 { font-size:1.4rem; font-weight:800; line-height:1.07; letter-spacing:-0.02em; }
h1 span { color:var(--sec); }
h1 em   { font-style:normal; color:#a855f7; }
.tag {
  font-family:'Inconsolata', monospace; font-size:0.56rem;
  padding:0.25rem 0.55rem; border-radius:4px;
  background:rgba(239,68,68,0.12); color:var(--sec);
  border:1px solid rgba(239,68,68,0.28); white-space:nowrap; margin-top:0.2rem;
}
header p { font-size:0.7rem; color:var(--muted); margin-top:0.25rem; font-family:'Inconsolata', monospace; }

/* SECURITY LEVEL BAR */
.sec-board {
  position:relative; z-index:1;
  background:var(--surf);
  border-bottom:1px solid var(--brd2);
  padding:0.75rem 1.3rem 0.65rem;
}
.sb-title {
  font-family:'Inconsolata', monospace; font-size:0.54rem;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.09em;
  margin-bottom:0.5rem;
}
.topic-steps {
  display:flex; align-items:center; gap:0; margin-bottom:0.45rem;
}
.ts-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:0.2rem;
  position:relative;
}
.ts-item:not(:last-child)::after {
  content:''; position:absolute; right:0; top:12px;
  width:50%; height:2px; background:var(--brd); z-index:0;
}
.ts-item:not(:first-child)::before {
  content:''; position:absolute; left:0; top:12px;
  width:50%; height:2px; background:var(--brd); z-index:0;
}
.ts-dot {
  width:24px; height:24px; border-radius:50%;
  border:2px solid var(--brd2); background:var(--card);
  display:flex; align-items:center; justify-content:center;
  font-size:0.6rem; z-index:1; transition:all 0.4s; position:relative;
}
.ts-label {
  font-family:'Inconsolata', monospace; font-size:0.45rem;
  color:var(--muted); text-align:center; line-height:1.2;
}
.ts-item.active .ts-dot { transform:scale(1.2); box-shadow:0 0 10px currentColor; }
.ts-item.done   .ts-dot { opacity:0.55; }
.ts-item.active .ts-label { font-weight:700; }

.threat-bar { display:flex; gap:4px; flex-wrap:wrap; }
.threat-pill {
  display:flex; align-items:center; gap:0.25rem;
  padding:0.18rem 0.5rem; border-radius:20px;
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  font-weight:600; border:1px solid; transition:all 0.35s; opacity:0.28;
}
.threat-pill.on { opacity:1; }

/* CONTENT */
.content {
  position:relative; z-index:1;
  padding:0.9rem 1.3rem;
  min-height:275px;
}
.shdr { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.85rem; }
.sico {
  width:36px; height:36px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:1rem; flex-shrink:0;
  border:1.5px solid var(--brd2); background:var(--card);
}
.stitle { font-size:0.95rem; font-weight:800; letter-spacing:-0.02em; }
.ssub   { font-family:'Inconsolata', monospace; font-size:0.56rem; color:var(--muted); margin-top:0.03rem; }

/* CHAT */
.chat { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.7rem; }
.msg {
  display:flex; gap:0.4rem; align-items:flex-start;
  opacity:0; transform:translateY(6px); transition:opacity 0.3s, transform 0.3s;
}
.msg.show { opacity:1; transform:translateY(0); }
.msg.r { flex-direction:row-reverse; }
.av {
  width:30px; height:30px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  font-size:0.9rem; flex-shrink:0; border:1px solid var(--brd2); background:var(--card);
}
.bub {
  max-width:82%; padding:0.48rem 0.68rem;
  border-radius:9px; font-size:0.77rem; line-height:1.55;
  border:1px solid var(--brd2); background:var(--card);
}
.bub.l  { border-bottom-left-radius:2px; }
.bub.r2 { border-bottom-right-radius:2px; text-align:right; }
.who {
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  font-weight:600; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.1rem;
}

/* INFO BOX */
.ibox {
  border-radius:8px; padding:0.55rem 0.75rem;
  font-size:0.74rem; line-height:1.55; margin:0.45rem 0;
  border:1px solid var(--brd2); background:var(--card);
  border-left:3px solid var(--sec);
}
.ibox strong { font-weight:700; }
.ibox.warn-b { border-left-color:var(--warn); }
.ibox.warn-b strong { color:var(--warn); }
.ibox.info-b { border-left-color:var(--info); }
.ibox.info-b strong { color:var(--info); }
.ibox.ok-b { border-left-color:var(--ops); }
.ibox.ok-b strong { color:var(--ops); }

/* CHECKLIST */
.cklist { display:flex; flex-direction:column; gap:0.35rem; margin:0.45rem 0; }
.cli {
  display:flex; align-items:flex-start; gap:0.5rem;
  padding:0.42rem 0.65rem; background:var(--card);
  border:1px solid var(--brd2); border-radius:8px;
  font-size:0.75rem; line-height:1.45;
}
.cli-i { flex-shrink:0; font-size:0.88rem; }
.cli strong { display:block; font-weight:700; font-size:0.76rem; margin-bottom:0.03rem; }
.cli span   { color:var(--muted); font-size:0.68rem; font-family:'Inconsolata', monospace; }

/* STRIDE CARD — big */
.stride-card {
  border-radius:11px; padding:0.8rem 0.9rem;
  margin:0.45rem 0; border:2px solid;
}
.sc-header { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.4rem; }
.sc-letter {
  font-family:'Inconsolata', monospace; font-size:2rem; font-weight:800;
  line-height:1; flex-shrink:0; width:36px; text-align:center;
}
.sc-top {
  display:flex; flex-direction:column; gap:0.05rem;
}
.sc-name { font-size:0.95rem; font-weight:800; letter-spacing:-0.02em; }
.sc-prop { font-family:'Inconsolata', monospace; font-size:0.56rem; opacity:0.7; }
.sc-badge {
  font-family:'Inconsolata', monospace; font-size:0.54rem;
  padding:0.12rem 0.5rem; border-radius:3px; border:1px solid;
  font-weight:700; margin-left:auto;
}
.sc-desc { font-size:0.75rem; line-height:1.6; color:rgba(216,228,255,0.85); margin-bottom:0.4rem; }
.sc-example {
  background:var(--surf); border-radius:6px; padding:0.45rem 0.6rem;
  font-size:0.72rem; line-height:1.5;
}
.sc-ex-label {
  font-family:'Inconsolata', monospace; font-size:0.52rem;
  font-weight:700; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.15rem;
}
.sc-mitigation {
  margin-top:0.35rem; font-size:0.7rem;
  font-family:'Inconsolata', monospace; color:var(--ops);
}
.sc-mitigation::before { content:'→ Védelem: '; font-weight:700; }

/* TOOL CARD */
.tool-card {
  border-radius:10px; padding:0.75rem 0.85rem;
  margin:0.35rem 0; border:1.5px solid;
}
.tc-hdr { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem; }
.tc-badge {
  font-family:'Inconsolata', monospace; font-size:0.58rem;
  padding:0.15rem 0.5rem; border-radius:4px; border:1px solid; font-weight:800;
}
.tc-name { font-size:0.85rem; font-weight:800; }
.tc-full { font-family:'Inconsolata', monospace; font-size:0.56rem; opacity:0.7; }
.tc-desc { font-size:0.73rem; line-height:1.55; color:rgba(216,228,255,0.82); }
.tc-tools { display:flex; flex-wrap:wrap; gap:0.3rem; margin-top:0.3rem; }
.tc-tool {
  font-family:'Inconsolata', monospace; font-size:0.56rem;
  padding:0.15rem 0.45rem; border-radius:3px; border:1px solid; font-weight:600;
}

/* VS GRID */
.vs-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }

/* SUMGRID */
.sumgrid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }
.sbox { background:var(--card); border:1px solid var(--brd2); border-radius:8px; padding:0.6rem; text-align:center; }
.sbox .ico { font-size:1.2rem; display:block; margin-bottom:0.15rem; }
.sbox .val { font-size:0.88rem; font-weight:800; }
.sbox .lbl { font-family:'Inconsolata', monospace; font-size:0.52rem; color:var(--muted); margin-top:0.04rem; }

/* PIPELINE SHIFT LEFT VISUAL */
.pipeline-sec {
  display:flex; align-items:stretch; gap:3px;
  border-radius:8px; overflow:hidden; border:1px solid var(--brd2);
  margin:0.45rem 0;
}
.ps-phase {
  flex:1; padding:0.5rem 0.25rem; text-align:center;
  font-family:'Inconsolata', monospace; font-size:0.5rem;
  font-weight:700; line-height:1.3;
  display:flex; flex-direction:column; align-items:center; gap:0.2rem;
}
.ps-icon { font-size:0.85rem; }
.ps-name { font-size:0.46rem; }
.ps-sec {
  font-size:0.42rem; padding:0.1rem 0.25rem; border-radius:2px;
  border:1px solid rgba(239,68,68,0.4); background:rgba(239,68,68,0.1);
  color:var(--sec); font-weight:700; margin-top:0.1rem;
}

/* NAV */
.nav {
  position:sticky; bottom:0; z-index:10;
  background:var(--bg); border-top:1px solid var(--brd2);
  padding:0.7rem 1.3rem; display:flex; align-items:center; gap:0.5rem;
}
.btn {
  font-family:'Inconsolata', monospace; font-size:0.63rem; font-weight:600;
  padding:0.52rem 1rem; border-radius:7px; cursor:pointer;
  transition:all 0.18s; text-transform:uppercase; letter-spacing:0.04em;
}
.btnp { background:transparent; color:var(--muted); border:1px solid var(--brd2); }
.btnp:hover { color:var(--text); }
.btnp:disabled { opacity:0.2; cursor:not-allowed; }
.btnn { flex:1; background:rgba(239,68,68,0.12); color:var(--sec); border:1px solid rgba(239,68,68,0.3); }
.btnn:hover { background:rgba(239,68,68,0.22); }
.ctr { font-family:'Inconsolata', monospace; font-size:0.57rem; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <h1><span>DevSecOps</span><br>&amp; <em>STRIDE</em><br>Szimuláció</h1>
    <div class="tag">Shift Left // Security</div>
  </div>
  <p>// Biztonság minden fázisban — STRIDE · SAST · DAST · IAST · SCA · SIEM</p>
</header>

<div class="sec-board">
  <div class="sb-title">// DevSecOps témakörök — aktuális téma</div>
  <div class="topic-steps" id="topicSteps"></div>
  <div class="threat-bar" id="threatBar"></div>
</div>

<div class="content" id="content"></div>

<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 19</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>

<script>
const TOPICS = [
  { label:'DevSecOps\nalapok', color:'var(--sec)', icon:'🔒' },
  { label:'Shift\nLeft', color:'var(--warn)', icon:'⬅️' },
  { label:'Threat\nModelling', color:'#a855f7', icon:'⚠️' },
  { label:'STRIDE', color:'var(--info)', icon:'🎯' },
  { label:'Security\nStack', color:'var(--sast)', icon:'🧰' },
  { label:'Infra\nSecurity', color:'var(--siem)', icon:'🔐' },
];

const THREATS = [
  { label:'S — Spoofing',    color:'var(--s)', icon:'🎭' },
  { label:'T — Tampering',   color:'var(--t)', icon:'✏️' },
  { label:'R — Repudiation', color:'var(--r)', icon:'🙈' },
  { label:'I — Info Disc.',  color:'var(--i)', icon:'👁️' },
  { label:'D — DoS',         color:'var(--d)', icon:'💥' },
  { label:'E — Elevation',   color:'var(--e)', icon:'⬆️' },
];

const STEPS = [

  // ── 0. BEVEZETŐ ──────────────────────────────────────────────────
  {
    topic:0, threats:[],
    render:()=>`
      <div class="shdr">
        <div class="sico" style="border-color:rgba(239,68,68,0.5)">🔒</div>
        <div><div class="stitle">DevSecOps — Mi és Miért?</div>
        <div class="ssub">// 3.5. — Development · Security · Operations</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--sec)">Oktató</div>
            Mi a különbség a DevOps és a DevSecOps között?
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--dev);text-align:right">Tanuló</div>
            Gondolom valahol bejön a Security is?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--sec)">Oktató</div>
            Pontosan! A DevSecOps a biztonságot a fejlesztési életciklus MINDEN fázisába integrálja — nem csak az utolsó fázisban végzett biztonsági auditot jelent. Ez az alapvető különbség.
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.45s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--dev);text-align:right">Tanuló</div>
            Eddig mikor foglalkoztak a biztonsággal?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.6s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--sec)">Oktató</div>
            A régi megközelítésben a biztonság az utolsó fázisra maradt — sérülékenység tesztelés deploy előtt. Ez drága, lassú és kockázatos. DevSecOps mindezt megváltoztatja.
          </div>
        </div>
      </div>
      <div class="ibox"><strong>DevSecOps célja:</strong> Hatékonyan csökkenteni a biztonsági réseket (sérülékenységeket) tartalmazó kód kiadásának kockázatát. Különösen kritikus nagy felhő-alapú rendszereknél, ahol a komplexitás miatt a manuális biztonsági ellenőrzés nem elegendő.</div>
    `
  },

  // ── 1. DEVOPS VS DEVSECOPS ───────────────────────────────────────
  {
    topic:0, threats:[],
    render:()=>`
      <div class="shdr">
        <div class="sico" style="border-color:rgba(239,68,68,0.5)">⚖️</div>
        <div><div class="stitle">DevOps vs DevSecOps</div>
        <div class="ssub">// mi változik a Security bevezetésével?</div></div>
      </div>
      <div class="vs-grid">
        <div style="background:rgba(16,185,129,0.07);border:1.5px solid rgba(16,185,129,0.3);border-radius:10px;padding:0.75rem">
          <div style="font-family:'Inconsolata',monospace;font-size:0.6rem;color:var(--ops);font-weight:700;margin-bottom:0.35rem">🔄 DevOps</div>
          <div class="rc-list" style="display:flex;flex-direction:column;gap:0.15rem">
            <div style="font-size:0.7rem;color:rgba(200,215,255,0.75);font-family:'Inconsolata',monospace">▸ Plan → Code → Build → Test</div>
            <div style="font-size:0.7rem;color:rgba(200,215,255,0.75);font-family:'Inconsolata',monospace">▸ Release → Deploy → Operate → Monitor</div>
            <div style="font-size:0.7rem;color:rgba(200,215,255,0.75);font-family:'Inconsolata',monospace">▸ Biztonság: tesztelési fázisban</div>
            <div style="font-size:0.7rem;color:rgba(200,215,255,0.75);font-family:'Inconsolata',monospace">▸ CI/CD automatizálva</div>
          </div>
        </div>
        <div style="background:rgba(239,68,68,0.07);border:1.5px solid rgba(239,68,68,0.3);border-radius:10px;padding:0.75rem">
          <div style="font-family:'Inconsolata',monospace;font-size:0.6rem;color:var(--sec);font-weight:700;margin-bottom:0.35rem">🔒 DevSecOps</div>
          <div class="rc-list" style="display:flex;flex-direction:column;gap:0.15rem">
            <div style="font-size:0.7rem;color:rgba(200,215,255,0.75);font-family:'Inconsolata',monospace">▸ Plan: Threat Modelling</div>
            <div style="font-size:0.7rem;color:rgba(200,215,255,0.75);font-family:'Inconsolata',monospace">▸ Code: SAST elemzés</div>
            <div style="font-size:0.7rem;color:rgba(200,215,255,0.75);font-family:'Inconsolata',monospace">▸ Build: SCA dependency scan</div>
            <div style="font-size:0.7rem;color:rgba(200,215,255,0.75);font-family:'Inconsolata',monospace">▸ Test: DAST + etikus hacking</div>
            <div style="font-size:0.7rem;color:rgba(200,215,255,0.75);font-family:'Inconsolata',monospace">▸ Deploy: container security scan</div>
            <div style="font-size:0.7rem;color:rgba(200,215,255,0.75);font-family:'Inconsolata',monospace">▸ Monitor: SIEM + IDS</div>
          </div>
        </div>
      </div>
      <div class="cklist">
        <div class="cli" style="border-left:3px solid var(--sec)">
          <div class="cli-i">👥</div>
          <div><strong>Security mérnök a csapat tagja</strong>
          <span>A kiberbiztonsági architektek és biztonsági mérnökök a fejlesztő csapat SZERVES része — nem kívülről jönnek "auditálni".</span></div>
        </div>
        <div class="cli" style="border-left:3px solid var(--sec)">
          <div class="cli-i">🤝</div>
          <div><strong>Megosztott felelősség</strong>
          <span>Együttműködés és automatizálás révén a csapatok megosztják a biztonsággal kapcsolatos felelősséget — nem csak a "security team" dolga.</span></div>
        </div>
      </div>
      <div class="ibox"><strong>Microsoft SDL:</strong> A Microsoft Security Development Lifecycle (SDL) az egyik legismertebb DevSecOps megközelítés — Microsoft beépítette a biztonsági ellenőrzéseket a fejlesztési folyamat minden fázisába.</div>
    `
  },

  // ── 2. SHIFT LEFT ────────────────────────────────────────────────
  {
    topic:1, threats:[],
    render:()=>`
      <div class="shdr">
        <div class="sico" style="border-color:rgba(245,158,11,0.5)">⬅️</div>
        <div><div class="stitle">"Shift Left" — a DevSecOps mantra</div>
        <div class="ssub">// tolja a biztonságot balra — kezdd KORÁN!</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--warn)">Oktató</div>
            A "shift left" azt jelenti: toljuk a biztonságot a DevOps pipeline jobb oldaláról — a végéről — a bal oldalára, az elejére. Ez az egész DevSecOps gondolkodás alappillére.
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">

  },
];

function renderBoard(topicIdx, activeThreats) {
  document.getElementById('topicSteps').innerHTML = TOPICS.map((t,i) => {
    const on = i === topicIdx;
    const done = i < topicIdx;
    const cls = on ? 'active' : done ? 'done' : '';
    const c = on ? t.color : done ? t.color : 'var(--muted)';
    return `<div class="ts-item ${cls}">
      <div class="ts-dot" style="border-color:${c};color:${c}">${t.icon}</div>
      <div class="ts-label" style="color:${on?t.color:'var(--muted)'}">${t.label.replace('\n','<br>')}</div>
    </div>`;
  }).join('');

  document.getElementById('threatBar').innerHTML = THREATS.map((t,i) => {
    const on = activeThreats.includes(i);
    return `<div class="threat-pill ${on?'on':''}" style="border-color:${t.color};color:${t.color}">
      ${t.icon} ${t.label}
    </div>`;
  }).join('');
}

let cur = 0;

function render() {
  const s = STEPS[cur];
  renderBoard(s.topic, s.threats);

  const el = document.getElementById('content');
  el.innerHTML = s.render();
  setTimeout(() => {
    el.querySelectorAll('.msg:not(.show)').forEach((m,i) => {
      setTimeout(() => m.classList.add('show'), i*160);
    });
  }, 60);

  document.getElementById('bprev').disabled = cur === 0;
  const bn = document.getElementById('bnext');
  bn.textContent = cur === STEPS.length - 1 ? '↺ Újra' : 'Következő →';
  document.getElementById('ctr').textContent = `${cur+1} / ${STEPS.length}`;
}

function next() { cur = cur === STEPS.length-1 ? 0 : cur+1; render(); }
function prev() { if(cur>0){cur--;render();} }

render();
</script>
</body>
</html>
