<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps &amp; DevSecOps Szimuláció</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');

:root {
  --bg:    #0a0f1e;
  --surf:  #0f1628;
  --card:  #141d35;
  --brd:   #1e2d50;
  --brd2:  #263a68;
  --text:  #d8e4ff;
  --muted: #4a5f8a;
  --dim:   #111830;

  /* Szerepkörök / csapatok */
  --dev:   #3b82f6;   /* Dev csapat */
  --ops:   #10b981;   /* Ops csapat */
  --sec:   #ef4444;   /* Security */
  --all:   #f97316;   /* DevOps közös */

  /* Fázisok */
  --plan:    #f59e0b;
  --code:    #3b82f6;
  --build:   #6366f1;
  --test:    #a855f7;
  --release: #10b981;
  --deploy:  #22d3ee;
  --operate: #f97316;
  --monitor: #ef4444;

  /* Egyéb */
  --ci:  #6366f1;
  --cd:  #22d3ee;
  --iac: #a855f7;
  --auto:#f59e0b;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:'Sora', sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(249,115,22,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(59,130,246,0.05) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

/* ── HEADER ── */
header {
  position:relative; z-index:1;
  padding:1.2rem 1.3rem 0.85rem;
  border-bottom:1px solid var(--brd2);
  background:linear-gradient(180deg, rgba(249,115,22,0.05) 0%, transparent 100%);
}

.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }

h1 { font-size:1.4rem; font-weight:800; line-height:1.07; letter-spacing:-0.02em; }
h1 span { color:var(--all); }
h1 em   { font-style:normal; color:var(--sec); }

.tag {
  font-family:'Inconsolata', monospace; font-size:0.56rem;
  padding:0.25rem 0.55rem; border-radius:4px;
  background:rgba(249,115,22,0.12); color:var(--all);
  border:1px solid rgba(249,115,22,0.28); white-space:nowrap; margin-top:0.2rem;
}

header p { font-size:0.7rem; color:var(--muted); margin-top:0.25rem; font-family:'Inconsolata', monospace; }

/* ── PIPELINE BOARD (top visualizer) ── */
.pboard {
  position:relative; z-index:1;
  background:var(--surf);
  border-bottom:1px solid var(--brd2);
  padding:0.75rem 1.3rem 0.65rem;
}

.pb-title {
  font-family:'Inconsolata', monospace; font-size:0.54rem;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.09em;
  margin-bottom:0.55rem;
}

/* Pipeline 8 fázis */
.pipeline {
  display:flex; align-items:center; gap:0; margin-bottom:0.5rem;
}

.pl-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:0.2rem;
  position:relative;
}

.pl-item:not(:last-child)::after {
  content:'';
  position:absolute; right:0; top:12px;
  width:50%; height:2px;
  background:var(--brd);
  z-index:0;
}

.pl-item:not(:first-child)::before {
  content:'';
  position:absolute; left:0; top:12px;
  width:50%; height:2px;
  background:var(--brd);
  z-index:0;
}

.pl-dot {
  width:24px; height:24px; border-radius:50%;
  border:2px solid var(--brd2); background:var(--card);
  display:flex; align-items:center; justify-content:center;
  font-size:0.6rem; z-index:1; transition:all 0.4s;
  position:relative;
}

.pl-label {
  font-family:'Inconsolata', monospace; font-size:0.46rem;
  color:var(--muted); text-align:center; line-height:1.2;
}

.pl-item.active .pl-dot { transform:scale(1.25); box-shadow:0 0 10px currentColor; }
.pl-item.done   .pl-dot { opacity:0.6; }
.pl-item.active .pl-label { font-weight:600; }

/* Dev / Ops chip sor */
.team-chips {
  display:flex; gap:4px; flex-wrap:wrap;
}

.team-chip {
  display:flex; align-items:center; gap:0.25rem;
  padding:0.18rem 0.5rem; border-radius:20px;
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  font-weight:600; border:1px solid; transition:all 0.35s;
  opacity:0.28;
}
.team-chip.on { opacity:1; }

/* ── CONTENT ── */
.content {
  position:relative; z-index:1;
  padding:0.9rem 1.3rem;
  min-height:275px;
}

.shdr { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.85rem; }

.sico {
  width:36px; height:36px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:1rem; flex-shrink:0;
  border:1.5px solid var(--brd2); background:var(--card);
}

.stitle { font-size:0.95rem; font-weight:800; letter-spacing:-0.02em; }
.ssub   { font-family:'Inconsolata', monospace; font-size:0.56rem; color:var(--muted); margin-top:0.03rem; }

/* CHAT */
.chat { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.7rem; }

.msg {
  display:flex; gap:0.4rem; align-items:flex-start;
  opacity:0; transform:translateY(6px);
  transition:opacity 0.3s, transform 0.3s;
}
.msg.show { opacity:1; transform:translateY(0); }
.msg.r { flex-direction:row-reverse; }

.av {
  width:30px; height:30px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  font-size:0.9rem; flex-shrink:0;
  border:1px solid var(--brd2); background:var(--card);
}

.bub {
  max-width:82%; padding:0.48rem 0.68rem;
  border-radius:9px; font-size:0.77rem; line-height:1.55;
  border:1px solid var(--brd2); background:var(--card);
}
.bub.l  { border-bottom-left-radius:2px; }
.bub.r2 { border-bottom-right-radius:2px; text-align:right; }

.who {
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  font-weight:600; text-transform:uppercase; letter-spacing:0.05em;
  margin-bottom:0.1rem;
}

/* ROLE / INFO CARD */
.role-card {
  border-radius:11px; padding:0.85rem 1rem;
  margin-bottom:0.7rem; border:2px solid;
  display:flex; gap:0.7rem; align-items:flex-start;
}

.rc-icon { font-size:1.8rem; flex-shrink:0; }
.rc-badge {
  font-family:'Inconsolata', monospace; font-size:0.57rem;
  font-weight:600; text-transform:uppercase; letter-spacing:0.06em;
  margin-bottom:0.25rem; opacity:0.8;
}
.rc-name  { font-size:0.98rem; font-weight:800; margin-bottom:0.3rem; letter-spacing:-0.02em; }
.rc-desc  { font-size:0.75rem; line-height:1.6; color:rgba(216,228,255,0.85); }
.rc-list  { margin-top:0.4rem; display:flex; flex-direction:column; gap:0.15rem; }
.rc-item  { font-size:0.7rem; color:rgba(200,215,255,0.75); font-family:'Inconsolata', monospace; }
.rc-item::before { content:'▸ '; opacity:0.6; }

/* PHASE CARD */
.phase-card {
  border-radius:10px; padding:0.75rem 0.85rem;
  margin:0.45rem 0; border:1.5px solid;
}
.ph-hdr { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem; }
.ph-icon { font-size:1.1rem; }
.ph-name { font-size:0.85rem; font-weight:800; letter-spacing:-0.01em; }
.ph-badge { font-family:'Inconsolata', monospace; font-size:0.53rem; padding:0.1rem 0.4rem; border-radius:3px; border:1px solid; font-weight:600; }
.ph-desc { font-size:0.74rem; line-height:1.55; color:rgba(216,228,255,0.82); }

/* INFO BOX */
.ibox {
  border-radius:8px; padding:0.55rem 0.75rem;
  font-size:0.74rem; line-height:1.55; margin:0.45rem 0;
  border:1px solid var(--brd2); background:var(--card);
  border-left:3px solid var(--all);
}
.ibox strong { font-weight:700; }
.ibox.dev-b  { border-left-color:var(--dev); }
.ibox.dev-b strong  { color:var(--dev); }
.ibox.ops-b  { border-left-color:var(--ops); }
.ibox.ops-b strong  { color:var(--ops); }
.ibox.sec-b  { border-left-color:var(--sec); }
.ibox.sec-b strong  { color:var(--sec); }
.ibox.ci-b   { border-left-color:var(--ci); }
.ibox.ci-b strong   { color:var(--ci); }
.ibox.cd-b   { border-left-color:var(--cd); }
.ibox.cd-b strong   { color:var(--cd); }
.ibox.iac-b  { border-left-color:var(--iac); }
.ibox.iac-b strong  { color:var(--iac); }

/* CHECKLIST */
.cklist { display:flex; flex-direction:column; gap:0.35rem; margin:0.45rem 0; }
.cli {
  display:flex; align-items:flex-start; gap:0.5rem;
  padding:0.42rem 0.65rem; background:var(--card);
  border:1px solid var(--brd2); border-radius:8px;
  font-size:0.75rem; line-height:1.45;
}
.cli-i { flex-shrink:0; font-size:0.88rem; }
.cli strong { display:block; font-weight:700; font-size:0.76rem; margin-bottom:0.03rem; }
.cli span   { color:var(--muted); font-size:0.68rem; font-family:'Inconsolata', monospace; }

/* SUMGRID */
.sumgrid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }
.sbox { background:var(--card); border:1px solid var(--brd2); border-radius:8px; padding:0.6rem; text-align:center; }
.sbox .ico { font-size:1.2rem; display:block; margin-bottom:0.15rem; }
.sbox .val { font-size:0.88rem; font-weight:800; }
.sbox .lbl { font-family:'Inconsolata', monospace; font-size:0.52rem; color:var(--muted); margin-top:0.04rem; }

/* TOOLS GRID */
.tools-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }
.tool-cat { background:var(--card); border:1px solid var(--brd2); border-radius:8px; padding:0.55rem 0.65rem; }
.tc-name { font-family:'Inconsolata', monospace; font-size:0.57rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.2rem; }
.tc-tools { font-size:0.68rem; color:var(--muted); line-height:1.5; }

/* STRIDE TABELLE */
.stride-table { border-radius:9px; overflow:hidden; border:1.5px solid var(--brd2); margin:0.45rem 0; }
.st-hdr {
  display:grid; grid-template-columns:28px 90px 1fr;
  background:var(--surf); border-bottom:1px solid var(--brd2);
  padding:0.35rem 0.65rem; gap:0.5rem;
  font-family:'Inconsolata', monospace; font-size:0.52rem;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.07em;
}
.st-row {
  display:grid; grid-template-columns:28px 90px 1fr;
  padding:0.38rem 0.65rem; gap:0.5rem;
  border-bottom:1px solid var(--brd); font-size:0.7rem;
  align-items:center;
}
.st-row:last-child { border-bottom:none; }
.st-letter { font-family:'Inconsolata', monospace; font-size:0.75rem; font-weight:800; }
.st-threat { font-weight:700; font-size:0.72rem; }
.st-desc { font-size:0.67rem; color:var(--muted); line-height:1.4; }

/* VS GRID */
.vs-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }

/* LIFECYCLE VISUAL - big */
.lifecycle-vis {
  background:var(--card); border:1.5px solid var(--brd2);
  border-radius:9px; overflow:hidden; margin:0.45rem 0;
}
.lv-hdr {
  font-family:'Inconsolata', monospace; font-size:0.56rem; color:var(--muted);
  padding:0.3rem 0.7rem; border-bottom:1px solid var(--brd);
  background:var(--surf); display:flex; align-items:center; gap:0.4rem;
  text-transform:uppercase; letter-spacing:0.07em;
}
.lv-row {
  display:flex; align-items:center; gap:0.5rem;
  padding:0.38rem 0.7rem; border-bottom:1px solid var(--brd);
  font-size:0.72rem;
}
.lv-row:last-child { border-bottom:none; }
.lv-phase {
  font-family:'Inconsolata', monospace; font-size:0.6rem;
  font-weight:700; width:60px; flex-shrink:0;
}
.lv-desc { flex:1; color:rgba(216,228,255,0.82); font-size:0.7rem; }
.lv-badge {
  font-family:'Inconsolata', monospace; font-size:0.5rem;
  padding:0.1rem 0.35rem; border-radius:3px; border:1px solid;
  font-weight:600; flex-shrink:0;
}

/* SECURITY STACK */
.sec-stack { display:flex; flex-direction:column; gap:0.35rem; margin:0.45rem 0; }
.sec-item {
  background:var(--card); border:1px solid var(--brd2); border-radius:8px;
  padding:0.45rem 0.65rem; display:flex; gap:0.5rem; align-items:flex-start;
}
.si-badge {
  font-family:'Inconsolata', monospace; font-size:0.55rem;
  padding:0.15rem 0.45rem; border-radius:4px; border:1px solid;
  font-weight:700; flex-shrink:0; margin-top:0.05rem;
}
.si-name { font-size:0.77rem; font-weight:700; margin-bottom:0.05rem; }
.si-desc { font-size:0.68rem; color:var(--muted); line-height:1.45; font-family:'Inconsolata', monospace; }

/* SHIFT LEFT VISUAL */
.shift-vis {
  background:var(--card); border:1.5px solid var(--brd2);
  border-radius:9px; padding:0.7rem; margin:0.45rem 0;
}
.sv-arrow {
  display:flex; align-items:center; gap:0;
  margin-bottom:0.5rem;
}
.sv-block {
  flex:1; padding:0.35rem 0.3rem; text-align:center;
  font-family:'Inconsolata', monospace; font-size:0.52rem;
  font-weight:700; border-radius:4px;
}
.sv-sep { font-size:0.7rem; color:var(--muted); padding:0 0.15rem; }
.sv-legend { display:flex; gap:0.8rem; font-family:'Inconsolata', monospace; font-size:0.52rem; color:var(--muted); margin-top:0.35rem; }

/* NAV */
.nav {
  position:sticky; bottom:0; z-index:10;
  background:var(--bg); border-top:1px solid var(--brd2);
  padding:0.7rem 1.3rem; display:flex; align-items:center; gap:0.5rem;
}
.btn {
  font-family:'Inconsolata', monospace; font-size:0.63rem; font-weight:600;
  padding:0.52rem 1rem; border-radius:7px; cursor:pointer;
  transition:all 0.18s; text-transform:uppercase; letter-spacing:0.04em;
}
.btnp { background:transparent; color:var(--muted); border:1px solid var(--brd2); }
.btnp:hover { color:var(--text); }
.btnp:disabled { opacity:0.2; cursor:not-allowed; }
.btnn { flex:1; background:rgba(249,115,22,0.12); color:var(--all); border:1px solid rgba(249,115,22,0.3); }
.btnn:hover { background:rgba(249,115,22,0.22); }
.ctr { font-family:'Inconsolata', monospace; font-size:0.57rem; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <h1><span>DevOps</span> &amp;<br><em>DevSecOps</em><br>Szimuláció</h1>
    <div class="tag">2009 // első DevOpsDays</div>
  </div>
  <p>// Elvek · Gyakorlatok · Életciklus · Biztonság</p>
</header>

<!-- PIPELINE BOARD -->
<div class="pboard">
  <div class="pb-title">// DevOps pipeline — 8 fázis</div>
  <div class="pipeline" id="pipeline"></div>
  <div class="team-chips" id="teamChips"></div>
</div>

<div class="content" id="content"></div>

<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 21</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>

<script>
const PHASES = [
  { label:'Plan',    color:'var(--plan)',    icon:'📋' },
  { label:'Code',    color:'var(--code)',    icon:'💻' },
  { label:'Build',   color:'var(--build)',   icon:'🔨' },
  { label:'Test',    color:'var(--test)',    icon:'🧪' },
  { label:'Release', color:'var(--release)', icon:'📦' },
  { label:'Deploy',  color:'var(--deploy)',  icon:'🚀' },
  { label:'Operate', color:'var(--operate)', icon:'⚙️' },
  { label:'Monitor', color:'var(--monitor)', icon:'📊' },
];

const TEAMS = [
  { label:'Dev csapat', color:'var(--dev)', icon:'💻' },
  { label:'Ops csapat', color:'var(--ops)', icon:'⚙️' },
  { label:'Security',   color:'var(--sec)', icon:'🔒' },
];

const STEPS = [

  // ── 0. BEVEZETŐ ──────────────────────────────────────────────────
  {
    phases:[], teams:[],
    render:()=>`
      <div class="shdr"><div class="sico">🔄</div>
        <div><div class="stitle">Mi a DevOps?</div>
        <div class="ssub">// 2009, az első DevOpsDays — Patrick Debois</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--all)">Oktató</div>
            A DevOps szoftverfejlesztési gyakorlatok és eszközök összessége, amelyek magukba foglalják és automatizálják a szoftverfejlesztést (Dev) és az informatikai üzemeltetést (Ops) a szoftver teljes életciklusára.
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--dev);text-align:right">Tanuló</div>
            Mikor jött létre? Ki találta ki?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--all)">Oktató</div>
            2009-ben — ekkor volt az első DevOpsDays konferencia. A XXI. század szoftverfejlesztési gyakorlata. A fejlesztők és üzemeltetők közösen dolgoznak — mindenki felelős a termékért.
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.45s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--dev);text-align:right">Tanuló</div>
            Mi volt a probléma a régi megközelítéssel?
          </div>
        </div>
        <div class="msg show" style="transition-delay:.6s">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--all)">Oktató</div>
            A fejlesztők és üzemeltetők külön silókban dolgoztak — egymásnak dobálták át a munkát, rengeteg félreértéssel, lassúsággal. A DevOps ezt töri le.
          </div>
        </div>
      </div>
      <div class="ibox"><strong>DevOps = Dev + Ops:</strong> A fejlesztői (Development) és az üzemeltetői (Operations) csapatok közös felelőssége a termék teljes életciklusa alatt — a tervezéstől a monitorozásig.</div>
    `
  },

  // ── 1. DEV VS OPS PROBLÉMA ────────────────────────────────────────
  {
    phases:[], teams:[0,1],
    render:()=>`
      <div class="shdr"><div class="sico">🧱</div>
        <div><div class="stitle">A hagyományos "siló" probléma</div>
        <div class="ssub">// dev vs ops — az "átdobás a falon" kultúra</div></div>
      </div>
      <div class="vs-grid">
        <div style="background:rgba(59,130,246,0.08);border:1.5px solid rgba(59,130,246,0.3);border-radius:10px;padding:0.75rem">
          <div style="font-family:'Inconsolata',monospace;font-size:0.6rem;color:var(--dev);font-weight:700;margin-bottom:0.35rem">💻 DEV — Fejlesztők</div>
          <div class="rc-list">
            <div class="rc-item">Céljuk: minél több funkciót kiadni</div>
            <div class="rc-item">Szívesen változtatnak a kódon</div>
            <div class="rc-item">Folyamatos újítás, iteráció</div>
            <div class="rc-item" style="color:#ef4444">❌ "Ez nem az én feladatom, ha élesbe kerül"</div>
          </div>
        </div>
        <div style="background:rgba(16,185,129,0.08);border:1.5px solid rgba(16,185,129,0.3);border-radius:10px;padding:0.75rem">
          <div style="font-family:'Inconsolata',monospace;font-size:0.6rem;color:var(--ops);font-weight:700;margin-bottom:0.35rem">⚙️ OPS — Üzemeltetők</div>
          <div class="rc-list">
            <div class="rc-item">Céljuk: stabilitás és megbízhatóság</div>
            <div class="rc-item">Változástól félnek (leállás kockázata)</div>
            <div class="rc-item">Lassú, gondos deploy folyamat</div>
            <div class="rc-item" style="color:#ef4444">❌ "Miért nem tesztelték rendesen?"</div>
          </div>
        </div>
      </div>

// ── RENDER BOARD ─────────────────────────────────────────────────────
function renderBoard(activePhases, activeTeams) {
  document.getElementById('pipeline').innerHTML = PHASES.map((p,i) => {
    const on = activePhases.includes(i);
    const cls = on ? 'active' : '';
    const c = on ? p.color : 'var(--muted)';
    return `<div class="pl-item ${cls}">
      <div class="pl-dot" style="border-color:${c};color:${c}">${p.icon}</div>
      <div class="pl-label" style="color:${on?p.color:'var(--muted)'}">${p.label}</div>
    </div>`;
  }).join('');

  document.getElementById('teamChips').innerHTML = TEAMS.map((t,i) => {
    const on = activeTeams.includes(i);
    return `<div class="team-chip ${on?'on':''}" style="border-color:${t.color};color:${t.color}">
      ${t.icon} ${t.label}
    </div>`;
  }).join('');
}

let cur = 0;

function render() {
  const s = STEPS[cur];
  renderBoard(s.phases, s.teams);

  const el = document.getElementById('content');
  el.innerHTML = s.render();

  setTimeout(() => {
    el.querySelectorAll('.msg:not(.show)').forEach((m, i) => {
      setTimeout(() => m.classList.add('show'), i * 160);
    });
  }, 60);

  document.getElementById('bprev').disabled = cur === 0;
  const bn = document.getElementById('bnext');
  bn.textContent = cur === STEPS.length - 1 ? '↺ Újra' : 'Következő →';
  document.getElementById('ctr').textContent = `${cur + 1} / ${STEPS.length}`;
}

function next() { cur = cur === STEPS.length - 1 ? 0 : cur + 1; render(); }
function prev() { if (cur > 0) { cur--; render(); } }

render();
</script>
