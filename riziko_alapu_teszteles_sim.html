<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizikó Alapú Tesztelés</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');

:root {
  --bg:    #0a0f1e;
  --surf:  #0f1628;
  --card:  #141d35;
  --brd:   #1e2d50;
  --brd2:  #263a68;
  --text:  #d8e4ff;
  --muted: #4a5f8a;

  --rbt:  #a855f7;
  --high: #ef4444;
  --med:  #f59e0b;
  --low:  #10b981;
  --blue: #3b82f6;
  --acc:  #a855f7;

  --prob: #3b82f6;
  --kar:  #ef4444;
  --kih:  #f59e0b;
  --teff: #10b981;
  --prio: #a855f7;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Sora',sans-serif; min-height:100vh; overflow-x:hidden; }
body::before {
  content:''; position:fixed; inset:0;
  background: radial-gradient(ellipse at 20% 0%, rgba(168,85,247,0.06) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 100%, rgba(239,68,68,0.04) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

header {
  position:relative; z-index:1; padding:1.2rem 1.3rem 0.85rem;
  border-bottom:1px solid var(--brd2);
  background:linear-gradient(180deg, rgba(168,85,247,0.06) 0%, transparent 100%);
}
.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }
h1 { font-size:1.4rem; font-weight:800; line-height:1.07; letter-spacing:-0.02em; }
h1 span { color:var(--rbt); }
h1 em { font-style:normal; color:var(--med); }
.tag { font-family:'Inconsolata',monospace; font-size:0.56rem; padding:0.25rem 0.55rem; border-radius:4px; background:rgba(168,85,247,0.12); color:var(--rbt); border:1px solid rgba(168,85,247,0.28); white-space:nowrap; margin-top:0.2rem; }
header p { font-size:0.7rem; color:var(--muted); margin-top:0.25rem; font-family:'Inconsolata',monospace; }

/* TOP BAR */
.topbar { position:relative; z-index:1; background:var(--surf); border-bottom:1px solid var(--brd2); padding:0.75rem 1.3rem 0.65rem; }
.tb-title { font-family:'Inconsolata',monospace; font-size:0.54rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.09em; margin-bottom:0.5rem; }
.rbt-steps { display:flex; align-items:center; gap:0; margin-bottom:0.45rem; }
.rs-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:0.18rem; position:relative; }
.rs-item:not(:last-child)::after { content:''; position:absolute; right:0; top:12px; width:50%; height:2px; background:var(--brd); z-index:0; }
.rs-item:not(:first-child)::before { content:''; position:absolute; left:0; top:12px; width:50%; height:2px; background:var(--brd); z-index:0; }
.rs-dot { width:24px; height:24px; border-radius:50%; border:2px solid var(--brd2); background:var(--card); display:flex; align-items:center; justify-content:center; font-size:0.6rem; z-index:1; transition:all 0.35s; position:relative; }
.rs-label { font-family:'Inconsolata',monospace; font-size:0.44rem; color:var(--muted); text-align:center; line-height:1.2; }
.rs-item.active .rs-dot { transform:scale(1.25); box-shadow:0 0 10px currentColor; }
.rs-item.done .rs-dot { opacity:0.55; }
.rs-item.active .rs-label { font-weight:700; }
.formula-bar { display:flex; align-items:center; gap:0.35rem; flex-wrap:wrap; }
.fb-part { font-family:'Inconsolata',monospace; font-size:0.58rem; font-weight:700; padding:0.15rem 0.45rem; border-radius:4px; border:1px solid; opacity:0.25; transition:opacity 0.3s; }
.fb-part.on { opacity:1; }
.fb-op { font-family:'Inconsolata',monospace; font-size:0.65rem; color:var(--muted); opacity:0.4; }
.fb-op.on { opacity:1; color:var(--text); }

/* CONTENT */
.content { position:relative; z-index:1; padding:0.9rem 1.3rem; min-height:275px; }
.shdr { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.85rem; }
.sico { width:36px; height:36px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1rem; border:1.5px solid var(--brd2); background:var(--card); }
.stitle { font-size:0.95rem; font-weight:800; letter-spacing:-0.02em; }
.ssub { font-family:'Inconsolata',monospace; font-size:0.56rem; color:var(--muted); margin-top:0.03rem; }

/* CHAT */
.chat { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.7rem; }
.msg { display:flex; gap:0.4rem; align-items:flex-start; opacity:0; transform:translateY(6px); transition:opacity 0.3s, transform 0.3s; }
.msg.show { opacity:1; transform:translateY(0); }
.msg.r { flex-direction:row-reverse; }
.av { width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; flex-shrink:0; border:1px solid var(--brd2); background:var(--card); }
.bub { max-width:82%; padding:0.48rem 0.68rem; border-radius:9px; font-size:0.77rem; line-height:1.55; border:1px solid var(--brd2); background:var(--card); }
.bub.l { border-bottom-left-radius:2px; }
.bub.r2 { border-bottom-right-radius:2px; text-align:right; }
.who { font-family:'Inconsolata',monospace; font-size:0.55rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.1rem; }

/* IBOX */
.ibox { border-radius:8px; padding:0.55rem 0.75rem; font-size:0.74rem; line-height:1.55; margin:0.45rem 0; border:1px solid var(--brd2); background:var(--card); border-left:3px solid var(--rbt); }
.ibox strong { font-weight:700; }
.ibox.ok-b { border-left-color:var(--low); }
.ibox.ok-b strong { color:var(--low); }
.ibox.warn-b { border-left-color:var(--med); }
.ibox.warn-b strong { color:var(--med); }

/* CHECKLIST */
.cklist { display:flex; flex-direction:column; gap:0.35rem; margin:0.45rem 0; }
.cli { display:flex; align-items:flex-start; gap:0.5rem; padding:0.42rem 0.65rem; background:var(--card); border:1px solid var(--brd2); border-radius:8px; font-size:0.75rem; line-height:1.45; }
.cli-i { flex-shrink:0; font-size:0.88rem; }
.cli strong { display:block; font-weight:700; font-size:0.76rem; margin-bottom:0.03rem; }
.cli span { color:var(--muted); font-size:0.68rem; font-family:'Inconsolata',monospace; }

/* SKÁLA */
.scale-grid { display:flex; flex-direction:column; gap:0.28rem; margin:0.45rem 0; }
.scale-row { display:flex; align-items:center; gap:0.5rem; padding:0.38rem 0.65rem; background:var(--card); border-radius:7px; border:1px solid var(--brd2); font-size:0.72rem; }
.scale-num { font-family:'Inconsolata',monospace; font-size:0.75rem; font-weight:800; width:20px; flex-shrink:0; text-align:center; }
.scale-pct { font-family:'Inconsolata',monospace; font-size:0.58rem; color:var(--muted); width:55px; flex-shrink:0; }
.scale-bar { height:8px; border-radius:3px; flex-shrink:0; }
.scale-desc { flex:1; color:rgba(216,228,255,0.82); line-height:1.4; }

/* FOLYAMAT LÉPÉSEK */
.flow-steps { display:flex; flex-direction:column; gap:0.35rem; margin:0.45rem 0; }
.flow-step { display:flex; align-items:flex-start; gap:0.5rem; padding:0.5rem 0.65rem; background:var(--card); border-radius:9px; border:1px solid var(--brd2); }
.fs-num { font-family:'Inconsolata',monospace; font-size:0.65rem; font-weight:800; flex-shrink:0; margin-top:0.05rem; width:22px; }
.fs-title { font-size:0.8rem; font-weight:800; margin-bottom:0.08rem; }
.fs-desc { font-size:0.7rem; color:var(--muted); line-height:1.4; font-family:'Inconsolata',monospace; }

/* RIZIKÓ TÁBLÁZAT */
.risk-table { border-radius:9px; overflow:hidden; border:1.5px solid var(--brd2); margin:0.45rem 0; }
.rt-hdr { display:grid; background:var(--surf); padding:0.32rem 0.5rem; gap:0.3rem; font-family:'Inconsolata',monospace; font-size:0.5rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; border-bottom:1px solid var(--brd); align-items:center; }
.rt-row { display:grid; padding:0.38rem 0.5rem; gap:0.3rem; border-bottom:1px solid var(--brd); font-size:0.68rem; align-items:center; transition:background 0.3s; }
.rt-row:last-child { border-bottom:none; }
.rt-row.highlight { background:rgba(168,85,247,0.08); }
.rt-risk { font-size:0.68rem; line-height:1.3; }
.rt-num { font-family:'Inconsolata',monospace; font-size:0.72rem; font-weight:800; text-align:center; }
.rt-empty { font-family:'Inconsolata',monospace; font-size:0.6rem; color:var(--brd2); text-align:center; }

/* FORMULA BLOCK */
.formula-block { background:var(--card); border:1.5px solid var(--brd2); border-radius:9px; padding:0.65rem 0.75rem; margin:0.45rem 0; text-align:center; }
.fb-title { font-family:'Inconsolata',monospace; font-size:0.52rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:0.35rem; }
.fb-formula { font-family:'Inconsolata',monospace; font-size:0.85rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:0.5rem; flex-wrap:wrap; }
.fb-term { padding:0.2rem 0.55rem; border-radius:5px; border:1px solid; }

/* PRIORITÁS LISTA */
.prio-list { display:flex; flex-direction:column; gap:0.3rem; margin:0.45rem 0; }
.prio-row { display:flex; align-items:center; gap:0.55rem; padding:0.45rem 0.7rem; background:var(--card); border-radius:8px; border:1px solid var(--brd2); }
.pr-rank { font-family:'Inconsolata',monospace; font-size:0.7rem; font-weight:800; width:20px; flex-shrink:0; text-align:center; }
.pr-name { flex:1; font-size:0.72rem; line-height:1.3; }
.pr-score { font-family:'Inconsolata',monospace; font-size:0.68rem; font-weight:800; flex-shrink:0; }
.pr-bar-wrap { width:70px; flex-shrink:0; }
.pr-bar { height:6px; border-radius:3px; }

/* SCRUM FLOW */
.scrum-flow { background:var(--card); border:1.5px solid var(--brd2); border-radius:9px; padding:0.65rem 0.75rem; margin:0.45rem 0; }
.sf2-title { font-family:'Inconsolata',monospace; font-size:0.52rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:0.45rem; }
.sf2-row { display:flex; align-items:center; gap:0.35rem; font-size:0.7rem; margin:0.28rem 0; flex-wrap:wrap; }
.sf2-box { padding:0.28rem 0.5rem; border-radius:5px; border:1px solid; font-family:'Inconsolata',monospace; font-size:0.58rem; font-weight:700; flex-shrink:0; }
.sf2-arr { color:var(--muted); font-size:0.7rem; }
.sf2-desc { color:var(--muted); font-size:0.64rem; }

/* SUMGRID */
.sumgrid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }
.sbox { background:var(--card); border:1px solid var(--brd2); border-radius:8px; padding:0.6rem; text-align:center; }
.sbox .ico { font-size:1.2rem; display:block; margin-bottom:0.15rem; }
.sbox .val { font-size:0.88rem; font-weight:800; }
.sbox .lbl { font-family:'Inconsolata',monospace; font-size:0.52rem; color:var(--muted); margin-top:0.04rem; }

/* NAV */
.nav { position:sticky; bottom:0; z-index:10; background:var(--bg); border-top:1px solid var(--brd2); padding:0.7rem 1.3rem; display:flex; align-items:center; gap:0.5rem; }
.btn { font-family:'Inconsolata',monospace; font-size:0.63rem; font-weight:600; padding:0.52rem 1rem; border-radius:7px; cursor:pointer; transition:all 0.18s; text-transform:uppercase; letter-spacing:0.04em; }
.btnp { background:transparent; color:var(--muted); border:1px solid var(--brd2); }
.btnp:hover { color:var(--text); }
.btnp:disabled { opacity:0.2; cursor:not-allowed; }
.btnn { flex:1; background:rgba(168,85,247,0.12); color:var(--rbt); border:1px solid rgba(168,85,247,0.3); }
.btnn:hover { background:rgba(168,85,247,0.22); }
.ctr { font-family:'Inconsolata',monospace; font-size:0.57rem; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <h1><span>Rizikó</span><br>Alapú<br><em>Tesztelés</em></h1>
    <div class="tag">RBT // evosoft</div>
  </div>
  <p>// Azonosítás · Analízis · Reagálás · Prioritizálás · Teszttervezés</p>
</header>

<div class="topbar">
  <div class="tb-title">// RBT folyamat lépései</div>
  <div class="rbt-steps" id="rbtSteps"></div>
  <div class="formula-bar" id="formulaBar"></div>
</div>

<div class="content" id="content"></div>

<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 18</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>

<script>
const PHASES = [
  { label:'Tesztelés\nalapjai',    color:'var(--blue)', icon:'📋' },
  { label:'Rizikó\nazonosítás',   color:'var(--rbt)',  icon:'🔍' },
  { label:'Rizikó\nanalízis',     color:'var(--med)',  icon:'📊' },
  { label:'Prioriti\nzálás',      color:'var(--high)', icon:'🎯' },
  { label:'Teszт\ntervezés',      color:'var(--low)',  icon:'✅' },
  { label:'Scrum\n& Összef.',     color:'#22d3ee',    icon:'∑'  },
];

const FORMULA_PARTS = [
  { label:'Valószínűség',  color:'var(--prob)', on:false },
  { label:'×', op:true },
  { label:'Kár',           color:'var(--kar)',  on:false },
  { label:'=', op:true },
  { label:'Kihatás',       color:'var(--kih)',  on:false },
  { label:'×', op:true },
  { label:'Teszt hatékonyság', color:'var(--teff)', on:false },
  { label:'=', op:true },
  { label:'PRIORITÁS',     color:'var(--prio)', on:false },
];

// Az Android osztott képernyő rizikók
const RISKS = [
  { name:'A Vissza gomb rossz alkalmazást zár be', prob:2, kar:3, kihatas:6, teff:3, prio:18 },
  { name:'A billentyűzet a másik alkalmazásban lesz aktív', prob:3, kar:5, kihatas:15, teff:5, prio:75 },
  { name:'Kétujjas nagyítás nem jól működik', prob:5, kar:2, kihatas:10, teff:2, prio:20 },
  { name:'Hang megosztása nem működik jól', prob:1, kar:1, kihatas:1, teff:4, prio:4 },
  { name:'Túl gyorsan lemeríti az akkut', prob:4, kar:4, kihatas:16, teff:1, prio:16 },
];

// Rendezve prioritás szerint
const RISKS_SORTED = [...RISKS].sort((a,b)=>b.prio-a.prio);

function riskTableHtml(showProb, showKar, showKih, showTeff, showPrio, highlightIdx=-1) {
  const cols = ['1fr','40px','40px','40px','40px','50px'].filter((_,i)=>{
    if(i===0) return true;
    if(i===1) return showProb;
    if(i===2) return showKar;
    if(i===3) return showKih;
    if(i===4) return showTeff;
    if(i===5) return showPrio;
    return false;
  }).join(' ');

  const headers = ['Rizikó', showProb?'Való-\nszínűség':'', showKar?'Kár':'', showKih?'Kihatás':'', showTeff?'Teszt\nhatékony.':'', showPrio?'Prioritás':''].filter(Boolean);
  const headerCols = [showProb, showKar, showKih, showTeff, showPrio].filter(Boolean);
  const headerColors = [showProb?'var(--prob)':'', showKar?'var(--kar)':'', showKih?'var(--kih)':'', showTeff?'var(--teff)':'', showPrio?'var(--prio)':''].filter(Boolean);

  return `<div class="risk-table">
    <div class="rt-hdr" style="grid-template-columns:${cols}">
      <div>Rizikó</div>
      ${showProb?'<div style="color:var(--prob);text-align:center">Valósz.</div>':''}
      ${showKar?'<div style="color:var(--kar);text-align:center">Kár</div>':''}
      ${showKih?'<div style="color:var(--kih);text-align:center">Kihatás</div>':''}
      ${showTeff?'<div style="color:var(--teff);text-align:center">T.hat.</div>':''}
      ${showPrio?'<div style="color:var(--prio);text-align:center">Prio.</div>':''}
    </div>
    ${RISKS.map((r,i)=>`
      <div class="rt-row ${i===highlightIdx?'highlight':''}" style="grid-template-columns:${cols}">
        <div class="rt-risk">${r.name}</div>
        ${showProb?`<div class="rt-num" style="color:var(--prob)">${r.prob}</div>`:''}
        ${showKar?`<div class="rt-num" style="color:var(--kar)">${r.kar}</div>`:''}
        ${showKih?`<div class="rt-num" style="color:var(--kih)">${r.prob*r.kar}</div>`:''}
        ${showTeff?`<div class="rt-num" style="color:var(--teff)">${r.teff}</div>`:''}
        ${showPrio?`<div class="rt-num" style="color:var(--prio);font-size:0.78rem">${r.prio}</div>`:''}
      </div>
    `).join('')}
  </div>`;
}

function sortedTableHtml() {
  return `<div class="prio-list">
    ${RISKS_SORTED.map((r,i)=>{
      const maxPrio = RISKS_SORTED[0].prio;
      const barW = Math.round((r.prio/maxPrio)*100);
      const col = r.prio>=50?'var(--high)':r.prio>=20?'var(--med)':r.prio>=10?'var(--kih)':'var(--low)';
      return `<div class="prio-row">
        <div class="pr-rank" style="color:${col}">${i+1}.</div>
        <div class="pr-name">${r.name}</div>
        <div class="pr-bar-wrap"><div class="pr-bar" style="width:${barW}%;background:${col}"></div></div>
        <div class="pr-score" style="color:${col}">${r.prio}</div>
      </div>`;
    }).join('')}
  </div>`;
}

const STEPS = [

  // ── 0. BEVEZETŐ ─────────────────────────────────────────────────
  {
    phase:0, formula:[],
    render:()=>`
      <div class="shdr"><div class="sico">📋</div>
        <div><div class="stitle">Tesztelés alapvető folyamata</div>
        <div class="ssub">// Tervezés → Végrehajtás → Zárás</div></div>
      </div>
      <div class="flow-steps">
        <div class="flow-step" style="border-left:3px solid var(--blue)">
          <div class="fs-num" style="color:var(--blue)">1.</div>
          <div>
            <div class="fs-title">Tervezés</div>
            <div class="fs-desc">A teszttervezés definiálja a tesztelés céljait és a célok elérésének módját. Meghatározza: milyen teszttechnikák, milyen ütemterv, milyen határidők.</div>
          </div>
        </div>
        <div class="flow-step" style="border-left:3px solid var(--rbt)">
          <div class="fs-num" style="color:var(--rbt)">2.</div>
          <div>
            <div class="fs-title">Végrehajtás</div>
            <div class="fs-desc">A tesztkészleteket a tesztvégrehajtási ütemtervben meghatározott sorrendben futtatják. A hibákat dokumentálják és bejelentik.</div>
          </div>
        </div>
        <div class="flow-step" style="border-left:3px solid var(--low)">
          <div class="fs-num" style="color:var(--low)">3.</div>
          <div>
            <div class="fs-title">Zárás</div>
            <div class="fs-desc">Tapasztalatok, tesztver és releváns információk véglegesítése. Projekt mérföldkövek elérésekor: release, iteráció vége, tesztszint befejezése.</div>
          </div>
        </div>
      </div>
      <div class="ibox"><strong>V-modell vs Scrum tesztelés:</strong> V-modell: minden fejlesztési fázishoz tartozik egy tesztelési szint (egység → integrációs → rendszer → átvételi teszt). Scrumban: 24h Daily-k alatt is tesztelés zajlik, minden sprint végén átadható termék.</div>
    `
  },

  // ── 1. MI A BAJ A KLASSZIKUS TESZTELÉSSEL? ──────────────────────
  {
    phase:0, formula:[],
    render:()=>`
      <div class="shdr"><div class="sico">😤</div>
        <div><div class="stitle">Mi a baj a klasszikus tesztelési módszerrel?</div>
        <div class="ssub">// 7 valódi probléma — miért nem működik</div></div>
      </div>
      <div class="cklist">
        <div class="cli" style="border-left:3px solid var(--high)">
          <div class="cli-i">⏰</div>
          <div><strong>Tesztek túl közel esnek a határidőkhöz</strong>
          <span>A tesztelők túl sok tesztelendő funkciót kapnak egyszerre a sprint végén — "nagy bumm" tesztelés, nem folyamatos.</span></div>
        </div>
        <div class="cli" style="border-left:3px solid var(--high)">
          <div class="cli-i">🐢</div>
          <div><strong>A fejlesztés túl késő kap visszajelzést</strong>
          <span>Ha a tesztelés a fejlesztés UTÁN indul, és hibát találnak, az egész feature-t újra kell írni. Korai feedback = olcsóbb javítás.</span></div>
        </div>

function renderBoard(phaseIdx, formulaIdxs) {
  document.getElementById('rbtSteps').innerHTML = PHASES.map((p,i)=>{
    const on=i===phaseIdx, done=i<phaseIdx;
    const c = on?p.color:done?p.color:'var(--muted)';
    return `<div class="rs-item ${on?'active':done?'done':''}">
      <div class="rs-dot" style="border-color:${c};color:${c}">${p.icon}</div>
      <div class="rs-label" style="color:${on?p.color:'var(--muted)'}">${p.label.replace('\n','<br>')}</div>
    </div>`;
  }).join('');

  document.getElementById('formulaBar').innerHTML = FORMULA_PARTS.map((p,i)=>{
    if(p.op) return `<div class="fb-op ${formulaIdxs.includes(i)?'on':''}">${p.label}</div>`;
    const on = formulaIdxs.includes(i);
    return `<div class="fb-part ${on?'on':''}" style="border-color:${p.color};color:${p.color}">${p.label}</div>`;
  }).join('');
}

let cur = 0;
function render() {
  const s = STEPS[cur];
  renderBoard(s.phase, s.formula);
  const el = document.getElementById('content');
  el.innerHTML = s.render();
  setTimeout(()=>{el.querySelectorAll('.msg:not(.show)').forEach((m,i)=>setTimeout(()=>m.classList.add('show'),i*160));},60);
  document.getElementById('bprev').disabled = cur===0;
  document.getElementById('bnext').textContent = cur===STEPS.length-1?'↺ Újra':'Következő →';
  document.getElementById('ctr').textContent = `${cur+1} / ${STEPS.length}`;
}
function next(){cur=cur===STEPS.length-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
