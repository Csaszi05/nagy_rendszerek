<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spirál Modell Szimuláció</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap');

:root {
  --bg: #f5f0e8;
  --card: #ffffff;
  --border: #e0d8cc;
  --dark: #1a1612;
  --c1: #e63946;   /* kör 1 - piros */
  --c2: #e07a1f;   /* kör 2 - narancs */
  --c3: #2a9d8f;   /* kör 3 - teal */
  --c4: #3a86ff;   /* kör 4 - kék */
  --muted: #8a7f72;
  --text: #2a2018;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cabinet Grotesk', sans-serif;
  min-height: 100vh;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, #c8b89a 1px, transparent 1px);
  background-size: 24px 24px;
  opacity: 0.3;
  pointer-events: none;
}

/* HEADER */
header {
  padding: 1.5rem 1.2rem 1rem;
  border-bottom: 2px solid var(--dark);
  position: relative;
  background: var(--bg);
}

.header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.5rem;
}

header h1 {
  font-size: 1.5rem;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.03em;
}

header h1 em {
  font-style: normal;
  color: var(--c1);
}

.project-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  background: var(--dark);
  color: var(--bg);
  padding: 0.3rem 0.6rem;
  border-radius: 4px;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 0.2rem;
}

header p {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 0.3rem;
}

/* SPIRAL VISUAL */
.spiral-nav {
  padding: 1rem 1.2rem 0.8rem;
  border-bottom: 1px solid var(--border);
  background: var(--card);
}

.spiral-track {
  display: flex;
  gap: 0;
  position: relative;
}

.spiral-track::before {
  content: '';
  position: absolute;
  top: 18px;
  left: 18px;
  right: 18px;
  height: 2px;
  background: var(--border);
  z-index: 0;
}

.s-node {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  position: relative;
  z-index: 1;
  cursor: pointer;
}

.s-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 800;
  transition: all 0.3s ease;
  color: var(--muted);
}

.s-node.done .s-circle {
  border-color: var(--dark);
  background: var(--dark);
  color: var(--bg);
}

.s-node.active .s-circle {
  border-width: 3px;
  transform: scale(1.15);
  font-weight: 800;
}

.s-node[data-k="0"].active .s-circle { border-color: var(--c1); color: var(--c1); background: rgba(230,57,70,0.08); }
.s-node[data-k="1"].active .s-circle { border-color: var(--c2); color: var(--c2); background: rgba(224,122,31,0.08); }
.s-node[data-k="2"].active .s-circle { border-color: var(--c3); color: var(--c3); background: rgba(42,157,143,0.08); }
.s-node[data-k="3"].active .s-circle { border-color: var(--c4); color: var(--c4); background: rgba(58,134,255,0.08); }

.s-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  color: var(--muted);
  text-align: center;
  line-height: 1.3;
}

.s-node.active .s-label { color: var(--text); font-weight: 500; }

/* PHASE MINI DOTS */
.phase-dots {
  display: flex;
  justify-content: center;
  gap: 3px;
  margin-top: 0.1rem;
}

.pdot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--border);
}

.pdot.on { background: var(--dark); }

/* MAIN CONTENT */
.content {
  padding: 1rem 1.2rem;
}

/* SECTION HEADER */
.section-header {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.8rem;
}

.section-num {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 800;
  flex-shrink: 0;
}

.section-title {
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.section-sub {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  color: var(--muted);
}

/* DIALOGUE */
.dialogue { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 0.8rem; }

.msg {
  display: flex;
  gap: 0.5rem;
  align-items: flex-end;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.msg.show { opacity: 1; transform: translateY(0); }
.msg.right { flex-direction: row-reverse; }

.av {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  flex-shrink: 0;
  border: 1.5px solid var(--border);
  background: var(--card);
}

.bbl {
  max-width: 78%;
  padding: 0.55rem 0.75rem;
  border-radius: 10px;
  font-size: 0.78rem;
  line-height: 1.5;
  border: 1.5px solid var(--border);
  background: var(--card);
}

.bbl.left  { border-bottom-left-radius: 3px; }
.bbl.right { border-bottom-right-radius: 3px; text-align: right; }

.who {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 0.15rem;
}

/* RISK CARD */
.risk-grid { display: flex; flex-direction: column; gap: 0.4rem; margin: 0.5rem 0; }

.risk-item {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 0.5rem 0.7rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.risk-icon { font-size: 1rem; flex-shrink: 0; }

.risk-body { flex: 1; }
.risk-name { font-size: 0.75rem; font-weight: 700; }
.risk-desc { font-size: 0.68rem; color: var(--muted); }

.risk-level {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  padding: 0.2rem 0.5rem;
  border-radius: 4px;
  font-weight: 500;
  white-space: nowrap;
}

.risk-high { background: rgba(230,57,70,0.1); color: var(--c1); border: 1px solid rgba(230,57,70,0.2); }
.risk-med  { background: rgba(224,122,31,0.1); color: var(--c2); border: 1px solid rgba(224,122,31,0.2); }
.risk-low  { background: rgba(42,157,143,0.1); color: var(--c3); border: 1px solid rgba(42,157,143,0.2); }

/* PROTOTYPE */
.proto-frame {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 0.8rem;
  margin: 0.5rem 0;
  position: relative;
}

.proto-tag {
  position: absolute;
  top: -10px;
  left: 10px;
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  background: var(--dark);
  color: var(--bg);
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
}

.wireframe { display: flex; flex-direction: column; gap: 0.35rem; }
.wf-bar { height: 7px; border-radius: 3px; background: var(--border); }
.wf-row { display: flex; gap: 0.35rem; }
.wf-box { border-radius: 4px; background: var(--border); }
.wf-btn {
  display: inline-block;
  padding: 0.3rem 0.8rem;
  border-radius: 5px;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  border: 1.5px solid var(--dark);
  color: var(--dark);
  font-weight: 500;
}

/* INFO STRIP */
.info-strip {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-left: 4px solid var(--dark);
  border-radius: 0 8px 8px 0;
  padding: 0.6rem 0.8rem;
  font-size: 0.75rem;
  line-height: 1.5;
  margin: 0.5rem 0;
  color: var(--text);
}

.info-strip strong { font-weight: 700; }

/* CHECKLIST */
.checklist { display: flex; flex-direction: column; gap: 0.35rem; margin: 0.5rem 0; }

.check-item {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  font-size: 0.78rem;
  padding: 0.4rem 0.6rem;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 7px;
}

.check-icon { flex-shrink: 0; font-size: 0.85rem; }

/* NAV */
.nav-bar {
  position: sticky;
  bottom: 0;
  background: var(--bg);
  border-top: 2px solid var(--dark);
  padding: 0.8rem 1.2rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  font-weight: 500;
  padding: 0.6rem 1rem;
  border-radius: 8px;
  border: 2px solid var(--dark);
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.btn-main {
  background: var(--dark);
  color: var(--bg);
  flex: 1;
}

.btn-main:hover { opacity: 0.85; }
.btn-main:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-back {
  background: transparent;
  color: var(--muted);
  border-color: var(--border);
}

.btn-back:hover { border-color: var(--dark); color: var(--dark); }
.btn-back:disabled { opacity: 0.2; cursor: not-allowed; }

.step-info {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--muted);
  white-space: nowrap;
}

/* COLOR HELPERS */
.c1 { color: var(--c1); }
.c2 { color: var(--c2); }
.c3 { color: var(--c3); }
.c4 { color: var(--c4); }

.bg1 { background: rgba(230,57,70,0.08); border-color: rgba(230,57,70,0.25); }
.bg2 { background: rgba(224,122,31,0.08); border-color: rgba(224,122,31,0.25); }
.bg3 { background: rgba(42,157,143,0.08); border-color: rgba(42,157,143,0.25); }
.bg4 { background: rgba(58,134,255,0.08); border-color: rgba(58,134,255,0.25); }

.num1 { background: rgba(230,57,70,0.12); color: var(--c1); }
.num2 { background: rgba(224,122,31,0.12); color: var(--c2); }
.num3 { background: rgba(42,157,143,0.12); color: var(--c3); }
.num4 { background: rgba(58,134,255,0.12); color: var(--c4); }

/* summary */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 0.5rem 0; }
.sum-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 0.6rem;
  text-align: center;
}
.sum-card .icon { font-size: 1.3rem; display: block; margin-bottom: 0.2rem; }
.sum-card .label { font-family: 'DM Mono', monospace; font-size: 0.58rem; color: var(--muted); }
.sum-card .val { font-size: 0.8rem; font-weight: 700; margin-top: 0.1rem; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Spirál<br><em>Modell</em></h1>
    <div class="project-tag">PROJEKT: Kórházi rendszer</div>
  </div>
  <p>4 spirálkör — lépésről lépésre végigkövetjük</p>
</header>

<div class="spiral-nav">
  <div class="spiral-track">
    <div class="s-node active" data-k="0" onclick="jumpTo(0)">
      <div class="s-circle">1</div>
      <div class="s-label">Kon-<br>cepció</div>
      <div class="phase-dots">
        <div class="pdot" id="d0_0"></div>
        <div class="pdot" id="d0_1"></div>
        <div class="pdot" id="d0_2"></div>
        <div class="pdot" id="d0_3"></div>
      </div>
    </div>
    <div class="s-node" data-k="1" onclick="jumpTo(4)">
      <div class="s-circle">2</div>
      <div class="s-label">Köve-<br>telmény</div>
      <div class="phase-dots">
        <div class="pdot" id="d1_0"></div>
        <div class="pdot" id="d1_1"></div>
        <div class="pdot" id="d1_2"></div>
        <div class="pdot" id="d1_3"></div>
      </div>
    </div>
    <div class="s-node" data-k="2" onclick="jumpTo(8)">
      <div class="s-circle">3</div>
      <div class="s-label">Ter-<br>vezés</div>
      <div class="phase-dots">
        <div class="pdot" id="d2_0"></div>
        <div class="pdot" id="d2_1"></div>
        <div class="pdot" id="d2_2"></div>
        <div class="pdot" id="d2_3"></div>
      </div>
    </div>
    <div class="s-node" data-k="3" onclick="jumpTo(12)">
      <div class="s-circle">4</div>
      <div class="s-label">Imple-<br>mentáció</div>
      <div class="phase-dots">
        <div class="pdot" id="d3_0"></div>
        <div class="pdot" id="d3_1"></div>
        <div class="pdot" id="d3_2"></div>
        <div class="pdot" id="d3_3"></div>
      </div>
    </div>
  </div>
</div>

<div class="content" id="content"></div>

<div class="nav-bar">
  <button class="btn btn-back" id="backBtn" onclick="prev()" disabled>← Vissza</button>
  <span class="step-info" id="stepInfo">1 / 17</span>
  <button class="btn btn-main" id="nextBtn" onclick="next()">Következő →</button>
</div>

<script>
// Scenario: kórházi betegnyilvántartó rendszer fejlesztése

const STEPS = [
  // ═══════════════════════════════
  // KÖR 1 — KONCEPCIÓ (lépés 0-3)
  // ═══════════════════════════════
  {
    circle: 0, phase: 0,
    render: () => `
      <div class="section-header">
        <div class="section-num num1">1A</div>
        <div>

      </div>
      <div class="dialogue">

          <div class="av">👨‍💻</div>

        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">🏥</div>
          <div class="bbl left">
            <div class="who c1">Kórház igazgató</div>
            Pontosan. Ezért fontolgatjuk a spirál modellt — sok a bizonytalanság és a kockázat.
          </div>
        </div>
      </div>
      <div class="info-strip">
        <strong>Miért spirál modell?</strong> Mert ez egy biztonságkritikus rendszer — ha valami elromlik, az emberek egészségét veszélyezteti. A spirál modell minden körnél megvizsgálja a kockázatokat, mielőtt továbblépünk.
      </div>
    `
  },
  {
    circle: 0, phase: 1,
    render: () => `

          </div>
          <div class="risk-level risk-high">MAGAS</div>
        </div>
        <div class="risk-item">
          <div class="risk-icon">👥</div>
          <div class="risk-body">
            <div class="risk-name">Felhasználói elfogadás</div>

          </div>
          <div class="risk-level risk-med">KÖZEPES</div>
        </div>
        <div class="risk-item">
          <div class="risk-icon">🔄</div>
          <div class="risk-body">
            <div class="risk-name">Meglévő adatok migrációja</div>
            <div class="risk-desc">Régi papíros adatok digitalizálása</div>
          </div>
          <div class="risk-level risk-med">KÖZEPES</div>

      </div>
      <div class="info-strip">
        <strong>Spirál modell lényege:</strong> Más modelleknél ezeket a kockázatokat a végén találnák meg. Itt az ELEJÉN azonosítjuk, és tervet készítünk rájuk.

    `

  {
    circle: 0, phase: 2,
    render: () => `

            Csináltunk egy nagyon egyszerű demót — csak hogy lássuk, a technológia működik-e.

      </div>
      <div class="proto-frame">

          <div class="wf-row">
            <div class="wf-box" style="width:80px;height:35px"></div>

              <div class="wf-bar" style="width:60%"></div>

        <div class="check-item"><div class="check-icon">⚠️</div><div>Migráció nehezebb lesz, mint vártuk</div></div>
      </div>
    `
  },
  {
    circle: 0, phase: 3,
    render: () => `
      <div class="section-header">
        <div class="section-num num1">1D</div>
        <div>
          <div class="section-title">1. kör — Következő kör tervezése</div>
          <div class="section-sub">// Folytatjuk?</div>

      </div>
      <div class="dialogue">

          </div>

        <div class="msg show" style="transition-delay:.15s">

        </div>

            <div class="who" style="text-align:right">Fejlesztő csapat</div>

const CIRCLE_STARTS = [0, 4, 8, 12];
let cur = 0;

function updateNav() {
  const s = STEPS[cur];

  // spiral nodes
  document.querySelectorAll('.s-node').forEach((el, i) => {
    const start = CIRCLE_STARTS[i];
    el.classList.remove('active', 'done');
    if (i < s.circle) el.classList.add('done');
    else if (i === s.circle) el.classList.add('active');
  });

  // phase dots
  for (let c = 0; c < 4; c++) {
    for (let p = 0; p < 4; p++) {
      const el = document.getElementById(`d${c}_${p}`);
      if (!el) continue;
      el.classList.remove('on');
      if (c < s.circle) el.classList.add('on');
      else if (c === s.circle && p <= s.phase) el.classList.add('on');
    }
  }

  document.getElementById('backBtn').disabled = cur === 0;
  const nb = document.getElementById('nextBtn');
  if (cur === STEPS.length - 1) { nb.textContent = '↺ Újra'; nb.disabled = false; }
  else { nb.textContent = 'Következő →'; nb.disabled = false; }
  document.getElementById('stepInfo').textContent = `${cur + 1} / ${STEPS.length}`;
}

function render() {
  const el = document.getElementById('content');
  el.innerHTML = STEPS[cur].render();
  // animate msgs
  setTimeout(() => {
    el.querySelectorAll('.msg:not(.show)').forEach((m, i) => {
      setTimeout(() => m.classList.add('show'), i * 160);
    });
  }, 60);
  updateNav();
}

function next() {
  if (cur === STEPS.length - 1) { cur = 0; } else { cur++; }
  render();
}

function prev() {
  if (cur > 0) { cur--; render(); }
}

function jumpTo(idx) {
  cur = idx;
  render();
}

render();
</script>
</body>
</html>
