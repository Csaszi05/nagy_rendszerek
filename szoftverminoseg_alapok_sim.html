<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szoftverminőség Alapok</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inconsolata:wght@400;500;600&display=swap');

:root {
  --bg:    #0a0f1e;
  --surf:  #0f1628;
  --card:  #141d35;
  --brd:   #1e2d50;
  --brd2:  #263a68;
  --text:  #d8e4ff;
  --muted: #4a5f8a;

  --q1: #f59e0b;   /* felhasználói */
  --q2: #3b82f6;   /* termék */
  --q3: #10b981;   /* folyamat */
  --q4: #a855f7;   /* érték */
  --q5: #f97316;   /* transzcendens */

  --d1: #f59e0b;
  --d2: #3b82f6;
  --d3: #10b981;
  --d4: #6366f1;
  --d5: #a855f7;
  --d6: #ec4899;
  --d7: #f97316;
  --d8: #22d3ee;

  --fok1: #6b7280;
  --fok2: #f59e0b;
  --fok3: #3b82f6;
  --fok4: #10b981;

  --acc: #f59e0b;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--bg); color:var(--text);
  font-family:'Sora', sans-serif; min-height:100vh; overflow-x:hidden;
}

body::before {
  content:''; position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(245,158,11,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(59,130,246,0.04) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

header {
  position:relative; z-index:1;
  padding:1.2rem 1.3rem 0.85rem;
  border-bottom:1px solid var(--brd2);
  background:linear-gradient(180deg, rgba(245,158,11,0.05) 0%, transparent 100%);
}
.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }
h1 { font-size:1.4rem; font-weight:800; line-height:1.07; letter-spacing:-0.02em; }
h1 span { color:var(--acc); }
h1 em   { font-style:normal; color:#10b981; }
.tag {
  font-family:'Inconsolata', monospace; font-size:0.56rem;
  padding:0.25rem 0.55rem; border-radius:4px;
  background:rgba(245,158,11,0.12); color:var(--acc);
  border:1px solid rgba(245,158,11,0.28); white-space:nowrap; margin-top:0.2rem;
}
header p { font-size:0.7rem; color:var(--muted); margin-top:0.25rem; font-family:'Inconsolata', monospace; }

/* TOP BAR — témakörök */
.topbar {
  position:relative; z-index:1;
  background:var(--surf); border-bottom:1px solid var(--brd2);
  padding:0.75rem 1.3rem 0.65rem;
}
.tb-title {
  font-family:'Inconsolata', monospace; font-size:0.54rem;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.09em; margin-bottom:0.5rem;
}
.topic-row {
  display:flex; gap:0; align-items:center; margin-bottom:0.45rem;
}
.tp-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:0.18rem; position:relative;
}
.tp-item:not(:last-child)::after {
  content:''; position:absolute; right:0; top:11px;
  width:50%; height:2px; background:var(--brd); z-index:0;
}
.tp-item:not(:first-child)::before {
  content:''; position:absolute; left:0; top:11px;
  width:50%; height:2px; background:var(--brd); z-index:0;
}
.tp-dot {
  width:22px; height:22px; border-radius:50%;
  border:2px solid var(--brd2); background:var(--card);
  display:flex; align-items:center; justify-content:center;
  font-size:0.58rem; z-index:1; transition:all 0.35s; position:relative;
}
.tp-label {
  font-family:'Inconsolata', monospace; font-size:0.44rem;
  color:var(--muted); text-align:center; line-height:1.2;
}
.tp-item.active .tp-dot { transform:scale(1.25); box-shadow:0 0 10px currentColor; }
.tp-item.done .tp-dot { opacity:0.55; }
.tp-item.active .tp-label { font-weight:700; font-size:0.48rem; }

.fok-chips { display:flex; gap:4px; flex-wrap:wrap; }
.fok-chip {
  font-family:'Inconsolata', monospace; font-size:0.54rem; font-weight:600;
  padding:0.16rem 0.45rem; border-radius:3px; border:1px solid;
  opacity:0.3; transition:opacity 0.3s;
}
.fok-chip.on { opacity:1; }

/* CONTENT */
.content { position:relative; z-index:1; padding:0.9rem 1.3rem; min-height:275px; }

.shdr { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.85rem; }
.sico {
  width:36px; height:36px; border-radius:9px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:1rem;
  border:1.5px solid var(--brd2); background:var(--card);
}
.stitle { font-size:0.95rem; font-weight:800; letter-spacing:-0.02em; }
.ssub   { font-family:'Inconsolata', monospace; font-size:0.56rem; color:var(--muted); margin-top:0.03rem; }

/* CHAT */
.chat { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.7rem; }
.msg { display:flex; gap:0.4rem; align-items:flex-start; opacity:0; transform:translateY(6px); transition:opacity 0.3s, transform 0.3s; }
.msg.show { opacity:1; transform:translateY(0); }
.msg.r { flex-direction:row-reverse; }
.av { width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; flex-shrink:0; border:1px solid var(--brd2); background:var(--card); }
.bub { max-width:82%; padding:0.48rem 0.68rem; border-radius:9px; font-size:0.77rem; line-height:1.55; border:1px solid var(--brd2); background:var(--card); }
.bub.l  { border-bottom-left-radius:2px; }
.bub.r2 { border-bottom-right-radius:2px; text-align:right; }
.who { font-family:'Inconsolata', monospace; font-size:0.55rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.1rem; }

/* DEFINÍCIÓ KÁRTYÁK */
.def-card {
  border-radius:10px; padding:0.75rem 0.85rem; margin:0.35rem 0; border:1.5px solid;
  display:flex; gap:0.7rem; align-items:flex-start;
}
.dc-num { font-family:'Inconsolata', monospace; font-size:1.4rem; font-weight:800; flex-shrink:0; line-height:1; }
.dc-title { font-size:0.85rem; font-weight:800; margin-bottom:0.18rem; }
.dc-sub { font-family:'Inconsolata', monospace; font-size:0.55rem; opacity:0.7; margin-bottom:0.2rem; }
.dc-desc { font-size:0.73rem; line-height:1.55; color:rgba(216,228,255,0.82); }
.dc-example {
  margin-top:0.35rem; background:var(--surf); border-radius:6px;
  padding:0.38rem 0.55rem; font-size:0.7rem; line-height:1.45;
  border-left:2px solid; color:rgba(216,228,255,0.75);
}
.ex-label { font-family:'Inconsolata', monospace; font-size:0.5rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; margin-bottom:0.1rem; }

/* DIMENZIÓ GRID */
.dim-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.35rem; margin:0.45rem 0; }
.dim-card {
  background:var(--card); border:1px solid var(--brd2); border-radius:8px;
  padding:0.5rem 0.6rem; border-left:3px solid;
}
.dim-name { font-size:0.77rem; font-weight:800; margin-bottom:0.1rem; }
.dim-example { font-size:0.64rem; color:var(--muted); font-family:'Inconsolata', monospace; line-height:1.4; }

/* FOKOZAT CARDS */
.fok-card {
  border-radius:11px; padding:0.8rem 0.95rem; margin:0.35rem 0; border:2px solid;
}
.fk-header { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.4rem; }
.fk-num { font-family:'Inconsolata', monospace; font-size:0.58rem; font-weight:700; opacity:0.7; }
.fk-name { font-size:0.92rem; font-weight:800; letter-spacing:-0.02em; }
.fk-badge { font-family:'Inconsolata', monospace; font-size:0.52rem; padding:0.1rem 0.45rem; border-radius:3px; border:1px solid; font-weight:700; margin-left:auto; }
.fk-desc { font-size:0.73rem; line-height:1.55; color:rgba(216,228,255,0.82); margin-bottom:0.35rem; }
.fk-example {
  background:var(--surf); border-radius:7px; padding:0.45rem 0.6rem;
  font-size:0.7rem; line-height:1.45;
}
.fk-ex-title { font-family:'Inconsolata', monospace; font-size:0.52rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.12rem; }
.fk-list { display:flex; flex-direction:column; gap:0.1rem; }
.fk-item { font-family:'Inconsolata', monospace; font-size:0.66rem; color:var(--muted); }
.fk-item::before { content:'▸ '; opacity:0.6; }

/* IBOX */
.ibox {
  border-radius:8px; padding:0.55rem 0.75rem; font-size:0.74rem; line-height:1.55;
  margin:0.45rem 0; border:1px solid var(--brd2); background:var(--card);
  border-left:3px solid var(--acc);
}
.ibox strong { font-weight:700; }
.ibox.g-b { border-left-color:#10b981; }
.ibox.g-b strong { color:#10b981; }
.ibox.b-b { border-left-color:#3b82f6; }
.ibox.b-b strong { color:#3b82f6; }

/* CHECKLIST */
.cklist { display:flex; flex-direction:column; gap:0.35rem; margin:0.45rem 0; }
.cli {
  display:flex; align-items:flex-start; gap:0.5rem;
  padding:0.42rem 0.65rem; background:var(--card);
  border:1px solid var(--brd2); border-radius:8px; font-size:0.75rem; line-height:1.45;
}
.cli-i { flex-shrink:0; font-size:0.88rem; }
.cli strong { display:block; font-weight:700; font-size:0.76rem; margin-bottom:0.03rem; }
.cli span   { color:var(--muted); font-size:0.68rem; font-family:'Inconsolata', monospace; }

/* QUOTE CARD */
.quote-card {
  border-radius:11px; padding:0.9rem 1rem; margin:0.45rem 0;
  border:2px solid rgba(245,158,11,0.35); background:rgba(245,158,11,0.05);
  position:relative;
}
.q-mark { font-size:3rem; line-height:0.8; color:rgba(245,158,11,0.2); font-family:Georgia,serif; position:absolute; top:0.4rem; left:0.6rem; }
.q-text { font-size:0.82rem; line-height:1.6; font-style:italic; padding-left:1.2rem; color:rgba(216,228,255,0.9); }
.q-author { font-family:'Inconsolata', monospace; font-size:0.58rem; color:var(--acc); font-weight:700; margin-top:0.4rem; padding-left:1.2rem; }

/* SUMGRID */
.sumgrid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }
.sbox { background:var(--card); border:1px solid var(--brd2); border-radius:8px; padding:0.6rem; text-align:center; }
.sbox .ico { font-size:1.2rem; display:block; margin-bottom:0.15rem; }
.sbox .val { font-size:0.88rem; font-weight:800; }
.sbox .lbl { font-family:'Inconsolata', monospace; font-size:0.52rem; color:var(--muted); margin-top:0.04rem; }

/* COMPARISON */
.comp-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.4rem; margin:0.45rem 0; }

/* NAV */
.nav {
  position:sticky; bottom:0; z-index:10;
  background:var(--bg); border-top:1px solid var(--brd2);
  padding:0.7rem 1.3rem; display:flex; align-items:center; gap:0.5rem;
}
.btn {
  font-family:'Inconsolata', monospace; font-size:0.63rem; font-weight:600;
  padding:0.52rem 1rem; border-radius:7px; cursor:pointer;
  transition:all 0.18s; text-transform:uppercase; letter-spacing:0.04em;
}
.btnp { background:transparent; color:var(--muted); border:1px solid var(--brd2); }
.btnp:hover { color:var(--text); }
.btnp:disabled { opacity:0.2; cursor:not-allowed; }
.btnn { flex:1; background:rgba(245,158,11,0.12); color:var(--acc); border:1px solid rgba(245,158,11,0.3); }
.btnn:hover { background:rgba(245,158,11,0.22); }
.ctr { font-family:'Inconsolata', monospace; font-size:0.57rem; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <h1><span>Szoftver</span><br>minőség<br><em>Alapok</em></h1>
    <div class="tag">4. előadás // Garvin</div>
  </div>
  <p>// Mi a minőség? · 5 definíció · 8 dimenzió · 4 fokozat</p>
</header>

<div class="topbar">
  <div class="tb-title">// témakörök</div>
  <div class="topic-row" id="topicRow"></div>
  <div class="fok-chips" id="fokChips"></div>
</div>

<div class="content" id="content"></div>

<div class="nav">
  <button class="btn btnp" id="bprev" onclick="prev()" disabled>← Vissza</button>
  <span class="ctr" id="ctr">1 / 22</span>
  <button class="btn btnn" id="bnext" onclick="next()">Következő →</button>
</div>

<script>
const TOPICS = [
  { label:'Mi a\nminőség?', color:'var(--acc)', icon:'❓' },
  { label:'Garvin\n5 def.', color:'var(--q2)', icon:'📚' },
  { label:'8\nDimenzió', color:'var(--q3)', icon:'🎯' },
  { label:'4\nFokozat', color:'var(--q4)', icon:'📈' },
  { label:'Összefog\nlalás', color:'#ec4899', icon:'∑' },
];

const FOK_CHIPS = [
  { label:'1. Ártatlanság', color:'var(--fok1)' },
  { label:'2. Eszmélés',    color:'var(--fok2)' },
  { label:'3. Elkötelezettség', color:'var(--fok3)' },
  { label:'4. Világszínvonal', color:'var(--fok4)' },
];

const STEPS = [

  // ── 0. MI A MINŐSÉG? BEVEZETŐ ────────────────────────────────────
  {
    topic:0, fok:[],
    render:()=>`
      <div class="shdr"><div class="sico">❓</div>
        <div><div class="stitle">Mi a minőség?</div>
        <div class="ssub">// látszólag egyszerű kérdés — valójában nagyon bonyolult</div></div>
      </div>
      <div class="chat">
        <div class="msg show">
          <div class="av">👨‍🏫</div>
          <div class="bub l"><div class="who" style="color:var(--acc)">Oktató</div>
            Mi a minőség? Ha megkérem önöket, hogy mondják meg, melyik autó jobb minőségű — a Porsche vagy a Dacia — mit mondanának?
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.15s">
          <div class="av">🙋</div>
          <div class="bub r2"><div class="who" style="color:var(--q2);text-align:right">Tanuló A</div>
            Hát nyilván a Porsche — gyorsabb, jobb az anyag, drágább...
          </div>
        </div>
        <div class="msg show" style="transition-delay:.3s">
          <div class="av">🙋</div>
          <div class="bub l"><div class="who" style="color:var(--q3)">Tanuló B</div>
            De ha valaki szűk utakon akar olcsón közlekedni, és nem zavar fel a Dacia? Akkor a Dacia jobb minőségű — mert jobban megfelel az igényeinek!
          </div>
        </div>
        <div class="msg show r" style="transition-delay:.45s">
          <div class="av">👨‍🏫</div>
          <div class="bub r2"><div class="who" style="color:var(--acc);text-align:right">Oktató</div>
            Pontosan! A minőség nehéz definiálni, lehetetlen pontosan mérni — de könnyű felismerni. Ezért van, hogy Garvin 5 különböző megközelítéssel próbálta leírni.
          </div>
        </div>
      </div>
      <div class="quote-card">
        <div class="q-mark">"</div>
        <div class="q-text">We just can't ship junk. There are thresholds that we can't cross because of who we are.</div>
        <div class="q-author">— Steve Jobs (1955–2011) · Apple, NeXT, Pixar alapítója</div>
      </div>
      <div class="ibox"><strong>A minőség paradoxona:</strong> A minőséget nehéz definiálni, lehetetlen mérni — de könnyű felismerni. Mindenki tudja, ha rossz minőségű szoftvert használ (bugok, lassúság, rossz UI) — de nehéz pontosan megmondani miért.</div>
    `
  },

  // ── 1. GARVIN 1 — FELHASZNÁLÓI ───────────────────────────────────
  {
    topic:1, fok:[],
    render:()=>`
      <div class="shdr"><div class="sico">📚</div>
        <div><div class="stitle">Garvin 1. definíció — Felhasználói alapú</div>
        <div class="ssub">// "a minőség a felhasználásra való alkalmasság"</div></div>
      </div>
      <div class="def-card" style="background:rgba(245,158,11,0.05);border-color:rgba(245,158,11,0.35)">
        <div class="dc-num" style="color:var(--q1)">1.</div>
        <div>
          <div class="dc-sub" style="color:var(--q1)">FELHASZNÁLÓI ALAPÚ DEFINÍCIÓ</div>
          <div class="dc-title" style="color:var(--q1)">Alkalmasság a felhasználásra</div>
          <div class="dc-desc">A minőség az, hogy mennyire teljesíti a termék a felhasználók egyedi igényeit. A legjobb termék az, amelyik ezt a legmagasabb színvonalon képes megtenni.</div>
          <div class="dc-example" style="border-color:var(--q1)">
            <div class="ex-label" style="color:var(--q1)">Példa — szoftver</div>
            <div>🎵 A Spotify akkor jó minőségű, ha az a felhasználó, aki zenehallgatáshoz használja, megtalálja, amit keres, gyorsan betölt, és offline is működik. Egy másiknak a podcast funkció a lényeg — számára az a minőség.</div>
          </div>
          <div class="dc-example" style="border-color:var(--muted);margin-top:0.25rem">
            <div class="ex-label" style="color:var(--muted)">Ellenexempla</div>
            <div>🔧 A VS Code kiváló minőségű egy fejlesztőnek — de egy 65 éves nagymamának, aki csak e-mailezni akar, nem "jó minőségű", mert nem az ő igényeire való.</div>
          </div>
        </div>
      </div>
      <div class="ibox" style="border-left-color:var(--q1)"><strong>Szubjektív!</strong> Ez a megközelítés teljesen szubjektív — nincs abszolút mérce. Két ember ugyanarról a termékről teljesen ellentétes véleményt mondhat — és mindkettőnek igaza van a saját szemszögéből.</div>
    `
  },

  // ── 2. GARVIN 2 — TERMÉK ALAPÚ ───────────────────────────────────
  {
    topic:1, fok:[],
    render:()=>`
      <div class="shdr"><div class="sico">📚</div>
        <div><div class="stitle">Garvin 2. definíció — Termék alapú</div>
        <div class="ssub">// "a minőség a mérhető paraméterekből következik"</div></div>
      </div>
      <div class="def-card" style="background:rgba(59,130,246,0.05);border-color:rgba(59,130,246,0.35)">
        <div class="dc-num" style="color:var(--q2)">2.</div>
        <div>
          <div class="dc-sub" style="color:var(--q2)">TERMÉK ALAPÚ DEFINÍCIÓ</div>
          <div class="dc-title" style="color:var(--q2)">Objektív, mérhető paraméterek</div>
          <div class="dc-desc">A minőség a termék mérhető jellemzőiből következik. A termékek közti minőségi különbségek az összetevők különbségeiből fakadnak. A megítélés OBJEKTÍV — nem szubjektív.</div>
          <div class="dc-example" style="border-color:var(--q2)">
            <div class="ex-label" style="color:var(--q2)">Példa — szoftver minőség mérőszámok</div>
            <div>📊 Chrome vs Firefox összehasonlítás:</div>
            <div>• Memóriahasználat: Chrome 800MB, Firefox 400MB — Firefox jobb</div>
            <div>• Betöltési sebesség: Chrome 0.8s, Firefox 1.1s — Chrome jobb</div>
            <div>• Kódhibák száma: 100 000 sorra Chrome 0.3, Firefox 0.5 — Chrome jobb</div>
          </div>
          <div class="dc-example" style="border-color:var(--muted);margin-top:0.25rem">
            <div class="ex-label" style="color:var(--muted)">Szoftver metrika példák</div>
            <div>Ciklomatikus komplexitás, kódlefedettség %, API válaszidő ms, uptime %, bug/KLOC</div>
          </div>
        </div>
      </div>
      <div class="ibox b-b"><strong>Objektív, de nem teljes:</strong> A számok nem mondanak el mindent. Egy szoftver lehet hogy minden metrikán jó, de a UI annyira rossz, hogy senki nem akarja használni. A termék alapú megközelítés kiegészítője a felhasználói alapúnak.</div>
    `
  },

  // ── 3. GARVIN 3 — FOLYAMAT ALAPÚ ────────────────────────────────
  {
    topic:1, fok:[],
    render:()=>`
      <div class="shdr"><div class="sico">📚</div>
        <div><div class="stitle">Garvin 3. definíció — Folyamat alapú</div>
        <div class="ssub">// "a minőség a specifikációnak való megfelelőség"</div></div>

function renderBoard(topicIdx, aktivFokok) {
  document.getElementById('topicRow').innerHTML = TOPICS.map((t,i) => {
    const on = i === topicIdx;
    const done = i < topicIdx;
    const cls = on ? 'active' : done ? 'done' : '';
    const c = on ? t.color : done ? t.color : 'var(--muted)';
    return `<div class="tp-item ${cls}">
      <div class="tp-dot" style="border-color:${c};color:${c}">${t.icon}</div>
      <div class="tp-label" style="color:${on?t.color:'var(--muted)'}">${t.label.replace('\n','<br>')}</div>
    </div>`;
  }).join('');

  document.getElementById('fokChips').innerHTML = FOK_CHIPS.map((f,i) => {
    const on = aktivFokok.includes(i);
    return `<div class="fok-chip ${on?'on':''}" style="border-color:${f.color};color:${f.color}">${f.label}</div>`;
  }).join('');
}

let cur = 0;

function render() {
  const s = STEPS[cur];
  renderBoard(s.topic, s.fok);
  const el = document.getElementById('content');
  el.innerHTML = s.render();
  setTimeout(() => {
    el.querySelectorAll('.msg:not(.show)').forEach((m,i) => setTimeout(() => m.classList.add('show'), i*160));
  }, 60);
  document.getElementById('bprev').disabled = cur === 0;
  const bn = document.getElementById('bnext');
  bn.textContent = cur === STEPS.length-1 ? '↺ Újra' : 'Következő →';
  document.getElementById('ctr').textContent = `${cur+1} / ${STEPS.length}`;
}

function next() { cur = cur === STEPS.length-1 ? 0 : cur+1; render(); }
function prev() { if(cur>0){cur--;render();} }

render();
</script>
