<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAD Szimuláció</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --accent1: #00ffaa;
    --accent2: #ff6b35;
    --accent3: #7c6fff;
    --text: #e8e8f0;
    --muted: #6b6b80;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 20%, rgba(0,255,170,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(124,111,255,0.04) 0%, transparent 50%);
    pointer-events: none;
  }

  header {
    padding: 2rem 1.5rem 1rem;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  header h1 span { color: var(--accent1); }

  header p {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }

  /* PROGRESS BAR */
  .progress-bar {
    display: flex;
    padding: 1rem 1.5rem;
    gap: 0.3rem;
    border-bottom: 1px solid var(--border);
  }

  .progress-step {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    transition: background 0.4s ease;
  }

  .progress-step.done { background: var(--accent1); }
  .progress-step.active { background: var(--accent2); }

  /* PHASE INDICATOR */
  .phase-indicator {
    padding: 0.8rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    border-bottom: 1px solid var(--border);
  }

  .phase-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    padding: 0.3rem 0.7rem;
    border-radius: 20px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .phase-badge.req  { background: rgba(0,255,170,0.15); color: var(--accent1); border: 1px solid rgba(0,255,170,0.3); }
  .phase-badge.user { background: rgba(255,107,53,0.15); color: var(--accent2); border: 1px solid rgba(255,107,53,0.3); }
  .phase-badge.cons { background: rgba(124,111,255,0.15); color: var(--accent3); border: 1px solid rgba(124,111,255,0.3); }
  .phase-badge.cut  { background: rgba(255,220,0,0.15); color: #ffd700; border: 1px solid rgba(255,220,0,0.3); }

  .phase-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
  }

  /* MAIN SCENE */
  .scene {
    padding: 1.2rem 1.5rem;
    min-height: 280px;
  }

  /* DIALOGUE BUBBLES */
  .dialogue {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    margin-bottom: 1rem;
  }

  .bubble-row {
    display: flex;
    align-items: flex-end;
    gap: 0.7rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .bubble-row.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .bubble-row.right { flex-direction: row-reverse; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    border: 2px solid var(--border);
  }

  .avatar.client { background: rgba(0,255,170,0.1); border-color: rgba(0,255,170,0.3); }
  .avatar.dev    { background: rgba(124,111,255,0.1); border-color: rgba(124,111,255,0.3); }

  .bubble {
    max-width: 75%;
    padding: 0.7rem 0.9rem;
    border-radius: 12px;
    font-size: 0.82rem;
    line-height: 1.5;
    position: relative;
  }

  .bubble.client-bubble {
    background: rgba(0,255,170,0.08);
    border: 1px solid rgba(0,255,170,0.2);
    border-bottom-left-radius: 3px;
  }

  .bubble.dev-bubble {
    background: rgba(124,111,255,0.08);
    border: 1px solid rgba(124,111,255,0.2);
    border-bottom-right-radius: 3px;
    text-align: right;
  }

  .speaker {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.2rem;
  }

  .speaker.c { color: var(--accent1); }
  .speaker.d { color: var(--accent3); }

  /* PROTOTYPE VISUAL */
  .prototype-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    margin: 0.8rem 0;
    position: relative;
    overflow: hidden;
  }

  .prototype-box::before {
    content: 'PROTOTÍPUS';
    position: absolute;
    top: 0.5rem;
    right: 0.7rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    color: var(--accent2);
    letter-spacing: 0.1em;
  }

  .proto-v1 { border-color: rgba(255,107,53,0.3); }
  .proto-v2 { border-color: rgba(0,255,170,0.3); }

  .proto-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  .proto-ui {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .proto-bar {
    height: 8px;
    border-radius: 4px;
    background: var(--border);
  }

  .proto-bar.w40 { width: 40%; }
  .proto-bar.w70 { width: 70%; }
  .proto-bar.w55 { width: 55%; }
  .proto-bar.w90 { width: 90%; }
  .proto-bar.w30 { width: 30%; }
  .proto-bar.accent { background: rgba(255,107,53,0.4); }
  .proto-bar.accent2 { background: rgba(0,255,170,0.4); }
  .proto-row { display: flex; gap: 0.4rem; align-items: center; }
  .proto-sq { width: 20px; height: 20px; border-radius: 4px; background: var(--border); flex-shrink: 0; }
  .proto-sq.col { background: rgba(124,111,255,0.3); }
  .proto-btn {
    display: inline-block;
    padding: 0.3rem 0.7rem;
    border-radius: 5px;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
  }
  .proto-btn.v1 { background: rgba(255,107,53,0.2); color: var(--accent2); border: 1px solid rgba(255,107,53,0.3); }
  .proto-btn.v2 { background: rgba(0,255,170,0.2); color: var(--accent1); border: 1px solid rgba(0,255,170,0.3); }

  /* CODE SNIPPET */
  .code-block {
    background: #0d0d15;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.8rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    line-height: 1.7;
    margin: 0.6rem 0;
    overflow-x: auto;
  }

  .code-block .kw { color: var(--accent3); }
  .code-block .fn { color: var(--accent1); }
  .code-block .str { color: var(--accent2); }
  .code-block .cm { color: var(--muted); }

  /* TIMELINE */
  .timeline {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin: 0.5rem 0;
  }

  .timeline-item {
    display: flex;
    gap: 0.8rem;
    padding: 0.5rem 0;
    position: relative;
  }

  .timeline-item:not(:last-child)::before {
    content: '';
    position: absolute;
    left: 15px;
    top: 28px;
    bottom: -4px;
    width: 2px;
    background: var(--border);
  }

  .tl-dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    flex-shrink: 0;
    z-index: 1;
  }

  .tl-dot.done { background: rgba(0,255,170,0.2); border: 2px solid var(--accent1); }
  .tl-dot.active { background: rgba(255,107,53,0.2); border: 2px solid var(--accent2); animation: pulse 1.5s infinite; }
  .tl-dot.pending { background: var(--card); border: 2px solid var(--border); }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(255,107,53,0); }
  }

  .tl-content { padding-top: 0.3rem; }
  .tl-content strong { font-size: 0.8rem; display: block; margin-bottom: 0.1rem; }
  .tl-content span { font-size: 0.72rem; color: var(--muted); }

  /* NAVIGATION */
  .nav-area {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.8rem;
  }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.2s ease;
  }

  .btn-next {
    background: var(--accent1);
    color: var(--bg);
    flex: 1;
  }

  .btn-next:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-next:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  .btn-prev {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-prev:hover { color: var(--text); border-color: var(--muted); }
  .btn-prev:disabled { opacity: 0.2; cursor: not-allowed; }

  .step-counter {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    white-space: nowrap;
  }

  /* INFO BOX */
  .info-box {
    background: rgba(124,111,255,0.06);
    border: 1px solid rgba(124,111,255,0.2);
    border-radius: 8px;
    padding: 0.7rem 0.9rem;
    font-size: 0.78rem;
    line-height: 1.5;
    margin: 0.6rem 0;
    color: #c8c8e8;
  }

  .info-box strong { color: var(--accent3); }

  /* SUCCESS */
  .success-box {
    background: rgba(0,255,170,0.06);
    border: 1px solid rgba(0,255,170,0.2);
    border-radius: 8px;
    padding: 0.7rem 0.9rem;
    font-size: 0.78rem;
    line-height: 1.5;
    margin: 0.6rem 0;
    color: #c8f0e8;
    text-align: center;
  }

  .success-box .big { font-size: 1.5rem; display: block; margin-bottom: 0.3rem; }

  /* HIDDEN */
  .hidden { display: none; }

  /* DEPLOY VISUAL */
  .deploy-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin: 0.6rem 0;
  }

  .deploy-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem;
    font-size: 0.72rem;
    text-align: center;
  }

  .deploy-card .icon { font-size: 1.2rem; display: block; margin-bottom: 0.3rem; }
  .deploy-card .label { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 0.6rem; }
  .deploy-card.ok { border-color: rgba(0,255,170,0.3); }
  .deploy-card.ok .label { color: var(--accent1); }
</style>
</head>
<body>

<header>
  <h1>RAD <span>Szimuláció</span></h1>
  <p>// Webshop fejlesztése — lépésről lépésre</p>
</header>

<div class="progress-bar" id="progressBar">
  <div class="progress-step" id="ps0"></div>
  <div class="progress-step" id="ps1"></div>
  <div class="progress-step" id="ps2"></div>
  <div class="progress-step" id="ps3"></div>
  <div class="progress-step" id="ps4"></div>
  <div class="progress-step" id="ps5"></div>
  <div class="progress-step" id="ps6"></div>
  <div class="progress-step" id="ps7"></div>
</div>

<div class="phase-indicator">
  <div class="phase-badge" id="phaseBadge">REQ</div>
  <div class="phase-title" id="phaseTitle">1. fázis — Követelmény tervezés</div>
</div>

<div class="scene" id="scene"></div>

<div class="nav-area">
  <button class="btn btn-prev" id="prevBtn" onclick="prev()" disabled>← Vissza</button>
  <span class="step-counter" id="stepCounter">1 / 8</span>
  <button class="btn btn-next" id="nextBtn" onclick="next()">Következő →</button>
</div>

<script>
const steps = [
  // FÁZIS 1 — KÖVETELMÉNY TERVEZÉS
  {
    phase: 'req', phaseLabel: '1. fázis — Követelmény tervezés',
    render: () => `
      <div class="dialogue">
        <div class="bubble-row visible">
          <div class="avatar client">👔</div>
          <div class="bubble client-bubble">
            <div class="speaker c">Ügyfél</div>
            Szeretnék egy webshopot! Lehessen termékeket feltölteni, és az emberek tudjanak rendelni.
          </div>
        </div>
        <div class="bubble-row visible" style="transition-delay:0.2s">
          <div class="avatar dev">💻</div>
          <div class="bubble dev-bubble">
            <div class="speaker d" style="text-align:right">Fejlesztő</div>
            Rendben! Mikor kellene készen lenni?
          </div>
        </div>
        <div class="bubble-row visible" style="transition-delay:0.4s">
          <div class="avatar client">👔</div>
          <div class="bubble client-bubble">
            <div class="speaker c">Ügyfél</div>
            2 hónapon belül. De nem kell minden funkció rögtön — a lényeg az alapok.
          </div>
        </div>
      </div>
      <div class="info-box">
        <strong>RAD elv:</strong> Nem írunk 50 oldalas specifikációt. Csak a legfontosabb követelményeket rögzítjük, gyorsan — aztán nekiállunk!
      </div>
    `
  },
  {
    phase: 'req', phaseLabel: '1. fázis — Követelmény tervezés',
    render: () => `
      <div class="dialogue">
        <div class="bubble-row visible">
          <div class="avatar dev">💻</div>
          <div class="bubble dev-bubble">
            <div class="speaker d" style="text-align:right">Fejlesztő</div>
            Összeszedtem a főbb igényeket. Ezekkel tudunk dolgozni?
          </div>
        </div>
      </div>
      <div class="timeline">
        <div class="timeline-item">
          <div class="tl-dot done">✓</div>
          <div class="tl-content"><strong>Termékek listázása</strong><span>Képpel, árral, leírással</span></div>
        </div>
        <div class="timeline-item">
          <div class="tl-dot done">✓</div>
          <div class="tl-content"><strong>Kosár funkció</strong><span>Termékek hozzáadása, törlése</span></div>
        </div>
        <div class="timeline-item">
          <div class="tl-dot done">✓</div>
          <div class="tl-content"><strong>Rendelés leadása</strong><span>Egyszerű form, email visszaigazolás</span></div>
        </div>
        <div class="timeline-item">
          <div class="tl-dot pending">○</div>
          <div class="tl-content"><strong>Admin felület</strong><span>Termékek kezelése (2. körben)</span></div>
        </div>
      </div>
      <div class="info-box"><strong>Időkeret (timebox):</strong> 8 hét — ha nem fér bele valami, azt a 2. körre halasztjuk.</div>
    `
  },

  // FÁZIS 2 — FELHASZNÁLÓI TERVEZÉS
  {
    phase: 'user', phaseLabel: '2. fázis — Felhasználói tervezés (Prototípus v1)',
    render: () => `
      <div class="dialogue">
        <div class="bubble-row visible">
          <div class="avatar dev">💻</div>
          <div class="bubble dev-bubble">
            <div class="speaker d" style="text-align:right">Fejlesztő</div>
            Csináltam egy gyors vázlatot. Ez alapján elképzeli a webshopot?
          </div>
        </div>
      </div>
      <div class="prototype-box proto-v1">
        <div class="proto-title">// PROTOTÍPUS v1 — Termékoldal vázlat</div>
        <div class="proto-ui">
          <div class="proto-bar w70 accent"></div>
          <div style="display:flex;gap:0.4rem;margin:0.3rem 0">
            <div style="background:var(--border);border-radius:4px;width:60px;height:50px;flex-shrink:0"></div>
            <div style="flex:1;display:flex;flex-direction:column;gap:0.3rem;justify-content:center">
              <div class="proto-bar w90"></div>
              <div class="proto-bar w55"></div>
              <div class="proto-bar w40 accent"></div>
            </div>
          </div>
          <div class="proto-btn v1">+ Kosárba</div>
        </div>
      </div>
      <div class="dialogue">
        <div class="bubble-row visible">
          <div class="avatar client">👔</div>
          <div class="bubble client-bubble">
            <div class="speaker c">Ügyfél</div>
            Hmm, tetszik az elrendezés! De a kosárba gomb legyen nagyobb, és a kép is legyen nagyobb.
          </div>
        </div>
      </div>
    `
  },
  {
    phase: 'user', phaseLabel: '2. fázis — Felhasználói tervezés (Prototípus v2)',
    render: () => `
      <div class="dialogue">
        <div class="bubble-row visible">
          <div class="avatar dev">💻</div>
          <div class="bubble dev-bubble">
            <div class="speaker d" style="text-align:right">Fejlesztő</div>
            Megcsináltam a módosításokat. Most jobb?
          </div>
        </div>
      </div>
      <div class="prototype-box proto-v2">
        <div class="proto-title">// PROTOTÍPUS v2 — Javított verzió</div>
        <div class="proto-ui">
          <div class="proto-bar w70 accent2"></div>
          <div style="background:var(--border);border-radius:6px;width:100%;height:70px;margin:0.4rem 0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.65rem;font-family:'Space Mono',monospace">[ NAGY KÉP ]</div>
          <div class="proto-bar w90"></div>
          <div class="proto-bar w55"></div>
          <div style="margin-top:0.4rem">
            <div class="proto-btn v2" style="padding:0.5rem 1.2rem;font-size:0.7rem">🛒 KOSÁRBA TESZEM</div>
          </div>
        </div>
      </div>
      <div class="dialogue">
        <div class="bubble-row visible">
          <div class="avatar client">👔</div>
          <div class="bubble client-bubble">
            <div class="speaker c">Ügyfél</div>
            Ez már sokkal jobb! Így tovább! ✅
          </div>
        </div>
      </div>
      <div class="info-box"><strong>RAD elv:</strong> Nem vártunk hónapokat — 2 nap alatt kétszer iteráltunk. Az ügyfél már a VALÓDI fejlesztés előtt látta és jóváhagyta a dizájnt.</div>
    `
  },

  // FÁZIS 3 — KONSTRUKCIÓ
  {
    phase: 'cons', phaseLabel: '3. fázis — Konstrukció (Implementáció)',
    render: () => `
      <div class="dialogue">
        <div class="bubble-row visible">
          <div class="avatar dev">💻</div>
          <div class="bubble dev-bubble">
            <div class="speaker d" style="text-align:right">Fejlesztő</div>
            A jóváhagyott prototípus alapján nekiállunk a tényleges kódnak!
          </div>
        </div>
      </div>
      <div class="code-block">
<span class="cm">// Kosár komponens — újrafelhasználható modul</span>
<span class="kw">function</span> <span class="fn">addToCart</span>(product) {
  <span class="kw">const</span> cart = <span class="fn">getCart</span>();
  cart.<span class="fn">push</span>(product);
  <span class="fn">saveCart</span>(cart);
  <span class="fn">updateUI</span>(); <span class="cm">// Azonnal frissül</span>
}

<span class="cm">// Ezt a modult más projektben is használhatjuk! ♻️</span>
      </div>
      <div class="info-box"><strong>RAD elv:</strong> Újrafelhasználható komponenseket írunk — ezeket más projektben is bevethetjük, így nem kell mindent nulláról kezdeni.</div>
    `
  },
  {
    phase: 'cons', phaseLabel: '3. fázis — Konstrukció (Tesztelés)',
    render: () => `
      <div class="dialogue">
        <div class="bubble-row visible">
          <div class="avatar dev">💻</div>
          <div class="bubble dev-bubble">
            <div class="speaker d" style="text-align:right">Fejlesztő</div>
            3. hét végén: az alap funkciók készen vannak, teszteljük!
          </div>
        </div>
        <div class="bubble-row visible" style="transition-delay:0.2s">
          <div class="avatar client">👔</div>
          <div class="bubble client-bubble">
            <div class="speaker c">Ügyfél</div>
            Kipróbáltam — a rendelés leadás lefagy, ha üres a kosár. Javítható?
          </div>
        </div>
        <div class="bubble-row visible" style="transition-delay:0.4s">
          <div class="avatar dev">💻</div>
          <div class="bubble dev-bubble">
            <div class="speaker d" style="text-align:right">Fejlesztő</div>
            Megvan, 20 perc alatt kijavítom! ✓
          </div>
        </div>
      </div>

    render: () => `

const phaseConfig = {
  req:  { badge: 'req',  label: 'KÖVETELMÉNY' },
  user: { badge: 'user', label: 'FELHASZNÁLÓI' },
  cons: { badge: 'cons', label: 'KONSTRUKCIÓ' },
  cut:  { badge: 'cut',  label: 'ÁTADÁS' },
};

let current = 0;

function render() {
  const s = steps[current];
  document.getElementById('scene').innerHTML = s.render();
  
  // Phase
  const pc = phaseConfig[s.phase];
  const badge = document.getElementById('phaseBadge');
  badge.className = 'phase-badge ' + s.phase;
  badge.textContent = pc.label;
  document.getElementById('phaseTitle').textContent = s.phaseLabel;

  // Progress
  for (let i = 0; i < steps.length; i++) {
    const el = document.getElementById('ps' + i);
    el.className = 'progress-step' + (i < current ? ' done' : i === current ? ' active' : '');
  }

  // Nav
  document.getElementById('prevBtn').disabled = current === 0;
  const nextBtn = document.getElementById('nextBtn');
  if (current === steps.length - 1) {
    nextBtn.textContent = '↺ Újra';
    nextBtn.disabled = false;
  } else {
    nextBtn.textContent = 'Következő →';
    nextBtn.disabled = false;
  }
  document.getElementById('stepCounter').textContent = (current + 1) + ' / ' + steps.length;

  // Animate bubbles
  setTimeout(() => {
    document.querySelectorAll('.bubble-row:not(.visible)').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), i * 200);
    });
  }, 50);
}

function next() {
  if (current === steps.length - 1) { current = 0; }
  else { current++; }
  render();
}

function prev() {
  if (current > 0) { current--; render(); }
}

render();
</script>
